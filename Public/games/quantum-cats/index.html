:root {
  color-scheme: dark;
  --ink: #2a2422;          /* marker outline */
  --paper: #fffdf8;        /* panel white */
  --orange: #ff7a1f;       /* button orange */
  --orange-hi: #ffa53a;
  --lab: #1d2330;          /* behind the canvas */
  --muted: #6c625d;
  --win: #26843a;
  --lose: #d6402b;
  --font-ui: 'Ventura Edding', 'Comic Neue', 'Chalkboard SE', 'Segoe Print', cursive;
  --font-num: 'Stanberry', 'Ventura Edding', 'Chalkboard SE', cursive;
}
html, body { height: 100%; }
body { margin: 0; background: var(--lab); color: var(--ink); font-family: var(--font-ui); overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#app { position: fixed; inset: 0; }
#game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
button { font-family: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid #4da3ff; outline-offset: 3px; }
.btn-orange { background: url(img/UI_Button_off_blank_png.webp) center / 100% 100% no-repeat; border: 0; color: #fff; font-size: 1.25rem; font-weight: 700; padding: 0.55em 1.2em 0.6em; min-width: 6.5em; text-shadow: 0 2px 0 #7a2600, 1.5px 1.5px 0 #7a2600, -1.5px 1.5px 0 #7a2600, 1.5px -1.5px 0 #7a2600, -1.5px -1.5px 0 #7a2600; transition: transform .12s ease; }
.btn-orange:hover { background-image: url(img/UI_Button_on_blank_png.webp); }
.btn-orange:active { transform: scale(.95); }
.btn-orange:disabled { filter: grayscale(1) opacity(.55); cursor: default; }
.panel { background: var(--paper); border: 3px solid var(--ink); border-radius: 6px 10px 7px 12px / 10px 6px 12px 7px; box-shadow: 0 6px 0 rgba(0,0,0,.25); position: relative; }
.bar { background: url(img/UI_MenuBar_blank_png.webp) center / 100% 100% no-repeat; color: #fff; font-weight: 700; text-align: center; font-size: 1.5rem; padding: .35em 2.4em; text-wrap: balance; text-shadow: 0 2px 0 #7a2600, 1.5px 1.5px 0 #7a2600, -1.5px 1.5px 0 #7a2600, 1.5px -1.5px 0 #7a2600, -1.5px -1.5px 0 #7a2600; }
.close { position: absolute; top: -14px; right: -14px; width: 44px; height: 44px; border: 0; background: url(img/UI_Close_Button_png.webp) center / contain no-repeat; font-size: 0; }
.scrim { position: absolute; inset: 0; background: rgba(15, 18, 26, .55); display: grid; place-items: center; padding: 16px; z-index: 30; }
[hidden] { display: none !important; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
#game:focus-visible { outline: 4px solid #4da3ff; outline-offset: -4px; }

/* loading + menu */
#loading, #menu { position: absolute; inset: 0; background: #2b2540 url(img/Backdrop_SplashScreen_v3a_png.webp) center / cover no-repeat; z-index: 20; }
#loading { display: grid; place-items: center; z-index: 50; }
.load-box { width: min(420px, 80vw); text-align: center; color: #fff; font-size: 1.3rem; text-shadow: 0 2px 4px #000; display: grid; gap: 12px; }
.load-track { height: 16px; border: 3px solid var(--ink); background: var(--paper); border-radius: 10px; overflow: hidden; }
.load-fill { height: 100%; width: 0; background: var(--orange); transition: width .2s; }
#menu { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; padding: max(16px, env(safe-area-inset-top, 0px)) 16px max(16px, env(safe-area-inset-bottom, 0px)); }
#wordmark { justify-self: center; width: min(560px, 74vw, 85vh); max-height: 26vh; object-fit: contain; filter: drop-shadow(0 6px 10px rgba(0,0,0,.45)); margin-top: 2vh; }
#start { place-self: center; }
#btn-play { width: min(260px, 52vw, 52vh); aspect-ratio: 394 / 297; border: 0; background: url(img/UI_Button_Play_png.webp) center / contain no-repeat; color: #fff; font-size: clamp(1.4rem, min(6vw, 9vh), 3.4rem); font-weight: 700; text-shadow: 0 3px 0 #7a2600, 2px 2px 0 #7a2600, -2px 2px 0 #7a2600, 2px -2px 0 #7a2600, -2px -2px 0 #7a2600; padding: 0 0 0.12em; transition: transform .15s; animation: bob 2.4s ease-in-out infinite; }
#btn-play:hover { transform: scale(1.05); }
@keyframes bob { 50% { translate: 0 -6px; } }
.menu-foot { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; }
.menu-foot .grp { display: flex; gap: 10px; flex-wrap: wrap; }
.menu-foot .btn-orange { font-size: 1.05rem; min-width: 0; }
#levels { position: absolute; left: 50%; top: 50%; translate: -50% -50%; width: min(760px, calc(100% - 32px)); max-height: calc(100% - 32px); overflow: auto; padding: 0 0 18px; z-index: 5; }
#levels .bar { margin: -3px -3px 0; border-radius: 4px; }
.lvl-group { padding: 10px 16px 0; }
.lvl-group h2 { font-size: 1.05rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 6px 4px 4px; font-weight: 400; }
.lvl-row { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.lvl { display: grid; grid-template-columns: minmax(0, 1fr); justify-items: center; gap: 2px; min-width: 0; }
.lvl-icon { width: 100%; max-width: 76px; height: 58px; border: 0; background: none; padding: 0; position: relative; transition: transform .15s; }
.lvl-icon:hover { transform: translateY(-3px) rotate(-3deg); }
.lvl-icon img { width: 100%; height: 100%; object-fit: contain; }
.lvl-icon .help { position: absolute; width: 24px; height: 24px; right: -2px; top: -4px; }
.lvl-icon.spacer { visibility: hidden; }
.lvl-btn { min-width: 0; width: 100%; max-width: 120px; box-sizing: border-box; padding-inline: 0; height: 1.75em; line-height: 1; display: grid; place-items: center; font-family: var(--font-num); font-weight: 400; font-size: 1.7rem; padding: .25em 0 .35em; }
.best { font-size: .85rem; color: var(--muted); min-height: 1.1em; font-variant-numeric: tabular-nums; }

/* education + credits */
.edu { width: min(640px, 100%); max-height: 100%; overflow: auto; }
.edu .bar { margin: -3px -3px 0; border-radius: 4px; }
.edu-body { display: grid; grid-template-columns: 150px 1fr; gap: 6px 18px; padding: 16px 20px 20px; align-items: start; }
.edu-body img { width: 150px; grid-row: span 2; }
.edu-body h3 { margin: 4px 0 0; font-size: 1.4rem; }
.edu-body p { margin: 0; font-size: 1.1rem; line-height: 1.35; max-width: 60ch; }
.facts { grid-column: 1 / -1; background: #fff3e4; border: 2px dashed var(--orange); border-radius: 8px; padding: 10px 14px; }
.facts h4 { margin: 0 0 4px; font-size: 1.1rem; color: #a94300; text-transform: uppercase; letter-spacing: .06em; }
#credits .edu-body { display: block; }
#credit-list h3 { font-size: 1.05rem; text-transform: uppercase; letter-spacing: .05em; color: #a94300; margin: 14px 0 2px; }
#credit-list p { font-size: 1.05rem; line-height: 1.3; }
.logos { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: center; justify-content: flex-start; margin: 22px 0 8px; }
.logos img { height: 40px; width: auto; object-fit: contain; }
.selectable { -webkit-user-select: text; user-select: text; }
@media (max-width: 560px) { .edu-body { grid-template-columns: 1fr; } .edu-body img { width: 110px; grid-row: auto; } }

/* HUD */
#hud { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
#hud > * { pointer-events: auto; }
.hud-top { position: absolute; top: max(10px, env(safe-area-inset-top, 0px)); left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: start; gap: 10px; pointer-events: none; }
.hud-top > * { pointer-events: auto; }
.scorecard { display: grid; gap: 4px; padding: 8px 14px 9px; font-size: 1.15rem; justify-items: start; line-height: 1.1; }
#hud-box { display: flex; align-items: center; gap: 10px; font-family: var(--font-num); font-size: 1.6rem; line-height: 1; transform-origin: left center; }
#hud-box img { height: 1.4em; width: auto; display: block; }
#hud-box.pop { animation: pop .45s ease; }
@keyframes pop { 40% { transform: scale(1.25); } }
#hud-score, #hud-cats { font-variant-numeric: tabular-nums; }
#lvl-num { font-size: .9rem; color: var(--muted); }
#tut { max-width: min(380px, 46vw); padding: 8px 50px 10px 14px; }
#tut-name { font-weight: 700; font-size: 1.2rem; }
#tut-desc { font-size: 1rem; line-height: 1.3; margin-top: 2px; }
#tut-toggle { position: absolute; right: 4px; top: 4px; width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--ink); background: #b84800; color: #fff; font-size: 1.3rem; font-weight: 700; line-height: 1; }
#btn-options { width: 52px; height: 52px; border: 3px solid var(--ink); border-radius: 50%; background: var(--paper); display: grid; place-items: center; padding: 0; box-shadow: 0 4px 0 rgba(0,0,0,.25); }
#btn-options span { display: block; width: 22px; height: 3px; background: var(--ink); box-shadow: 0 -7px 0 var(--ink), 0 7px 0 var(--ink); border-radius: 2px; }
.optbox { padding: 18px 22px 22px; display: grid; gap: 12px; width: min(300px, 100%); }
.optbox .bar { margin: -18px -22px 4px; border-radius: 4px; }
#results .panel { width: min(440px, 100%); text-align: center; padding: 0 0 20px; }
#res-title { font-size: 2.4rem; font-weight: 700; margin: 14px 0 4px; }
#res-title.won { color: var(--win); } #res-title.lost { color: var(--lose); }
#res-lines { display: grid; gap: 4px; font-size: 1.25rem; padding: 0 22px; font-variant-numeric: tabular-nums; }
#res-lines .total { font-size: 1.55rem; font-weight: 700; margin-top: 4px; }
#res-lines .tip { font-size: 1.1rem; line-height: 1.35; color: var(--muted); }
.res-btns { display: flex; justify-content: center; gap: 8px; margin-top: 18px; flex-wrap: wrap; padding: 0 12px; }
.res-btns .btn-orange { min-width: 5.5em; }
#rotate { position: absolute; left: 50%; bottom: 14px; translate: -50% 0; background: rgba(0,0,0,.65); color: #fff; padding: 8px 14px; border-radius: 20px; font-size: .95rem; z-index: 40; display: none; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
@media (orientation: portrait) and (max-width: 700px) { body.ingame #rotate { display: block; } #tut { max-width: 52vw; } }
@media (max-height: 460px) { .lvl-group h2 { margin: 2px 4px; font-size: .9rem; } .lvl-btn { font-size: 1.3rem; } #levels .bar { font-size: 1.2rem; }  .scorecard { font-size: .95rem; } #hud-box { font-size: 1.25rem; } #tut-desc { font-size: .9rem; } .lvl-icon { height: 42px; } }

<div id="app">
  <h1 class="sr-only">Quantum Cats</h1>
  <canvas id="game" tabindex="-1" data-tl="game-label" aria-describedby="kb-help"></canvas>
  <p id="kb-help" class="sr-only" data-t="kb-help"></p>
  <div id="sr" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <div id="hud" hidden>
    <div class="hud-top">
      <div class="panel scorecard">
        <div id="hud-box" title=""><img src="img/hud_box_icon.webp" alt=""><span class="sr-only" data-t="boxes-label"></span> <span id="hud-boxes">0/0</span></div>
        <div id="hud-score">Score: 0</div>
        <div id="hud-cats"></div>
        <div id="lvl-num"></div>
      </div>
      <div id="tut" class="panel" hidden>
        <div id="tut-name"></div>
        <div id="tut-desc"></div>
        <button id="tut-toggle" aria-controls="tut-desc"><span aria-hidden="true">×</span></button>
      </div>
      <button id="btn-options" data-tl="options" aria-expanded="false" aria-controls="options"><span></span></button>
    </div>
    <div id="options" class="scrim" hidden>
      <div class="panel optbox" role="dialog" aria-modal="true" aria-labelledby="opt-title">
        <div class="bar" id="opt-title" data-t="options"></div>
        <button class="btn-orange" id="opt-reset" data-t="reset"></button>
        <button class="btn-orange" id="opt-menu" data-t="menu"></button>
        <button class="btn-orange" id="opt-sound"></button>
        <button class="btn-orange" id="opt-music"></button>
        <button class="close" id="opt-close" data-tl="close">×</button>
      </div>
    </div>
    <div id="results" class="scrim" hidden>
      <div class="panel" role="dialog" aria-modal="true" aria-labelledby="res-title" aria-describedby="res-lines">
        <div id="res-title"></div>
        <div id="res-lines"></div>
        <div class="res-btns">
          <button class="btn-orange" id="res-menu" data-t="wl-menu"></button>
          <button class="btn-orange" id="res-retry" data-t="retry"></button>
          <button class="btn-orange" id="res-next" data-t="next"></button>
        </div>
      </div>
    </div>
  </div>

  <div id="menu">
    <img id="wordmark" src="img/Backdrop_QC_Wordmark_ONLY_png.webp" alt="Quantum Cats">
    <div id="start"><button id="btn-play" data-t="play"></button></div>
    <div id="levels" class="panel" hidden role="dialog" aria-modal="true" aria-labelledby="lv-title">
      <div class="bar" id="lv-title" data-t="select-a-level"></div>
      <button class="close" data-tl="close">×</button>
      <div class="lvl-group"><h2 data-t="cat-levels"></h2><div class="lvl-row" id="row-cats"></div></div>
      <div class="lvl-group"><h2 data-t="lab-levels"></h2><div class="lvl-row" id="row-lab"></div></div>
    </div>
    <div class="menu-foot">
      <div class="grp"><button class="btn-orange" id="btn-lang">Français</button><button class="btn-orange" id="menu-sound"></button><button class="btn-orange" id="menu-music"></button></div>
      <div class="grp"><button class="btn-orange" id="btn-credits" data-t="credits"></button></div>
    </div>
  </div>

  <div id="edu" class="scrim" hidden>
    <div class="panel edu" role="dialog" aria-modal="true" aria-labelledby="edu-title">
      <div class="bar" id="edu-title"></div>
      <button class="close" data-tl="close">×</button>
      <div class="edu-body">
        <img id="edu-img" alt="">
        <h3 id="edu-name"></h3>
        <p id="edu-bio"></p>
        <div class="facts"><h4 data-t="facts"></h4><p id="edu-facts"></p></div>
      </div>
    </div>
  </div>
  <div id="credits" class="scrim" hidden>
    <div class="panel edu" role="dialog" aria-modal="true" aria-labelledby="cr-title">
      <div class="bar" id="cr-title" data-t="credits-title"></div>
      <button class="close" data-tl="close">×</button>
      <div class="edu-body">
        <div id="credit-list"></div>
        <div class="logos">
          <img src="img/UW_IQC_RGB_logo_jpg.webp" alt="Institute for Quantum Computing, University of Waterloo">
          <img src="img/GI_white_background_jpg.webp" alt="The Games Institute">
          <img src="img/code_mortar_png.webp" alt="Code + Mortar">
          <img src="img/OntarioLogo_png.webp" alt="Ontario">
          <img src="img/Canada_png.webp" alt="Canada">
          <img src="img/sshrc_fip_wordmark_eng_jpg.webp" alt="Social Sciences and Humanities Research Council of Canada" style="height:18px">
        </div>
      </div>
    </div>
  </div>

  <div id="loading"><div class="load-box"><div data-t="loading">Loading…</div><div class="load-track"><div class="load-fill" id="load-fill"></div></div></div></div>
  <div id="rotate" data-t="rotate"></div>
</div>
