# R editor kernel (xr / xeus-r), built into Public/jupyterlite by
# scripts/build-jupyterlite.sh.
#
# SEPARATE from environment-python.yml on purpose — see the note there: one
# shared env makes every kernel boot fetch both languages' payloads.
#
# Deliberately bare; add r-* packages here as courses need them, remembering
# that the editor has no runtime install path (CSP is connect-src 'self').
#
# Channel: emscripten-forge-4x. The older `emscripten-forge-dev` alias serves
# the 3x (emscripten 3.x ABI) channel, frozen since 2026-04-09.
name: chickadee-r
channels:
  - https://repo.prefix.dev/emscripten-forge-4x
  - https://repo.prefix.dev/conda-forge
dependencies:
  - xeus-r
