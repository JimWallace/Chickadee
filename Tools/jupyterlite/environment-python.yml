# Python editor kernel (xpython / xeus-python), built into Public/jupyterlite by
# scripts/build-jupyterlite.sh.
#
# SEPARATE from environment-r.yml on purpose. jupyterlite-xeus packs one
# `kernel_packages` payload per env and the kernel fetches its whole env at
# boot — so a single shared Python+R env made every Python boot pull all ~32 MB
# of r-base and every R boot pull numpy/pandas/matplotlib. That was slow enough
# to time out the editor probes ("kernel never reported idle"). Two envs keep
# each boot to its own language.
#
# Anything a student imports must be baked in here. The editor's CSP is
# connect-src 'self', so there is no runtime pip/piplite escape hatch — a
# missing package is an ImportError with no recovery.
#
# Channel: emscripten-forge-4x. The older `emscripten-forge-dev` alias serves
# the 3x (emscripten 3.x ABI) channel, which stopped receiving builds of any
# kind on 2026-04-09 — frozen, not merely older.
name: chickadee-python
channels:
  - https://repo.prefix.dev/emscripten-forge-4x
  - https://repo.prefix.dev/conda-forge
dependencies:
  - xeus-python
  - numpy
  - pandas
  - matplotlib
  # Added when browser grading moved onto this env (#1271): the grader used to
  # be Pyodide, which resolved these from its 363-package index at run time, and
  # a fixed env has no runtime escape hatch under `connect-src 'self'`. Baking
  # them in keeps the imports that already worked working — and, because the
  # editor runs this same env, an instructor can now use them while authoring
  # too, which Pyodide-only grading never allowed.
  #
  # TRIMMED in v0.5.19: `scikit-learn` and `sympy` were dropped. Both were added
  # to preserve parity with what Pyodide *could* resolve, not because any lab
  # needed them, and both are expensive — scikit-learn 10.8s to import (over the
  # default per-test limit on its own) and sympy 5.9s. Dropping scikit-learn also
  # drops `requests` -> `urllib3`, whose emscripten module has to be patched or
  # the kernel does not boot at all; the patch and its guard stay in place, since
  # they cost nothing when the package is absent and a future addition could
  # bring it back.
  #
  # Three packages the old Pyodide index carried have NO emscripten-forge build
  # and so cannot be added here: networkx, seaborn and plotly. They need an
  # upstream build before they can come back.
  #
  # `requests` was on that list and should not have been — it builds fine, and
  # in fact arrives transitively via scikit-learn. It is moot as a capability
  # regardless (the CSP is `connect-src 'self'`), but it is NOT moot as a
  # hazard: it drags in urllib3, whose emscripten module crashes the kernel on
  # import unless scripts/patch-xeus-python-http.py neuters it. See that script
  # and the urllib3 assertion in scripts/check-xeus-vendored.sh.
  - scipy
  - statsmodels
  - pillow

# COST, measured — the same two-part cost the R env documents, milder here but
# not free. Re-measure with Tools/browser-grading-smoke rather than trusting
# these to age well.
#
# 1. Boot, paid by every user whether or not they import anything: the kernel
#    fetches and mounts the whole env. Single-run samples for this 85 MB env
#    range 8.2-10.1s, so treat it as "about nine seconds" and no finer.
#
# 2. Import, paid only by a script that uses the package. Measured with all
#    eight of the then-shipped packages present:
#
#      scikit-learn 10.8s | sympy 5.9s | pandas 4.8s | matplotlib 1.3s
#      numpy 0.9s | statsmodels 0.3s | scipy 0.1s | PIL 0.0s
#
#    The first two are why they are no longer here. pandas at 4.8s is half the
#    default 10-SECOND per-test limit and is unavoidable — it is what the course
#    teaches. (Ordering matters as it does in R: scipy measures 0.1s only because
#    numpy and pandas came first in that run.)
#
# WHERE THE SIZE IS, which is not where the import cost is. `openblas` is 16 MB,
# the largest single package here, and NOTHING but scipy needs it — numpy does
# not. scipy (11 MB) plus openblas is therefore ~27 MB of a ~69 MB env, or about
# 40% of everyone's boot payload, for a package whose *import* is nearly free.
# statsmodels is the only remaining reason scipy is here. Dropping both is the
# single biggest boot saving available, and is a live option if no lab needs
# them — it is a course decision, not an engineering one.
#
# Both costs argue for restraint. The env is not a place to put things that
# might be handy — every addition is paid at boot by everyone, and a heavy
# import is paid against a 10s budget by whoever uses it.
