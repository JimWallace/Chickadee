# Python editor kernel (xpython / xeus-python), built into Public/jupyterlite by
# scripts/build-jupyterlite.sh.
#
# SEPARATE from environment-r.yml on purpose. jupyterlite-xeus packs one
# `kernel_packages` payload per env and the kernel fetches its whole env at
# boot — so a single shared Python+R env made every Python boot pull all ~32 MB
# of r-base and every R boot pull numpy/pandas/matplotlib. That was slow enough
# to time out the editor probes ("kernel never reported idle"). Two envs keep
# each boot to its own language.
#
# Anything a student imports must be baked in here. The editor's CSP is
# connect-src 'self', so there is no runtime pip/piplite escape hatch — a
# missing package is an ImportError with no recovery.
#
# Channel: emscripten-forge-4x. The older `emscripten-forge-dev` alias serves
# the 3x (emscripten 3.x ABI) channel, which stopped receiving builds of any
# kind on 2026-04-09 — frozen, not merely older.
name: chickadee-python
channels:
  - https://repo.prefix.dev/emscripten-forge-4x
  - https://repo.prefix.dev/conda-forge
dependencies:
  - xeus-python
  - numpy
  - pandas
  - matplotlib
  # Added when browser grading moved onto this env (#1271): the grader used to
  # be Pyodide, which resolved these from its 363-package index at run time, and
  # a fixed env has no runtime escape hatch under `connect-src 'self'`. Baking
  # them in keeps the imports that already worked working — and, because the
  # editor runs this same env, an instructor can now use them while authoring
  # too, which Pyodide-only grading never allowed.
  #
  # Three packages the old Pyodide index carried have NO emscripten-forge build
  # and so cannot be added here: networkx, seaborn and plotly. They need an
  # upstream build before they can come back.
  #
  # `requests` was on that list and should not have been — it builds fine, and
  # in fact arrives transitively via scikit-learn. It is moot as a capability
  # regardless (the CSP is `connect-src 'self'`), but it is NOT moot as a
  # hazard: it drags in urllib3, whose emscripten module crashes the kernel on
  # import unless scripts/patch-xeus-python-http.py neuters it. See that script
  # and the urllib3 assertion in scripts/check-xeus-vendored.sh.
  - scipy
  - sympy
  - scikit-learn
  - statsmodels
  - pillow
