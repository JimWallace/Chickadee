# Chickadee — Docker Compose
#
# Quick start (local / dev):
#   cp .env.example .env
#   # Edit .env for auth / URL settings as needed
#   docker compose up -d
#   open http://localhost:8080
#
# Production (with nginx + HTTPS):
#   - Set PUBLIC_BASE_URL, ENFORCE_HTTPS, SESSION_COOKIE_SECURE in .env
#   - Uncomment the nginx service below and remove the "8080:8080" port mapping
#   - Follow the Let's Encrypt instructions in deploy/README.md
#
# Scaling the runner:
#   docker compose up -d --scale runner=3

services:

  # ----------------------------------------------------------------
  # Server — Vapor API + Leaf web UI
  # ----------------------------------------------------------------
  server:
    build: .                              # used by `docker compose up --build` (local dev)
    image: ghcr.io/jimwallace/chickadee:latest  # pulled by `docker compose pull` (production)
    restart: unless-stopped
    ports:
      - "8080:8080"   # remove this if using the nginx service below
    volumes:
      - chickadee-data:/data
    environment:
      # Auth mode: "local" uses username/password (good for dev and self-hosted).
      # Switch to "sso" or "dual" and fill in OIDC_* vars for SSO.
      AUTH_MODE:                    ${AUTH_MODE:-local}
      ENABLE_NON_SSO_AUTH_MODES:    ${ENABLE_NON_SSO_AUTH_MODES:-true}

      # Database backend:
      #   - Leave unset (or set DATABASE_BACKEND=sqlite) to keep the default SQLite path.
      #   - To use PostgreSQL, uncomment the optional db service below and set:
      #       DATABASE_BACKEND=postgres
      #       DATABASE_HOST=db
      #       DATABASE_PORT=5432
      #       DATABASE_NAME=chickadee
      #       DATABASE_USER=chickadee
      #       DATABASE_PASSWORD=change-me
      DATABASE_BACKEND:             ${DATABASE_BACKEND:-sqlite}
      SQLITE_PATH:                  ${SQLITE_PATH:-}
      DATABASE_HOST:                ${DATABASE_HOST:-}
      DATABASE_PORT:                ${DATABASE_PORT:-}
      DATABASE_NAME:                ${DATABASE_NAME:-}
      DATABASE_USER:                ${DATABASE_USER:-}
      DATABASE_PASSWORD:            ${DATABASE_PASSWORD:-}

      # Public URL — set to your domain in production (e.g. https://chickadee.example.com)
      PUBLIC_BASE_URL:              ${PUBLIC_BASE_URL:-}
      ENFORCE_HTTPS:                ${ENFORCE_HTTPS:-false}
      SESSION_COOKIE_SECURE:        ${SESSION_COOKIE_SECURE:-false}

      # Outbound forward proxy — set on networks where direct egress is blocked
      # (e.g. the UWaterloo NAT'd VLAN) so the OIDC discovery/JWKS/token and
      # BrightSpace calls go through squid instead of connectTimeout-ing at boot.
      # e.g. OUTBOUND_HTTP_PROXY=http://172.16.136.36:3128
      OUTBOUND_HTTP_PROXY:          ${OUTBOUND_HTTP_PROXY:-}

      # OIDC / SSO — only needed when AUTH_MODE=sso or dual
      OIDC_AUTH_SERVER:             ${OIDC_AUTH_SERVER:-}
      OIDC_CLIENT_ID:               ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET:           ${OIDC_CLIENT_SECRET:-}
      OIDC_CALLBACK:                ${OIDC_CALLBACK:-}
      OIDC_USERNAME_CLAIM:          ${OIDC_USERNAME_CLAIM:-}
      OIDC_EMAIL_CLAIM:             ${OIDC_EMAIL_CLAIM:-}
      SSO_ADMIN_USERS:              ${SSO_ADMIN_USERS:-}

      # BrightSpace grade sync — leave unset to disable
      # Credentials come from the UW D2L credential harvester (d2l-api-cred.fast.uwaterloo.ca)
      BRIGHTSPACE_URL:              ${BRIGHTSPACE_URL:-}
      BRIGHTSPACE_APP_ID:           ${BRIGHTSPACE_APP_ID:-}
      BRIGHTSPACE_APP_KEY:          ${BRIGHTSPACE_APP_KEY:-}
      BRIGHTSPACE_USER_ID:          ${BRIGHTSPACE_USER_ID:-}
      BRIGHTSPACE_USER_KEY:         ${BRIGHTSPACE_USER_KEY:-}
      BRIGHTSPACE_SYNC_DEBOUNCE_SECS: ${BRIGHTSPACE_SYNC_DEBOUNCE_SECS:-}

      LOG_LEVEL:                    ${LOG_LEVEL:-info}

      # Runner <-> server HMAC secret. Required: it is the only channel by
      # which the runner container learns the secret, now that it no longer
      # mounts the data volume. Generate one with the command in .env.example.
      RUNNER_SHARED_SECRET:         ${RUNNER_SHARED_SECRET:?set RUNNER_SHARED_SECRET in .env - see .env.example}
    networks:
      - chickadee
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ----------------------------------------------------------------
  # Runner — polls the server for pending jobs and runs test scripts
  # ----------------------------------------------------------------
  # The runner deliberately mounts NO volumes. It used to mount the data
  # volume read-only, purely to read /data/.worker-secret — but that volume
  # also holds the SQLite database, every submission, and the results tree,
  # and a test script runs as the same uid as the runner, so 0600 on the
  # secret file was no barrier. A student script could therefore read the
  # HMAC secret and sign worker API calls, defeating the environment
  # allowlist in mergedScriptEnvironment that exists to withhold exactly
  # that. Sandboxing does not close it either: the Linux sandbox creates no
  # mount namespace. The secret now arrives by environment variable, which
  # the runner already prefers over any file (resolveWorkerSharedSecret),
  # and the runner container can no longer see student data at all.
  runner:
    image: ghcr.io/jimwallace/chickadee:latest
    entrypoint: ["/bin/sh", "-lc"]
    environment:
      RUNNER_SHARED_SECRET: ${RUNNER_SHARED_SECRET:?set RUNNER_SHARED_SECRET in .env - see .env.example}
    command:
      - >
        exec /app/chickadee-runner
        --api-base-url http://server:8080
        --worker-id "${RUNNER_WORKER_ID:-runner-${HOSTNAME}}"
        --max-jobs "${RUNNER_MAX_JOBS:-4}"
      # Note: --sandbox is intentionally omitted here.
      # Docker already provides container-level process isolation.
      # To enable OS-level sandboxing (Linux unshare namespaces), add
      # "--sandbox" here. That buys network isolation for test scripts;
      # it does not restrict filesystem access, which is why the data
      # volume is unmounted above rather than sandboxed around.
    networks:
      - chickadee
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  # ----------------------------------------------------------------
  # db — optional PostgreSQL service
  #
  # Leave this commented out to keep the default SQLite deployment path.
  # To enable PostgreSQL:
  #   1. Uncomment this service.
  #   2. Set DATABASE_BACKEND=postgres on the server service.
  #   3. Set DATABASE_HOST=db and the matching DATABASE_* credentials.
  # ----------------------------------------------------------------
  # db:
  #   image: postgres:16
  #   restart: unless-stopped
  #   # Modest tuning over the stock image. max_connections must clear the
  #   # app's pool ceiling of 4 connections x event loops (loops = host
  #   # cores): 200 covers a 32-core host with headroom, where the stock 100
  #   # would not. Per-session statement/idle bounds are set by the app
  #   # itself (PostgresSessionBounds in DatabaseConfiguration.swift), not
  #   # here.
  #   command: >-
  #     postgres
  #     -c shared_buffers=256MB
  #     -c max_connections=200
  #   environment:
  #     POSTGRES_DB: chickadee
  #     POSTGRES_USER: chickadee
  #     POSTGRES_PASSWORD: change-me
  #   volumes:
  #     - chickadee-postgres:/var/lib/postgresql/data
  #   networks:
  #     - chickadee
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U chickadee -d chickadee"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # ----------------------------------------------------------------
  # nginx — reverse proxy with JupyterLite headers
  #
  # Uncomment to use nginx instead of exposing :8080 directly.
  # Also remove the "8080:8080" port mapping from the server service.
  # ----------------------------------------------------------------
  # nginx:
  #   image: nginx:alpine
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./deploy/nginx-docker.conf:/etc/nginx/conf.d/chickadee.conf:ro
  #     - ./deploy/error-pages/maintenance.html:/usr/share/nginx/html/maintenance.html:ro
  #     - certbot-certs:/etc/letsencrypt:ro
  #     - certbot-www:/var/www/certbot:ro
  #   depends_on:
  #     - server
  #   networks:
  #     - chickadee

volumes:
  chickadee-data:   # SQLite database, submissions, test setups, results
  chickadee-postgres: # PostgreSQL data directory when using the optional db service
  certbot-certs:    # TLS certificates (populated by certbot — see deploy/README.md)
  certbot-www:      # ACME HTTP-01 challenge webroot

networks:
  chickadee:
    driver: bridge
