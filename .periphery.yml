# Periphery Pro configuration: the unused-code scan.
# .github/workflows/dead-code.yml runs it every week on Linux.
# docs/dead-code-scan.md explains the report and these options.
#
# retain_public stays off. The package builds three executables, and the tests
# import every module, so an unused public declaration is real dead code.
#
# The encoder reads Codable properties, and Periphery does not see that read.
# Without the next two options, every Vapor Content field is reported. In the
# first trial scan, 201 of 338 results were that noise.
retain_codable_properties: true
retain_assign_only_properties: true
