name: Browser probe setup
description: >
  Shared scaffold for the browser probe / smoke / visual jobs: restore the
  shared Swift build cache, build chickadee-server, and install Node +
  Playwright (engine download cached). Callers run actions/checkout first,
  inside the ghcr.io/jimwallace/chickadee/swift container. The build cache
  below matches exactly or not at all, so no git mtime restore is needed
  and a shallow checkout is enough.

inputs:
  browser:
    description: "Playwright engine to install (chromium | webkit)"
    required: true
  node-project:
    description: "Directory holding the npm project (package-lock.json) to install"
    required: false
    default: "Tools/editor-smoke-test"

runs:
  using: composite
  steps:
    - name: Resolve toolchain cache key
      id: toolchain
      shell: bash
      run: echo "key=$(swift --version | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

    # Read-only restore of the shared build cache (same exact key as the Swift
    # Tests `build` job). EXACT-MATCH ONLY — a restore-keys prefix fallback
    # would incrementally build over a mismatched tree, which is unsound for
    # the mangled-symbol reason documented in swift-tests.yml. On a hit,
    # building the server product is near-no-op; on a miss it builds cold.
    - name: Restore build artifacts
      id: shared-build-cache
      uses: actions/cache/restore@v6
      with:
        path: .build
        key: ${{ runner.os }}-build-v4-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.resolved', 'Package.swift', 'Sources/**', 'Tests/**') }}

    # Fallback cache, owned by the probes, used only when the shared key missed.
    #
    # The shared key is written by `build` in swift-tests.yml — a different
    # workflow, so `needs:` cannot order a probe after it. On any PR touching
    # Sources/** or Tests/** the key is new, and whether a probe hits it is a
    # race against that build finishing. Losing the race means a cold Swift
    # build (~16 min of a 50 min budget), and losing it *repeatedly* is what
    # made re-running a probe on the same commit cost the same 16 minutes every
    # time — nothing the probes did ever populated a key they could read back.
    #
    # This one they own: same exact-match discipline (no restore-keys prefix
    # fallback, which would build incrementally over a mismatched tree), same
    # source hash, different namespace. Deliberately NOT the shared key: a probe
    # that won that race would publish a `.build` holding only
    # chickadee-server, and the swift-tests jobs restoring it would have to
    # rebuild the test targets — trading their time for ours.
    - name: Restore/save probe build cache
      if: steps.shared-build-cache.outputs.cache-hit != 'true'
      uses: actions/cache@v6
      with:
        path: .build
        key: ${{ runner.os }}-probebuild-v1-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.resolved', 'Package.swift', 'Sources/**', 'Tests/**') }}

    - name: Build chickadee-server
      shell: bash
      run: swift build --product chickadee-server

    # Node and npm are baked into the swift-ci image, so the normal path here is
    # to install nothing. The apt fallback stays for two cases that are real:
    # a caller still on the plain mirror, and the window where this action runs
    # before mirror-images.yml has republished swift-ci with a Dockerfile change.
    # Deleting it outright would make those a hard failure instead of a slow path.
    #
    # apt against archive.ubuntu.com is the least reliable thing in this action —
    # an unauthenticated plain-HTTP fetch of ~40 packages from a mirror we do not
    # control — so when it does run it retries. On 2026-08-04 it was unreachable,
    # the step exited 100, and the required editor-smoke gate went red because of
    # an Ubuntu mirror. `npm ci` stays outside the loop: it hits a different
    # registry, and a genuine lockfile problem should fail once and clearly.
    - name: Install Node and npm dependencies
      shell: bash
      working-directory: ${{ inputs.node-project }}
      env:
        # Keep NODE_VERSION in step with .github/docker/ci-image/Dockerfile's
        # ARG NODE_VERSION. They are allowed to differ briefly — that is the
        # point of this fallback — but a permanent gap means every probe job
        # pays a ~40 MB download the image should have baked in.
        NODE_VERSION: "24.21.0"
        # Playwright's floor. Raise when Playwright raises its engine requirement.
        MIN_NODE_MAJOR: "20"
      run: |
        set -eu

        # The check is on the VERSION, not just presence. Playwright dropped
        # Node 18 at 1.63, and Ubuntu noble's node was 18.19.1 — `npx playwright
        # install` then exits 1 before any probe runs. A presence-only check
        # said "already present — skipping apt" and walked straight into it.
        # Resolute ships 22.22, so the version check now passes on a bare image,
        # but it stays because the floor is Playwright's to raise, not the
        # distro's to satisfy.
        node_major=0
        if command -v node >/dev/null 2>&1 && command -v npm >/dev/null 2>&1; then
          node_major="$(node --version | sed 's/^v\([0-9]*\).*/\1/')"
        fi

        if [ "$node_major" -ge "$MIN_NODE_MAJOR" ]; then
          echo "node $(node --version) and npm $(npm --version) already present — skipping install"
        else
          if [ "$node_major" = 0 ]; then
            echo "::warning::node/npm missing from the image; installing Node ${NODE_VERSION}"
          else
            echo "::warning::image node is $(node --version), below v${MIN_NODE_MAJOR}; installing Node ${NODE_VERSION}"
          fi
          # From nodejs.org rather than apt: noble could not offer >=20 at all,
          # and archive.ubuntu.com is the least reliable thing in this action (on
          # 2026-08-04 it was unreachable and took the required editor-smoke gate
          # red with it). Resolute could serve it now, but apt floats the version
          # and this path is the fallback for an image that is already wrong, so
          # it keeps the explicit pin. Retried for the same reason.
          for attempt in 1 2 3; do
            if curl -fsSL --max-time 180 \
                "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.gz" \
                -o /tmp/node.tar.gz \
              && tar -xzf /tmp/node.tar.gz -C /usr/local --strip-components=1 \
                --exclude=CHANGELOG.md --exclude=LICENSE --exclude=README.md; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::could not install Node ${NODE_VERSION} after 3 attempts."
              exit 1
            fi
            echo "::warning::node install attempt ${attempt} failed; retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          hash -r
          echo "installed node $(node --version) and npm $(npm --version)"
        fi
        npm ci

    # The engine download (~150 MB) is the slow, network-dependent part of
    # `playwright install`; cache it keyed on the lockfile so probe legs stop
    # re-downloading it every run. `--with-deps` still apt-installs the
    # engine's system libraries each run (not cacheable inside the container).
    - name: Cache Playwright ${{ inputs.browser }} download
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ inputs.browser }}-${{ hashFiles(format('{0}/package-lock.json', inputs.node-project)) }}

    - name: Install Playwright ${{ inputs.browser }} engine
      shell: bash
      working-directory: ${{ inputs.node-project }}
      run: npx playwright install --with-deps ${{ inputs.browser }}
