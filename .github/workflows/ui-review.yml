name: UI review

# Runs the `ui-review` agent on every pull request that touches the UI layer,
# so the review CLAUDE.md calls unconditional no longer depends on the agent
# being available in whichever session wrote the change.
#
# The job is agent-pr-review.yml, which interaction-review.yml calls too. Its
# header says how the review runs: a read-only model job, and a job with no
# model that posts the report and the inline findings.
#
# WHAT IT GATES. The post job fails only when the review completes and
# requests changes: a duplicate of a vocabulary component, an idiom heavier
# than the cheapest that fits, copy over budget, or a tooltip that is the only
# copy of something a reader needs. An infrastructure failure (no API key, a
# model outage, a timeout) is a warning and a green job.
#
# WHAT IT NEEDS. One repository secret, ANTHROPIC_API_KEY (or
# CLAUDE_CODE_OAUTH_TOKEN for a Claude subscription). Without either the job
# says so and passes.
#
# The paths filter is the rule in CLAUDE.md: the Elementary views in
# Sources/APIServer/Views/ (every page is one), Public/styles.css, and
# first-party Public/*.js (one level deep, so the vendored trees under
# Public/vendor/ and Public/jupyterlite/ do not trigger it). The brief, this
# file and the shared parts it runs are on the list, so a change to any of
# them gets a run that proves it still works.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - "Sources/APIServer/Views/**"
      - "Public/styles.css"
      - "Public/*.js"
      - ".claude/agents/ui-review.md"
      - ".github/workflows/ui-review.yml"
      - ".github/workflows/agent-pr-review.yml"
      - ".github/actions/claude-agent/**"
      - "scripts/ci-agent-sanitize.sh"

permissions: {}

concurrency:
  # Per PR, and cancel superseded runs: only the latest push is worth reviewing.
  group: ui-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ui-review:
    # The most that agent-pr-review.yml may use. Its `review` job, where the
    # model runs, narrows this to read-only.
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/agent-pr-review.yml
    with:
      agent: ui-review
      brief-note: "Limit the review to the paths the brief names."
      max-turns: "40"
      timeout-minutes: 20
      allowed-tools: "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
      gate: true
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
