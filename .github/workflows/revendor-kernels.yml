name: Re-vendor xeus kernels

# Rebuilds the vendored JupyterLite bundle and its xeus kernel environments
# (chickadee-python, chickadee-r, chickadee-lua, chickadee-octave) and commits
# the result.
#
# WHY THIS EXISTS. The kernels are built by jupyterlite-xeus, which solves each
# conda environment at build time — micromamba plus network to repo.prefix.dev.
# For a long time that was believed to be impossible in CI, so re-vendoring was
# documented as a manual maintainer-machine step. It is not impossible: a hosted
# runner has unrestricted network, and micromamba is a single ~7 MB download.
#
# The cost of believing otherwise was concrete. `Tools/jupyterlite/
# environment-python.yml` gained scipy, sympy, scikit-learn and statsmodels, a
# release described them as available, and the vendored bytes contained none of
# them — because adding a name to the env file changes nothing until this build
# runs. A student importing scipy would have hit an unrecoverable ImportError at
# grade time. `scripts/check-env-vendored-sync.sh` now fails a PR in that state
# and points here; this workflow is what resolves it.
#
# WHAT IT DOES NOT DO. It never runs on `push` or on a schedule of its own, and
# it never commits onto unrelated work. The output is ~100 MB of regenerated
# binary assets whose filenames are content hashed. It runs when someone asks
# for it, when a PR changes what the environments contain, or when the weekly
# kernel currency check (kernel-currency.yml) finds the kernels behind their
# channels.
#
# PUBLISH MODE (`publish: true`). This is how kernels ship without a person.
# kernel-currency.yml dispatches it only when the channels have moved, because
# a diff cannot decide that: xpython.wasm differs by 16 bytes on every build
# (see below). It rebuilds from `main`, verifies, puts the rebuild and a
# changelog fragment on a new `kernels/revendor-<run id>` branch, opens a pull
# request and enables auto-merge. The pull request's CI, the browser grading
# and editor smoke included, tests the new kernels before they merge, and
# auto-release then deploys them like any other merge. If a re-vendor pull
# request is already open, it does nothing.
#
# WHOSE TOKEN. Both pushing modes push with the RELEASE_TOKEN secret, the one
# auto-release.yml uses. GITHUB_TOKEN cannot do either job: the branch ruleset
# rejects its push (GH013, "Required status check editor-smoke-gate is
# expected"), and a pull request opened with it starts no CI, so auto-merge
# would merge untested kernels or wait forever. Publish mode refuses to run
# without RELEASE_TOKEN.
#
# Auto-release needs only Contents: read & write from that token. Publish mode
# also opens a pull request and enables auto-merge, so it needs Pull requests:
# read & write too. Without it the branch push succeeds and `gh pr create`
# fails with "Resource not accessible by personal access token
# (createPullRequest)" (docs/release-process.md).
#
# ONLY `workflow_dispatch` commits. A pull_request run rebuilds and verifies but
# never pushes, and that is not caution — it is required for termination.
# `xpython.wasm` embeds the absolute path of the temp directory it was built in
# (`/tmp/tmpXXXXXXXX/_env/envs/chickadee-python`), which `tempfile` randomises
# per run. The kernel is therefore NOT byte-reproducible: two builds of the same
# environment differ, by exactly those 16 bytes and nothing else. An
# auto-committing PR trigger would push a new commit, which would re-trigger
# itself, which would produce a different path again — forever.
#
# A PR run is still worth its minutes: it proves the environment still solves and
# the kernel still boots, which is how the urllib3 import crash was found. When
# it reports a diff, dispatch the workflow to land one.
#
# Fork PRs additionally cannot be pushed to from here at all, so they are
# verify-only by both rules.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit the rebuilt bundle back to this branch"
        type: boolean
        default: true
      publish:
        description: "Instead: rebuild from main and open an auto-merging pull request"
        type: boolean
        default: false
  pull_request:
    paths:
      - "Tools/jupyterlite/environment-*.yml"
      - "Tools/jupyterlite/requirements.txt"
      - "Tools/jupyterlite/jupyter-lite.json"
      - "scripts/build-jupyterlite.sh"
      - "scripts/setup-jupyterlite.sh"
      - "scripts/derive-kernel-modules.py"
      # build-jupyterlite.sh runs each of them on the built bundle.
      - "scripts/patch-*.py"
      - "scripts/prune-kernel-packages.py"
      - ".github/workflows/revendor-kernels.yml"
      - "scripts/install-micromamba.sh"

concurrency:
  # A publish run has its own group, so another dispatch on main cannot cancel
  # it halfway through the build.
  group: revendor-kernels-${{ (github.event_name == 'workflow_dispatch' && inputs.publish && 'publish') || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  revendor:
    runs-on: ubuntu-latest
    # The environment solves plus the full JupyterLite build dominate this;
    # measured at roughly 15 minutes cold for two envs, less with a warm empack
    # cache. chickadee-lua adds ~10 MB of packages and little time.
    timeout-minutes: 60
    env:
      PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
      HAS_RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN != '' }}
    steps:
      # Publish mode needs RELEASE_TOKEN for both its push and its pull request
      # (see WHOSE TOKEN above), and an open re-vendor pull request already
      # carries the update. Decide both before a quarter-hour build.
      - name: Decide whether to publish
        id: gate
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$HAS_RELEASE_TOKEN" != "true" ]; then
            echo "::error::Publish mode needs the RELEASE_TOKEN secret. A GITHUB_TOKEN push is refused by the branch ruleset, and a GITHUB_TOKEN pull request starts no CI."
            exit 1
          fi
          open="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json headRefName,url \
            --jq '[.[] | select(.headRefName | startswith("kernels/revendor-")) | .url] | join(" ")')"
          if [ -n "$open" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            # A warning, not only a summary line: an open re-vendor pull request
            # that is red, or whose auto-merge failed, holds every later
            # publish, and nothing else would say so.
            echo "::warning::A re-vendor pull request is still open, so no new one is published: $open"
            echo "A re-vendor pull request is still open, so this run publishes nothing: $open" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.skip != 'true'
        with:
          # Publish mode builds from main. Otherwise this is the branch the
          # rebuild is pushed back to.
          ref: ${{ (env.PUBLISH == 'true' && 'main') || github.event.pull_request.head.ref || github.ref_name }}
          # No credential stays in .git/config while the build installs and runs
          # third-party packages. The two push steps below set RELEASE_TOKEN on
          # the remote themselves, after the build.
          persist-credentials: false

      - uses: actions/setup-python@v7
        if: steps.gate.outputs.skip != 'true'
        with:
          # Must match the kernel's own Python (currently 3.13). The derived
          # module index takes its C-extension stdlib names from the building
          # interpreter, so a mismatch silently narrows the list and makes the
          # authoring import check reject stdlib imports that actually work.
          # derive-kernel-modules.py warns when these disagree.
          python-version: "3.13"

      - name: Install micromamba
        if: steps.gate.outputs.skip != 'true'
        run: scripts/install-micromamba.sh

      - name: Report the toolchain
        if: steps.gate.outputs.skip != 'true'
        run: |
          micromamba --version
          rsync --version | head -1

      # Solving and downloading the environments is the slow half. Keyed on the
      # env files so a rebuild triggered by anything else reuses the packages.
      - name: Cache the empack package downloads
        if: steps.gate.outputs.skip != 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/empack
          key: empack-${{ hashFiles('Tools/jupyterlite/environment-*.yml') }}
          restore-keys: empack-

      - name: Build the JupyterLite toolchain
        if: steps.gate.outputs.skip != 'true'
        run: scripts/setup-jupyterlite.sh

      - name: Rebuild the bundle and both xeus kernels
        if: steps.gate.outputs.skip != 'true'
        env:
          MAMBA_ROOT_PREFIX: ${{ runner.temp }}/mamba
        run: scripts/build-jupyterlite.sh

      # The point of the rebuild: prove the result actually contains what the
      # environment files asked for, and is internally coherent. A build that
      # "succeeds" while silently resolving a package away must not be committed.
      - name: Verify the rebuilt kernels
        if: steps.gate.outputs.skip != 'true'
        run: |
          scripts/check-env-vendored-sync.sh
          scripts/check-xeus-vendored.sh
          scripts/verify-jupyterlite.sh

      - name: Summarise what changed
        if: steps.gate.outputs.skip != 'true'
        id: diff
        run: |
          set -euo pipefail
          if git diff --quiet -- Public/jupyterlite Tools/jupyterlite; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            {
              echo "The rebuild reproduced the committed bytes exactly."
              echo ""
              echo "Note this is unexpected for the Python kernel: xpython.wasm"
              echo "embeds its build temp path, so it normally differs by 16 bytes"
              echo "between any two builds."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          {
            echo "### Re-vendored kernel diff"
            echo ""
            echo '```'
            git diff --stat -- Public/jupyterlite | tail -25
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the rebuild
        # workflow_dispatch ONLY — see the termination argument in the header.
        if: >-
          steps.diff.outputs.changed == 'true'
          && github.event_name == 'workflow_dispatch'
          && env.PUBLISH != 'true'
          && inputs.commit
        env:
          PUSH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          if [ "$HAS_RELEASE_TOKEN" != "true" ]; then
            echo "::warning::RELEASE_TOKEN is not set. The branch ruleset refuses a GITHUB_TOKEN push (GH013), so this push is expected to fail."
          fi
          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Public/jupyterlite
          git commit -m "chore(jupyterlite): re-vendor the xeus kernels

          Rebuilt by .github/workflows/revendor-kernels.yml from
          Tools/jupyterlite/environment-*.yml. Regenerated bytes only."
          for attempt in 1 2 3 4; do
            if git push origin HEAD:"${{ github.event.pull_request.head.ref || github.ref_name }}"; then
              exit 0
            fi
            sleep $((2 ** attempt))
            git pull --rebase origin "${{ github.event.pull_request.head.ref || github.ref_name }}"
          done
          echo "could not push the rebuild" >&2
          exit 1

      # Publish mode: the rebuild goes onto its own branch from main, with the
      # changelog fragment every merge to main needs, and reaches main only
      # through a pull request whose CI tests the new kernels.
      - name: Open the re-vendor pull request
        if: steps.diff.outputs.changed == 'true' && env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          BRANCH: kernels/revendor-${{ github.run_id }}
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          cat > "changelog.d/revendor-kernels-${GITHUB_RUN_ID}.md" <<'EOF'
          ### Changed

          - **The xeus kernels are re-vendored to their channels' current builds.**
            The weekly kernel currency check found the vendored kernels behind
            `emscripten-forge-4x`. `.github/workflows/revendor-kernels.yml` rebuilt
            `Public/jupyterlite/` from the unchanged `Tools/jupyterlite/environment-*.yml`
            files and verified it before this pull request was opened.
          EOF
          git add Public/jupyterlite "changelog.d/revendor-kernels-${GITHUB_RUN_ID}.md"
          git commit -m "chore(jupyterlite): re-vendor the xeus kernels

          Rebuilt by .github/workflows/revendor-kernels.yml (publish mode) from
          Tools/jupyterlite/environment-*.yml. Regenerated bytes and a changelog
          fragment only."
          git push origin "HEAD:refs/heads/$BRANCH"
          {
            echo "The weekly kernel currency check found the vendored kernels behind their channels, so this workflow rebuilt them from \`main\` and verified them with \`check-env-vendored-sync.sh\`, \`check-xeus-vendored.sh\` and \`verify-jupyterlite.sh\`."
            echo ""
            echo "This pull request's CI, the browser grading and editor smoke included, tests the new kernels. Auto-merge is on; a red check holds it."
            echo ""
            echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo ""
            echo '```'
            git diff --stat HEAD~1 -- Public/jupyterlite | tail -25
            echo '```'
          } > /tmp/pr-body.md
          if ! url="$(gh pr create --base main --head "$BRANCH" \
            --title "Re-vendor the xeus kernels" --body-file /tmp/pr-body.md)"; then
            echo "::error::Pushed $BRANCH but could not open its pull request. RELEASE_TOKEN needs Pull requests: read & write as well as Contents: read & write (docs/release-process.md). Open the pull request from $BRANCH by hand, or grant the permission, delete $BRANCH and dispatch a new run."
            exit 1
          fi
          if ! gh pr merge --auto --merge "$url"; then
            echo "::error::Opened $url but could not enable auto-merge. It holds every later publish until it is merged or closed."
            exit 1
          fi
          echo "Opened $url with auto-merge on." >> "$GITHUB_STEP_SUMMARY"

      - name: Report a verify-only run
        if: steps.diff.outputs.changed != 'false' && github.event_name == 'pull_request'
        run: |
          {
            echo "### Verify-only run"
            echo ""
            echo "The environment solved and the kernel built and verified."
            echo "Nothing was committed — see the header of this workflow for why"
            echo "a pull_request trigger must not push."
            echo ""
            echo "To land a rebuild, run this workflow manually on this branch."
          } >> "$GITHUB_STEP_SUMMARY"
