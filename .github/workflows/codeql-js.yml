name: CodeQL (JS/TS)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Run in the merge queue so CodeQL can be a required check there too
  # (see docs/release-process.md).
  merge_group:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  security-events: write
  contents: read
  actions: read

# Cancel superseded PR runs; main pushes / merge-queue / scheduled runs are
# never cancelled (their group key is the unique ref).
concurrency:
  group: codeql-js-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Skip the analysis on PRs that touch no JS/TS at all (pure-Swift or
      # docs-only PRs) — the job still runs and reports success, so it stays
      # safe as a required check. Fail-safe: non-PR events (main pushes,
      # merge queue, the weekly schedule) always analyze.
      #
      # First-party JS/TS only: the vendored JupyterLite bundle is already
      # paths-ignore'd from the analysis, so a re-vendor PR gains nothing
      # from a CodeQL pass (the weekly schedule + main pushes cover it).
      - name: Detect JS/TS-relevant changes
        id: detect
        uses: ./.github/actions/changed-paths
        with:
          label: CodeQL
          pattern: '\.(js|mjs|cjs|ts|tsx)$|^\.github/workflows/codeql-js\.yml$|^\.github/actions/changed-paths/'
          exclude: '^Public/jupyterlite/'

      - name: Initialize CodeQL
        if: steps.detect.outputs.relevant == 'true'
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          paths-ignore: |
            Public/jupyterlite/**

      - name: Perform CodeQL Analysis
        if: steps.detect.outputs.relevant == 'true'
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
