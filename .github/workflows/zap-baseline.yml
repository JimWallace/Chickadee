name: ZAP Baseline

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  baseline:
    name: ZAP Baseline Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # Derived from docker-compose.yml rather than written inline here: compose
      # refuses to start when a ${VAR:?} it requires is unset, and this workflow
      # runs weekly, so an inline fixture goes stale silently for as long as it
      # takes someone to open a schedule-only run. The same script is run with
      # --check by the format-lint job, which is what turns that into a PR-time
      # failure. See its header.
      - name: Write CI .env
        run: scripts/ci-compose-env.sh

      - name: Start application
        run: docker compose up -d --build

      - name: Wait for /health
        run: |
          for i in $(seq 1 12); do
            if curl -sf http://localhost:8080/health > /dev/null; then
              echo "Server is healthy"
              exit 0
            fi
            echo "Waiting for server... ($i/12)"
            sleep 5
          done
          echo "Server did not become healthy within 60s"
          exit 1

      # Deterministic header assertions, BEFORE the crawl and gating it.
      # ZAP's CSP rule is one rule covering every CSP finding at once, and
      # `.zap/rules.tsv` sets a threshold per rule — so suppressing the
      # `'unsafe-eval'` this app permanently needs also suppressed the
      # `'unsafe-inline'` an external AppScan run reported as a High (#1516).
      # This step says exactly what the header must contain, so accepting one
      # finding costs nothing in coverage of its neighbours.
      - name: Assert security response headers
        run: scripts/check-security-headers.sh http://localhost:8080

      # The scan crawls as a signed-in account. Without one it reached five
      # public URLs and every other page redirected to /login (#2193). The
      # script registers a throwaway account on this CI server (the first
      # registrant is the admin), makes it the instructor of one course and a
      # student in another, and prints its session cookie. The password is
      # random per run, and the cookie is masked in the log. See its header
      # for why one account covers the three page sets.
      - name: Sign in a scan account
        id: session
        run: |
          cookie="$(scripts/zap-signed-in-session.sh http://localhost:8080)"
          echo "::add-mask::$cookie"
          echo "cookie=$cookie" >> "$GITHUB_OUTPUT"

      # -z passes ZAP options; zap-baseline.py splits them on spaces, so no
      # value below may contain one.
      #   * The replacer rule sets the Cookie header on every request, which
      #     signs in every page the spider fetches.
      #   * spider.processform=false: the spider fetches links and submits no
      #     form. Signed in, a form carries a valid CSRF token, so a submitted
      #     form would really sign out, archive or delete, and the crawl would
      #     lose its session or its pages part way through. A baseline scan is
      #     passive, so forms submit nothing it needs.
      # -m 5 gives the spider five minutes instead of one: the signed-in site
      # is many times larger than the five public URLs.
      - name: Run ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:8080'
          cmd_options: >-
            -a -m 5 -z "-config spider.processform=false
            -config replacer.full_list(0).description=session
            -config replacer.full_list(0).enabled=true
            -config replacer.full_list(0).matchtype=REQ_HEADER
            -config replacer.full_list(0).matchstr=Cookie
            -config replacer.full_list(0).regex=false
            -config replacer.full_list(0).replacement=vapor-session=${{ steps.session.outputs.cookie }}"
          rules_file_name: '.zap/rules.tsv'
          fail_action: false
          allow_issue_writing: true

      - name: Collect server logs
        if: always()
        run: docker compose logs server > server.log 2>&1 || true

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-logs
          path: server.log
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: docker compose down -v
