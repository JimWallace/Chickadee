name: Interaction review

# Runs the `interaction-review` agent on every pull request that touches code.
# The agent asks one question: does this change break a feature that it does
# not mention? It reads the shared-object map in docs/feature-interactions.md
# and checks each rule there that the change touches. The other reviews check
# a change against its own area; this one checks where it meets other areas.
#
# The job is agent-pr-review.yml, which ui-review.yml calls too. Its header
# says how the review runs: a read-only model job, and a job with no model
# that posts the report and the inline findings.
#
# WHAT IT GATES. Nothing, for now. The review is advisory while its precision
# is measured: every verdict, `changes requested` included, is a warning and a
# green job. To make it gate, set `gate: true` below, as ui-review.yml does.
# An infrastructure failure (no API key, a model outage, a timeout) is always
# a warning and a green job.
#
# WHAT IT NEEDS. The same repository secret as ui-review.yml:
# ANTHROPIC_API_KEY (or CLAUDE_CODE_OAUTH_TOKEN for a Claude subscription).
# Without either the job says so and passes.
#
# The paths filter is the code the map describes: Sources/ and first-party
# Public/*.js (one level deep, so the vendored trees do not trigger it). The
# map, the brief, this file and the shared parts it runs are on the list, so a
# change to any of them gets a run that proves it still works. A docs-only or
# tests-only PR does not run.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - "Sources/**"
      - "Public/*.js"
      - "docs/feature-interactions.md"
      - ".claude/agents/interaction-review.md"
      - ".github/workflows/interaction-review.yml"
      - ".github/workflows/agent-pr-review.yml"
      - ".github/actions/claude-agent/**"
      - "scripts/ci-agent-sanitize.sh"

permissions: {}

concurrency:
  # Per PR, and cancel superseded runs: only the latest push is worth reviewing.
  group: interaction-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  interaction-review:
    # The most that agent-pr-review.yml may use. Its `review` job, where the
    # model runs, narrows this to read-only.
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/agent-pr-review.yml
    with:
      agent: interaction-review
      brief-note: "Its map is docs/feature-interactions.md."
      # Tracing readers across the tree takes more turns than a UI review.
      max-turns: "60"
      timeout-minutes: 25
      allowed-tools: "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git grep:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
      gate: false
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
