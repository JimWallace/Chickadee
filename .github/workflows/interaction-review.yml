name: Interaction review

# Runs the `interaction-review` agent on every pull request that touches code.
# The agent asks one question: does this change break a feature that it does
# not mention? It reads the shared-object map in docs/feature-interactions.md
# and checks each rule there that the change touches. The other reviews check
# a change against its own area; this one checks where it meets other areas.
#
# The brief is `.claude/agents/interaction-review.md`, the same file a Claude
# Code session runs as a subagent. This workflow holds no second copy of it:
# the prompt below tells the reviewer to read that file and apply it to this PR.
#
# WHAT IT GATES. Nothing, for now. The review is advisory while its precision
# is measured: every verdict, `changes requested` included, is a warning and a
# green job. To make it gate, change the `changes requested` case in the last
# step from `::warning::` to `::error::` and `exit 1`, as ui-review.yml does.
# An infrastructure failure (no API key, a model outage, a timeout) is always
# a warning and a green job, on the same rule mutation-pr.yml follows: a broken
# tool must not fail somebody's pull request.
#
# WHAT IT NEEDS. The same repository secret as ui-review.yml:
# ANTHROPIC_API_KEY (or CLAUDE_CODE_OAUTH_TOKEN for a Claude subscription).
# Without either the job says so and passes.
#
# The paths filter is the code the map describes: Sources/ and first-party
# Public/*.js (one level deep, so the vendored trees do not trigger it). The
# map, the brief and this file are on the list so a change to any of them gets
# a run that proves it still works. A docs-only or tests-only PR does not run.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - "Sources/**"
      - "Public/*.js"
      - "docs/feature-interactions.md"
      - ".claude/agents/interaction-review.md"
      - ".github/workflows/interaction-review.yml"

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  # Per PR, and cancel superseded runs: only the latest push is worth reviewing.
  group: interaction-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: interaction-review
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7
        with:
          # The reviewer reads the PR diff through `gh pr diff`, which needs no
          # history; the checkout is for grepping the other readers of each
          # shared object the change touches.
          fetch-depth: 1

      - name: Check for credentials
        id: credentials
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ] || [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN secret is set, so the interaction review did not run. Add one repository secret to enable it."
            {
              echo "## interaction-review"
              echo
              echo "Did not run: no ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN repository secret is set."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Review the change
        id: review
        if: steps.credentials.outputs.present == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the Chickadee interaction-review agent. Your brief is the
            file .claude/agents/interaction-review.md in the checked-out tree.
            Read it first and follow it exactly. Its map is
            docs/feature-interactions.md.

            The PR branch is checked out in the working directory. Read the
            change with `gh pr diff ${{ github.event.pull_request.number }}`.

            Report as the brief says, in these two places and nowhere else:

            1. The three-part report (Verdict, Findings, What you did not
               check), as GitHub Markdown in the `report` field of the
               structured output. Start it with the heading
               `## interaction-review`. Do not post it yourself: the next step
               posts it as one comment and updates that comment on each push.
            2. One inline comment per finding that anchors to a changed line,
               with mcp__github_inline_comment__create_inline_comment and
               `confirmed: true`. End each one with a blank line, a line
               holding `---`, and the line
               `_Generated by [Claude Code](https://claude.ai/code)_`.

            Also return the verdict and a one-sentence summary in the
            structured output.
          # The report is posted by the next step, not by the agent: both this
          # review and ui-review run as claude[bot], so `gh pr comment
          # --edit-last` in one would overwrite the other's report.
          #
          # A family alias, not a dated model ID, as in ui-review.yml. The
          # brief's `model:` line says the same for local sessions. Tracing
          # readers across the tree takes more turns than a UI review.
          claude_args: |
            --model sonnet
            --max-turns 60
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git grep:*),Bash(gh pr diff:*),Bash(gh pr view:*),mcp__github_inline_comment__create_inline_comment"
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["pass","findings","changes requested"]},"summary":{"type":"string"},"report":{"type":"string"}},"required":["verdict","summary","report"]}'

      - name: Post or update the report
        if: steps.credentials.outputs.present == 'true' && steps.review.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          STRUCTURED: ${{ steps.review.outputs.structured_output }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          jq -r '.report // empty' <<< "${STRUCTURED:-null}" > raw.md
          if [ ! -s raw.md ]; then
            echo "::warning::The interaction review returned no report."
            exit 0
          fi
          if grep -qE 'sk-ant-|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_|eyJ[A-Za-z0-9_-]{20,}\.|BEGIN [A-Z ]*PRIVATE KEY' raw.md; then
            echo "::warning::The report looks like it holds a credential. It was not posted."
            exit 0
          fi
          marker="<!-- interaction-review -->"
          head -c 16000 raw.md > comment.md
          {
            echo
            echo "$marker"
            echo
            echo "---"
            echo "_Generated by [Claude Code](https://claude.ai/code)_"
          } >> comment.md

          # One comment per PR, found by its marker and updated on each push.
          if ! ids="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$marker\"))) | .id")"; then
            echo "::warning::Could not list the comments on #$PR, so the report was not posted. The step summary has the verdict."
            exit 0
          fi
          existing="$(head -n 1 <<< "$ids")"
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" \
              -F "body=@comment.md" > /dev/null || echo "::warning::Could not update the report."
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
              -F "body=@comment.md" > /dev/null || echo "::warning::Could not post the report."
          fi

      - name: Record the verdict
        if: steps.credentials.outputs.present == 'true'
        env:
          OUTCOME: ${{ steps.review.outcome }}
          STRUCTURED: ${{ steps.review.outputs.structured_output }}
        run: |
          set -uo pipefail
          if [ "$OUTCOME" != "success" ]; then
            echo "::warning::The interaction review did not complete (step outcome: $OUTCOME). This is not a verdict. Re-run the job."
            {
              echo "## interaction-review"
              echo
              echo "Did not complete (step outcome: $OUTCOME). Re-run the job."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          verdict="$(jq -r '.verdict // "none"' <<< "${STRUCTURED:-null}")"
          summary="$(jq -r '.summary // ""' <<< "${STRUCTURED:-null}")"
          {
            echo "## interaction-review"
            echo
            echo "**Verdict:** $verdict"
            echo
            echo "$summary"
          } >> "$GITHUB_STEP_SUMMARY"
          case "$verdict" in
            "changes requested")
              echo "::warning::interaction-review requested changes (advisory). $summary"
              ;;
            pass|findings)
              echo "::notice::interaction-review: $verdict. $summary"
              ;;
            *)
              echo "::warning::interaction-review returned no verdict. Read the PR comment; treat the run as not done."
              ;;
          esac
