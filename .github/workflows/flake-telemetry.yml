name: Flake telemetry

# Weekly tally of the tolerated-flake ::warning annotations emitted by the
# grading-hang probe (webkit hangs<=1/12 on PRs) and the editor-smoke webkit
# retries (docs/ci-flakiness.md), both jobs of browser-probes.yml.
# Tolerating a known ambient flake must not mean losing sight of its rate:
# this job counts those warnings (plus hard-red runs) over the trailing week and appends the tally to a pinned tracking
# issue, so a rising rate shows up as a trend instead of being normalised one
# annotation at a time. No comment is posted on an all-zero week.

on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  issues: write

jobs:
  tally:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Tally tolerated-flake warnings over the trailing week
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          since="$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)"
          total_warnings=0
          total_red=0
          summary="Week ending $(date -u +%Y-%m-%d) (runs since ${since}):"$'\n'
          # Both probes are jobs of browser-probes.yml (the probe workflows
          # were combined), so a run counts as red for a probe only when that
          # probe's own legs failed. The other probes in the same run are
          # diagnostics and do not count. Old runs of the earlier
          # grading-hang-probe.yml and editor-smoke.yml are not read.
          # Every run in the window, paged: one workflow now holds every PR
          # run of every probe, so a single 50-run page could drop the
          # scheduled runs out of the week.
          run_ids="$(gh api --paginate "repos/${REPO}/actions/workflows/browser-probes.yml/runs?created=%3E%3D${since}&per_page=100" \
            --jq '.workflow_runs[].id' 2>/dev/null || true)"
          declare -A warnings=([grading-probe]=0 [smoke]=0) red=([grading-probe]=0 [smoke]=0)
          for run_id in ${run_ids}; do
            jobs_json="$(gh api "repos/${REPO}/actions/runs/${run_id}/jobs?per_page=100" 2>/dev/null || echo '{"jobs":[]}')"
            for probe in grading-probe smoke; do
              # The probe's matrix legs are named "<job> (<engine>)".
              legs="$(echo "${jobs_json}" | jq --arg p "${probe} (" '[.jobs[] | select(.name | startswith($p))]')"
              if [ "$(echo "${legs}" | jq '[.[] | select(.conclusion == "failure" or .conclusion == "cancelled")] | length')" -gt 0 ]; then
                red[$probe]=$((red[$probe] + 1))
              fi
              # Annotations only for the legs that can emit tolerated-flake
              # warnings (webkit, or any grading-probe leg), keeping API usage
              # well under rate limits.
              for job_id in $(echo "${legs}" | jq -r '.[] | select(.name | test("webkit|grading-probe")) | .id'); do
                n="$(gh api "repos/${REPO}/check-runs/${job_id}/annotations?per_page=100" \
                  --jq '[.[] | select(.message // "" | test("AMBIENT FLAKE TOLERATED|FLAKE RETRY"))] | length' 2>/dev/null || echo 0)"
                warnings[$probe]=$((warnings[$probe] + n))
              done
            done
          done
          for probe in grading-probe smoke; do
            summary+="- browser-probes.yml ${probe}: ${warnings[$probe]} tolerated-flake warning(s), ${red[$probe]} red run(s)"$'\n'
            total_warnings=$((total_warnings + warnings[$probe]))
            total_red=$((total_red + red[$probe]))
          done
          echo "${summary}"
          if [ "${total_warnings}" -eq 0 ] && [ "${total_red}" -eq 0 ]; then
            echo "All-zero week — not commenting on the tracking issue."
            exit 0
          fi
          gh api -X POST "repos/${REPO}/labels" -f name=flake-telemetry \
            -f color=d4c5f9 -f description="Weekly CI flake-rate tally" >/dev/null 2>&1 || true
          issue_number="$(gh api "repos/${REPO}/issues?labels=flake-telemetry&state=open&per_page=1" --jq '.[0].number // empty')"
          if [ -z "${issue_number}" ]; then
            issue_number="$(gh api -X POST "repos/${REPO}/issues" \
              -f title="CI flake telemetry (weekly tally)" \
              -f body="Weekly tally of tolerated-flake warnings and red runs from the browser probes (see docs/ci-flakiness.md). Posted by flake-telemetry.yml; an all-zero week posts nothing. If the tolerated-warning count trends up, the webkit exec-hang ambient rate is rising — revisit the tolerance and the root-cause work." \
              -f "labels[]=flake-telemetry" --jq .number)"
          fi
          gh api -X POST "repos/${REPO}/issues/${issue_number}/comments" -f body="${summary}" >/dev/null
          echo "Posted tally to issue #${issue_number}."
