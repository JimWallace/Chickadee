name: JupyterLite

on:
  pull_request:
  push:
    branches:
      - main

# Cancel superseded PR runs (rapid pushes used to stack full JupyterLite
# builds with no cancellation); pushes to main are never cancelled.
concurrency:
  group: jupyterlite-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Skip the expensive toolchain + build on PRs that touch nothing
      # JupyterLite/Pyodide-related. The job itself still runs and reports
      # success — so it stays safe to mark as a required check (a skipped
      # required workflow would block merges forever); only the heavy steps
      # are gated. Fail-safe like editor-smoke's `changes` job: non-PR
      # events, a missing base, or an empty diff run everything.
      - name: Detect JupyterLite-relevant changes
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "::notice::non-PR event ($EVENT) — running the JupyterLite build."
            exit 0
          fi
          git fetch --no-tags --quiet origin "$BASE_REF" || true
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "::notice::base sha unavailable — running the build (fail-safe)."
            exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA" HEAD)"
          if [ -z "$changed" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "::notice::no diff computed — running the build (fail-safe)."
            exit 0
          fi
          pattern='^(Public/jupyterlite/|Public/pyodide/|Public/vendor/|Tools/jupyterlite/|Tools/vendor/|scripts/setup-jupyterlite\.sh|scripts/build-jupyterlite\.sh|scripts/setup-vendor\.sh|scripts/add-pyodide-extras\.py|scripts/patch-pyodide-kernel\.py|scripts/check-pyodide-parity\.sh|scripts/verify-jupyterlite\.sh|scripts/check-kernel-deps-vendored\.py|scripts/check-xeus-vendored\.sh|scripts/check-env-vendored-sync\.sh|scripts/derive-kernel-modules\.py|\.github/workflows/jupyterlite\.yml)'
          # Here-string, not a pipe — see editor-smoke.yml for the SIGPIPE
          # trap that silently misclassifies large diffs.
          if grep -qE "$pattern" <<< "$changed"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "::notice::JupyterLite-relevant files changed — running the build."
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no JupyterLite-relevant changes — skipping the build steps."
          fi

      - name: Set up Python
        if: steps.detect.outputs.relevant == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # CI cannot rebuild the bundle from scratch: the xeus-r kernel is built from
      # emscripten-forge (micromamba + network to repo.prefix.dev), and CI has no
      # network beyond GitHub. So the vendored Public/jupyterlite bytes are
      # authoritative and we verify their coherence here rather than rebuild-and-
      # diff. Rebuild them with scripts/build-jupyterlite.sh where micromamba +
      # emscripten-forge are reachable (a maintainer machine — the Pyodide half
      # stays deterministic there). See docs/xeus-r-kernel-spike.md.
      - name: Verify the committed JupyterLite bundle is coherent
        if: steps.detect.outputs.relevant == 'true'
        # pyodideUrl same-origin, the nb_mypy kernel-wheel sha cascade, the
        # waitAsync blob worker, the diagnostics collector tag, and the xeus
        # parselmouth-fetch stub — the internal invariants a rebuild used to
        # guarantee, asserted on the committed bytes.
        run: scripts/verify-jupyterlite.sh Public/jupyterlite

      - name: Verify Pyodide parity (vended == kernel)
        if: steps.detect.outputs.relevant == 'true'
        # Fails if Public/pyodide drifts from the version the editor kernel is
        # pinned to — the latent condition behind the #574 editor outage. This
        # is what makes the editor's same-origin Pyodide trustworthy: green
        # here means the vended copy actually matches the kernel.
        run: scripts/check-pyodide-parity.sh

      - name: Verify editor kernel boots with zero external fetches (FIPPA)
        if: steps.detect.outputs.relevant == 'true'
        # Asserts every module the editor kernel imports at startup is provided
        # by the locally-vended Pyodide. A miss would fall through to
        # piplite.install(...) -> CDN/PyPI at boot, which FIPPA blocks — bricking
        # the editor (the v0.4.292 `comm` outage). Catches that class in CI
        # instead of on a student's screen.
        run: python3 scripts/check-kernel-deps-vendored.py

      - name: Verify the vendored xeus-r kernel is intact
        if: steps.detect.outputs.relevant == 'true'
        # The xeus-r WASM kernel is manually vendored (CI can't rebuild it from
        # emscripten-forge). Assert it is present + internally coherent so a
        # botched or partial re-vendor fails here, not in front of a student.
        run: scripts/check-xeus-vendored.sh

      # Cheap (two files, no build, no network) and the one guard that compares
      # DECLARED intent to SHIPPED bytes. Everything else here checks the
      # vendored tree against itself, which is how an env file could list scipy
      # while the kernel had none — see the script's header.
      - name: Environment files match the vendored kernels
        if: steps.detect.outputs.relevant == 'true'
        run: scripts/check-env-vendored-sync.sh
