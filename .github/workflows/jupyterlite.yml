name: JupyterLite

on:
  pull_request:
  push:
    branches:
      - main
  # The guards take well under a second, so the job can gate a merge queue
  # (docs/release-process.md, "Merge queue").
  merge_group:

# Cancel superseded PR runs (rapid pushes used to stack full JupyterLite
# builds with no cancellation); pushes to main are never cancelled.
concurrency:
  group: jupyterlite-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # EVERY step below runs on EVERY event, deliberately.
      #
      # There used to be a path filter here that skipped these steps on a PR
      # touching nothing JupyterLite-related, while still reporting the job
      # green so it stayed safe as a required check. Two things made that a bad
      # trade. It was written to skip "the expensive toolchain + build", and
      # that build no longer runs here: only the separate, deliberate
      # revendor-kernels.yml workflow rebuilds the kernels, so in this job the
      # committed bytes are authoritative and all it does is verify them. The guards below take well under a second; the
      # filter's entire saving was one Python setup.
      #
      # What it cost was the merge-time signal. `push` to main always counted as
      # relevant, so the guards effectively ran ONLY on main: a PR touching no
      # JupyterLite path was reported green without them, and main went red
      # seconds after the merge. That is exactly how the broken kernel
      # derivation in check-xeus-vendored.sh survived five releases — every PR
      # was green, every push to main was red, and the two were never the same
      # check. A guard whose answer depends on the event it runs under is not a
      # guard, so this one now runs everywhere.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # This job does not rebuild the bundle. The xeus kernels are built from
      # emscripten-forge (micromamba + network to repo.prefix.dev), and that
      # rebuild is the separate revendor-kernels.yml workflow, because its
      # output is ~100 MB of binary diff that belongs in a PR of its own. So
      # here the vendored Public/jupyterlite bytes are authoritative and we
      # verify their coherence rather than rebuild-and-diff. See
      # docs/adding-a-xeus-kernel.md.
      - name: Verify the committed JupyterLite bundle is coherent
        # No Pyodide may return, the diagnostics collector tag, and the xeus
        # parselmouth-fetch stub — the internal invariants a rebuild used to
        # guarantee, asserted on the committed bytes, plus the waitAsync
        # polyfill worker in its blob: form.
        run: scripts/verify-jupyterlite.sh Public/jupyterlite

      # The FIPPA property — the editor kernel boots with ZERO external fetches —
      # used to be checked by scripts/check-kernel-deps-vendored.py, which scanned
      # the Pyodide kernel wheels' startup imports against the vended pyodide-lock
      # and piplite index. All three are gone with Pyodide (v0.5.19), and so is
      # that whole failure class: there is no runtime install path to fall through
      # to. The property is now structural and guarded elsewhere —
      # verify-jupyterlite.sh asserts the parselmouth-fetch stub (xeus's one
      # runtime external fetch) is applied, and check-xeus-vendored.sh plus
      # check-env-vendored-sync.sh assert the envs are complete and coherent, so
      # nothing a kernel imports at boot is missing from the vendored bytes.

      - name: Verify the vendored xeus kernels are intact
        # The xeus WASM kernels are vendored (this job does not rebuild them;
        # revendor-kernels.yml does). Assert they are present + internally
        # coherent so a botched or partial re-vendor fails here, not in front
        # of a student.
        run: scripts/check-xeus-vendored.sh

      # Cheap (two files, no build, no network) and the one guard that compares
      # DECLARED intent to SHIPPED bytes. Everything else here checks the
      # vendored tree against itself, which is how an env file could list scipy
      # while the kernel had none — see the script's header.
      - name: Environment files match the vendored kernels
        run: scripts/check-env-vendored-sync.sh

      # Offline and instantaneous: proves the weekly currency check's
      # comparator still reports a difference. That check runs on a schedule
      # with network and micromamba, so nothing on the pull request path would
      # otherwise notice it rotting into a no-op — and a currency check that
      # always says "current" looks like good news while telling you nothing.
      - name: The kernel-currency check can still fail
        run: scripts/check-kernel-currency.py --self-test
