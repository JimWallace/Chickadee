name: Swift Tests

on:
  pull_request:
  push:
    branches: [main]
  # Run in the merge queue too, so a PR is re-tested against the actual
  # pre-merge main (catches semantic conflicts a green-against-stale-main PR
  # would miss). Enable the queue in branch protection — see
  # docs/release-process.md.
  merge_group:

# Cancel superseded runs when new commits land on a PR branch (one branch
# racked up four full CI runs in 70 minutes during the #890 audit).  Pushes
# to main and merge-queue runs are never cancelled — their group key is the
# unique ref/SHA and cancel-in-progress is false outside pull_request.
concurrency:
  group: swift-tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every guard must be SEEN to fail. Its own job rather than a step inside
  # format-lint: each fixture re-runs a whole guard, so the suite costs
  # minutes, and paying that in wall-clock beside format-lint is free while
  # paying it inside format-lint is not.
  guard-self-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ghcr.io/jimwallace/chickadee/swift:6.3-noble
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Every guard fails on its own defect
        run: scripts/check-guards.sh

  # The mutation tooling is Python, so this needs python3 and NOTHING else --
  # no Swift, no container. It rode in format-lint for one commit and failed
  # with `python3: not found`: that job runs the PLAIN swift image, which is the
  # toolchain alone. The -ci image is the one carrying python3, and pulling a
  # ~GB container to run 18 unit tests would be the wrong fix for a job that
  # never touches Swift.
  mutation-trend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Mutation tooling self-tests
        # `*_test.py`, not one named file: report_test.py existed for a week
        # before anything ran it, because the pattern named its neighbour.
        run: python3 -m unittest discover -s Tools/mutation -p '*_test.py' -v

  format-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # All CI jobs run on noble (Ubuntu 24.04), matching the Dockerfile's build
    # and runtime base so CI exercises the same glibc the shipped image uses.
    # noble (glibc 2.39) is also required by SwiftLintBinary, which is linked
    # against GLIBC 2.38 and cannot run on jammy's glibc 2.35.
    container:
      image: ghcr.io/jimwallace/chickadee/swift:6.3-noble
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - name: Compute SPM cache key
        id: spm-cache-key
        run: echo "value=$(sha256sum Package.resolved | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache SPM checkouts
        uses: actions/cache@v5
        with:
          path: .build/checkouts
          key: ${{ runner.os }}-spm-${{ steps.spm-cache-key.outputs.value }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Check formatting
        run: scripts/lint.sh

      - name: Run SwiftLint
        run: scripts/swiftlint.sh

      - name: Block new XCTest imports
        run: scripts/no-new-xctest.sh

      - name: Check view / stylesheet hygiene
        run: scripts/check-styles.sh

      - name: Block defaulted language parameters
        run: scripts/no-language-defaults.sh

      - name: Check generated JS constants match their Swift declarations
        run: scripts/generate-js-constants.sh --check

      - name: Check runner wasm size budget
        run: scripts/check-runner-wasm-size.sh

      - name: Check the CI compose fixture covers every required variable
        run: scripts/ci-compose-env.sh --check

  # Single shared compile of the whole package + all test targets.  The
  # resulting `.build/` tree is cached and reused by every test job below
  # via `swift test --skip-build`, replacing five from-scratch compiles
  # (~40 min of wall-clock) with one (#523).
  #
  # Cache key combines the toolchain (swift --version) with a content hash
  # of the source + manifest.  `restore-keys` lets a cache miss restore the
  # most recent prior `.build/` for the same toolchain.  `git restore-mtime`
  # then resets each source file's mtime to its last-commit time, so
  # llbuild's freshness check recompiles only the files touched by new
  # commits — true incremental builds.  Without it the fresh mtimes
  # `actions/checkout` stamps make llbuild rebuild everything from scratch.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: ghcr.io/jimwallace/chickadee/swift:6.3-noble
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # Full (blobless) history so `git restore-mtime` can read each file's
      # last-commit time.  `blob:none` keeps commits + trees (all the mtime
      # walk needs) while skipping the large vendored blobs (Pyodide) in
      # history; the working-tree checkout still fetches only the HEAD blobs,
      # same as a shallow checkout.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none

      # Normalise source mtimes to commit times so the restored `.build/`
      # stays valid for unchanged files and only new commits recompile.
      - uses: ./.github/actions/restore-git-mtimes

      - name: Resolve toolchain cache key
        id: toolchain
        run: echo "key=$(swift --version | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # Build-artifact cache is EXACT-MATCH ONLY — no `restore-keys` prefix
      # fallback.  Incrementally rebuilding over a `.build/` restored from a
      # *different* tree is unsound: when a cross-module type changes kind
      # (struct↔enum) or a struct's init gains a field, files that reference it
      # only transitively keep their old source mtime, so `git restore-mtime`
      # marks them "fresh" and llbuild reuses stale object files compiled
      # against the old mangled symbol → "undefined reference" link errors.
      # This recurred on every such change (TestItem struct→enum, v0.4.228;
      # TestProperties.achievements; CourseBundleManifest.sections;
      # TestProperties.datasets) and used to need a manual cache-salt bump each
      # time.  Exact-match-only removes the failure class outright: a tree that
      # doesn't match an existing cache does a clean cold build instead of an
      # unsound incremental one.  Trade-off: any Sources/Tests change pays a
      # full rebuild (no partial reuse); an exact re-run of the same tree still
      # hits and skips the build.
      - name: Cache build artifacts
        id: build-cache
        uses: actions/cache@v5
        with:
          path: .build
          key: ${{ runner.os }}-build-v4-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.resolved', 'Package.swift', 'Sources/**', 'Tests/**') }}

      # Exact cache hit: artifacts already match this exact tree, skip even the
      # near-no-op build.  Any miss = clean cold build (no stale-object reuse).
      - name: Build all targets and tests
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: swift build --build-tests

  core-tests:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    container:
      image: ghcr.io/jimwallace/chickadee/swift:6.3-noble
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --privileged

    steps:
      - uses: actions/checkout@v6

      - name: Resolve toolchain cache key
        id: toolchain
        run: echo "key=$(swift --version | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore build artifacts
        id: build-cache
        uses: actions/cache/restore@v5
        with:
          path: .build
          key: ${{ runner.os }}-build-v4-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.resolved', 'Package.swift', 'Sources/**', 'Tests/**') }}

      - name: Run CoreTests
        run: |
          if [ "${{ steps.build-cache.outputs.cache-hit }}" = "true" ]; then
            swift test --skip-build --parallel --filter CoreTests
          else
            swift test --parallel --filter CoreTests
          fi

  api-tests:
    runs-on: ubuntu-latest
    needs: build
    # 25, matching api-tests-postgres, which runs the SAME target. This lane
    # had the tighter ceiling despite the wider run-to-run spread (2.2x vs
    # 1.4x over 18 main runs) — an inversion, not a decision. Note the budget
    # the step actually gets is this minus ~95s of container init + checkout +
    # artifact restore. See docs/ci-flakiness.md Family 5; the entry is
    # explicit that this buys headroom for the ordinary 441s tail and would
    # NOT have saved the 5x starvation event that prompted it.
    timeout-minutes: 25
    container:
      # swift-ci = the mirrored toolchain + baked-in test packages (see
      # mirror-images.yml / .github/docker/ci-image); same `swift --version`,
      # so the `.build` cache key matches the build job's.
      image: ghcr.io/jimwallace/chickadee/swift-ci:6.3-noble
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --privileged

    steps:
      - uses: actions/checkout@v6

      - name: Resolve toolchain cache key
        id: toolchain
        run: echo "key=$(swift --version | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore build artifacts
        id: build-cache
        uses: actions/cache/restore@v5
        with:
          path: .build
          key: ${{ runner.os }}-build-v4-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.resolved', 'Package.swift', 'Sources/**', 'Tests/**') }}

      - name: Install system test dependencies
        # These are baked into the swift-ci image, so this normally just
        # verifies and exits.  The apt-get path remains as the fallback for a
        # stale image (e.g. a toolchain bump before the swift-ci rebuild — see
        # mirror-images.yml), degrading to the old per-job install instead of
        # failing the job.
        #
        # EVERY graded language's interpreter belongs in BOTH the probe and the
        # install list.  Omitting one is not caught by a red job: the
        # execution-path suites guard on availability and skip SILENTLY, so the
        # job stays green having executed nothing in that language.  Rscript was
        # missing from both here — the identical silent-skip trap that r-base
        # and lua5.4 each hit on the image itself, recorded in
        # .github/docker/ci-image/Dockerfile.
        run: |
          if command -v zip >/dev/null && command -v unzip >/dev/null && command -v python3 >/dev/null && command -v Rscript >/dev/null && command -v lua >/dev/null && command -v octave-cli >/dev/null && command -v g++ >/dev/null && command -v racket >/dev/null && command -v javac >/dev/null; then
            echo "test dependencies already baked into the image; skipping apt-get"
            exit 0
          fi
          for i in 1 2 3; do
            apt-get update -qq && apt-get install -y --no-install-recommends zip unzip python3 r-base lua5.4 octave g++ racket default-jdk && break
            echo "apt-get failed (attempt $i), retrying in 15s..."
            sleep 15
          done

      - name: Run APITests
        # Swift Testing schedules many class-suite instances in parallel
        # regardless of the swift test --parallel flag.  Each test app
        # opens its own SQLite connection pool with one connection per
        # EventLoop, and at unbounded parallelism the combined pool
        # requests time out (AsyncKit "Connection request timed out").
        # `SWT_EXPERIMENTAL_MAXIMUM_PARALLELIZATION_WIDTH=4` caps Swift
        # Testing's internal scheduler to four in-flight tests at a
        # time — enough headroom for the connection pool to keep up,
        # with most of the parallelism speedup preserved.
        env:
          SWT_EXPERIMENTAL_MAXIMUM_PARALLELIZATION_WIDTH: "4"
        run: |
          if [ "${{ steps.build-cache.outputs.cache-hit }}" = "true" ]; then
            swift test --skip-build --filter APITests
          else
            swift test --filter APITests
          fi

  api-tests-postgres:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 25
    container:
      # swift-ci: see the api-tests job note.
      image: ghcr.io/jimwallace/chickadee/swift-ci:6.3-noble
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --privileged
    services:
      postgres:
        image: ghcr.io/jimwallace/chickadee/postgres:16
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_DB: chickadee_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d chickadee_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_BACKEND: postgres
      TEST_DATABASE_HOST: postgres
      TEST_DATABASE_PORT: "5432"
      TEST_DATABASE_NAME: chickadee_test
      TEST_DATABASE_USER: postgres
      TEST_DATABASE_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v6

      - name: Resolve toolchain cache key
        id: toolchain
        run: echo "key=$(swift --version | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore build artifacts
        id: build-cache
        uses: actions/cache/restore@v5
        with:
          path: .build
          key: ${{ runner.os }}-build-v4-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.resolved', 'Package.swift', 'Sources/**', 'Tests/**') }}

      - name: Install system test dependencies
        # These are baked into the swift-ci image, so this normally just
        # verifies and exits.  The apt-get path remains as the fallback for a
        # stale image (e.g. a toolchain bump before the swift-ci rebuild — see
        # mirror-images.yml), degrading to the old per-job install instead of
        # failing the job.
        #
        # EVERY graded language's interpreter belongs in BOTH the probe and the
        # install list.  Omitting one is not caught by a red job: the
        # execution-path suites guard on availability and skip SILENTLY, so the
        # job stays green having executed nothing in that language.  Rscript was
        # missing from both here — the identical silent-skip trap that r-base
        # and lua5.4 each hit on the image itself, recorded in
        # .github/docker/ci-image/Dockerfile.
        run: |
          if command -v zip >/dev/null && command -v unzip >/dev/null && command -v python3 >/dev/null && command -v Rscript >/dev/null && command -v lua >/dev/null && command -v octave-cli >/dev/null && command -v g++ >/dev/null && command -v racket >/dev/null && command -v javac >/dev/null; then
            echo "test dependencies already baked into the image; skipping apt-get"
            exit 0
          fi
          for i in 1 2 3; do
            apt-get update -qq && apt-get install -y --no-install-recommends zip unzip python3 r-base lua5.4 octave g++ racket default-jdk && break
            echo "apt-get failed (attempt $i), retrying in 15s..."
            sleep 15
          done

      - name: Run APITests against PostgreSQL
        # Swift Testing schedules many class-suite instances in parallel
        # regardless of the swift test --parallel flag, and during the
        # FluentKit migration step each Application opens multiple
        # Postgres connections briefly.  At unbounded parallelism that
        # pushes past the default 100-connection cap.
        # `SWT_EXPERIMENTAL_MAXIMUM_PARALLELIZATION_WIDTH=4` caps Swift
        # Testing's internal scheduler to four in-flight tests at a
        # time — well under the connection cap, with most of the
        # parallelism speedup preserved.
        env:
          SWT_EXPERIMENTAL_MAXIMUM_PARALLELIZATION_WIDTH: "4"
        run: |
          if [ "${{ steps.build-cache.outputs.cache-hit }}" = "true" ]; then
            swift test --skip-build --filter APITests
          else
            swift test --filter APITests
          fi

  browser-runner-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Runs in the CI image, which ALREADY ships lua5.4, octave, python3 and
    # node. This job used to be the last one apt-installing its own interpreters
    # on a bare runner -- the very thing this image was built to stop ("before
    # this image, every test job apt-get installed these"). That left ~500
    # interpreter-independent tests depending on an Ubuntu mirror, and on
    # 2026-08-18 the mirror took the job out five times in seven runs, each time
    # hanging ~9m20s in `apt-get update` and dying at the ceiling as `cancelled`
    # -- indistinguishable from a wedged suite, with no test body having run.
    #
    # Only 2 of the 54 test files need an interpreter at all
    # (lua-eval-execution and octave-eval-execution, 31 tests). Those are not
    # removable: they assert the REAL language behaviour the editor keys on --
    # that `exist()` answers 103 for a `1;`-guarded definition, that a missing
    # function says "not defined" -- which is exactly what a mock would get
    # wrong, and what this project has repeatedly been burned by assuming. The
    # install was unnecessary; the tests are not.
    container:
      # swift-CI, not plain swift. The plain image is the toolchain only; the
      # -ci image is the one that adds python3, lua5.4, octave, r-base and node
      # (.github/docker/ci-image/Dockerfile), which is what api-tests and
      # worker-tests use. Getting this wrong does not fail loudly: spawnSync
      # simply cannot find the interpreter, and the suites report
      # `exitError: 'exit null'` with an empty stderr.
      image: ghcr.io/jimwallace/chickadee/swift-ci:6.3-noble
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      # Pinned rather than taking the image's node: the suite targets 24 and
      # `node --test` semantics move between majors.
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Lint first-party frontend JS
        run: scripts/eslint.sh

      # The Lua and Octave auto-compute snippets are EXECUTED, not just
      # shape-checked (*-eval-execution.test.mjs). Those suites skip silently
      # without an interpreter, so a missing one would look like a pass — each
      # asserts its interpreter is present when CI is set, which is what makes
      # the image's lua5.4/octave load-bearing rather than incidental.
      - name: Run browser runner execution tests
        run: node --test Tests/BrowserRunnerJSTests/*.mjs

  worker-tests:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    # Sequential to avoid MockURLProtocol global-state races between
    # ReporterTests + JobPollerTests (both use the same process-wide
    # mock URLProtocol).  withMockURLProtocolLock serializes within
    # the test process; --parallel would just have the runner schedule
    # them across multiple xctest binaries that don't share the lock.
    container:
      # swift-ci: see the api-tests job note.
      image: ghcr.io/jimwallace/chickadee/swift-ci:6.3-noble
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --privileged

    steps:
      - uses: actions/checkout@v6

      - name: Resolve toolchain cache key
        id: toolchain
        run: echo "key=$(swift --version | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore build artifacts
        id: build-cache
        uses: actions/cache/restore@v5
        with:
          path: .build
          key: ${{ runner.os }}-build-v4-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.resolved', 'Package.swift', 'Sources/**', 'Tests/**') }}

      - name: Install worker test dependencies
        # `file` backs SubmissionNormalizer's MIME detection; `python3` runs the
        # real local HTTP servers (LocalHTTPTestServer) and notebook probes in
        # WorkerDaemonTests / NotebookExtractorTests, which otherwise fail (not
        # skip) when the interpreter is absent.  Both are baked into the
        # swift-ci image; the apt-get path is the stale-image fallback.  The
        # graded-language interpreters follow the same all-of-them-or-silent-
        # skip rule as the api-tests job — see that job's note.
        run: |
          if command -v file >/dev/null && command -v python3 >/dev/null && command -v Rscript >/dev/null && command -v lua >/dev/null && command -v octave-cli >/dev/null && command -v g++ >/dev/null && command -v racket >/dev/null && command -v javac >/dev/null; then
            echo "test dependencies already baked into the image; skipping apt-get"
            exit 0
          fi
          apt-get update -qq && apt-get install -y --no-install-recommends file python3 r-base lua5.4 octave g++ racket default-jdk

      - name: Run WorkerTests
        # `SWT_EXPERIMENTAL_MAXIMUM_PARALLELIZATION_WIDTH=4` caps Swift
        # Testing's in-process parallelism, matching the APITests jobs and
        # the nightly coverage run.  WorkerTests spawn real subprocesses
        # (/bin/sh scripts, python3 HTTP servers) and daemon Tasks that get
        # starved when every test fires at once on a 2-core runner; the cap
        # bounds that contention at the scheduler instead of relying solely
        # on the in-suite throttles.
        env:
          SWT_EXPERIMENTAL_MAXIMUM_PARALLELIZATION_WIDTH: "4"
        run: |
          if [ "${{ steps.build-cache.outputs.cache-hit }}" = "true" ]; then
            swift test --skip-build --filter WorkerTests
          else
            swift test --filter WorkerTests
          fi

  # Single aggregate status for branch protection (the editor-smoke-gate
  # pattern): require THIS job instead of the individual jobs, so a job
  # rename or matrix change can't silently detach a required check. Every
  # job above always runs (no internal skips), so anything short of
  # `success` fails the gate.
  #
  # `!cancelled()` is run-scoped: when this whole run is superseded
  # (concurrency cancel — e.g. a newer push, or a rerun of an older head
  # entering the shared group), the gate SKIPS instead of reporting a
  # spurious failure for the cancelled jobs. A single job killed by its
  # own timeout-minutes also reads "cancelled", but the run survives, so
  # the gate still runs and still fails — that detection is load-bearing
  # (2026-07-02: it caught the WorkerDaemonTests 20-minute wedge).
  swift-tests-gate:
    needs:
      - format-lint
      - guard-self-tests
      - mutation-trend-tests
      - build
      - core-tests
      - api-tests
      - api-tests-postgres
      - browser-runner-tests
      - worker-tests
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gate on Swift test job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "${NEEDS_JSON}"
          failed="$(echo "${NEEDS_JSON}" | python3 -c '
          import json, sys
          needs = json.load(sys.stdin)
          print(" ".join(sorted(name for name, need in needs.items() if need["result"] != "success")))
          ')"
          if [ -n "${failed}" ]; then
            echo "::error::jobs not successful: ${failed}"
            exit 1
          fi
          echo "All Swift test jobs green."
