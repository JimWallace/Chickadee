name: Weekly digest

# Every Monday afternoon, after the weekly reports have run, this files ONE
# issue: what is new this week and what needs a person. The reports
# themselves do not change; this is the one place to read them. It covers:
#
#   * Security scans: the newest ZAP baseline run and its issue
#     (zap-baseline.yml, Mondays 07:00), and the open CodeQL alerts.
#   * Kernel currency: when kernel-currency.yml (Mondays 07:00) is red, which
#     kernel packages moved. kernel-currency.yml itself dispatches
#     revendor-kernels.yml in publish mode, which opens an auto-merging pull
#     request; the digest flags a major version bump so a person reads its
#     release notes. It cannot hold it: that pull request usually merges first.
#   * Flake telemetry: the week's tally (flake-telemetry.yml, 06:41).
#   * Dependabot: the open Dependabot pull requests.
#   * Weekly checks on main: the newest run of swift-currency.yml (Mondays
#     07:15), macos-build.yml (Wednesdays) and the scheduled
#     visual-regression.yml (Thursdays). A red one has its own issue with a
#     brief; the digest names it.
#
# NO MODEL. scripts/weekly-digest-render.sh writes every line from rules
# stated in its header, so the digest needs no API key. A model wrote it
# until 2026-11; the repository's key stopped working on 2026-10-20 and two
# digests were silently never filed. The rules are in one script with a
# self-test (script-self-tests in swift-tests.yml).
#
# A REPORT, NEVER A GATE. One open issue, labelled `weekly-digest`: each run
# files a new one and closes the previous ones with a link.
#
# Text from outside the repository (pull request titles, the ZAP issue) goes
# through scripts/ci-post-sanitize.sh before it is posted: no live @mention,
# no image, no credential-shaped text.

on:
  schedule:
    # Mondays at 15:13 UTC, after every weekly report above.
    - cron: "13 15 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  digest:
    name: weekly-digest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: read
      security-events: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      # Each source goes into its own file. A source that cannot be read gets
      # {"error": ...}, so the digest reports the gap and does not read it as
      # "nothing to report". The file list is in the renderer's header.
      - name: Collect the weekly reports
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          set -uo pipefail
          mkdir -p digest
          date -u -d '8 days ago' +%Y-%m-%dT%H:%M:%SZ > digest/window.txt

          # A source that fails writes gh's error, cut short, as JSON. The
          # renderer names the source.
          gap() { jq -n --arg e "$(head -c 200 err.txt 2> /dev/null)" '{error: (if $e == "" then "no error text" else $e end)}'; }

          # Whether the scan ran comes from its runs, not from the issue. The
          # action edits the issue only when the findings change, so an issue
          # that is weeks old is the normal state of a clean week.
          gh run list --repo "$R" --workflow zap-baseline.yml --limit 1 \
              --json conclusion,status,createdAt,url > digest/zap-run.json 2> err.txt \
            || gap > digest/zap-run.json

          # Only the issue that the action itself keeps: anybody can open an
          # issue with that title.
          gh issue list --repo "$R" --state open --limit 10 \
              --search 'in:title "ZAP Scan Baseline Report"' \
              --json number,updatedAt,url,body,author \
              --jq '[.[] | select(.author.is_bot and (.author.login | test("^(app/)?github-actions$"))) | del(.author)][0] // {}' \
              > digest/zap-issue.json 2> err.txt \
            || gap > digest/zap-issue.json
          cp .zap/rules.tsv digest/zap-rules.tsv

          gh api "repos/$R/code-scanning/alerts?state=open&per_page=100" --paginate \
              --jq '[.[] | {number, rule: .rule.id, severity: (.rule.security_severity_level // .rule.severity),
                     created_at, path: .most_recent_instance.location.path,
                     line: .most_recent_instance.location.start_line}]' 2> err.txt \
              | jq -s 'add // []' > digest/codeql-alerts.json \
            || gap > digest/codeql-alerts.json

          # Kernel currency: the newest run, and its failed log when it is red.
          gh run list --repo "$R" --workflow kernel-currency.yml --limit 1 \
              --json databaseId,conclusion,status,createdAt,url > digest/kernel-run.json 2> err.txt \
            || gap > digest/kernel-run.json
          kernel_id="$(jq -r '.[0].databaseId // empty' digest/kernel-run.json 2> /dev/null)"
          kernel_state="$(jq -r '.[0].conclusion // empty' digest/kernel-run.json 2> /dev/null)"
          if [ -n "$kernel_id" ] && [ "$kernel_state" = "failure" ]; then
            gh run view "$kernel_id" --repo "$R" --log-failed 2> /dev/null | cut -c1-300 | tail -n 300 > digest/kernel.log
          fi

          # Flake telemetry: the newest tally on its tracking issue. Only a
          # comment that flake-telemetry.yml wrote counts: anybody can comment
          # on the issue, and a reply is not a tally.
          if ! flake_issue="$(gh api "repos/$R/issues?labels=flake-telemetry&state=open&per_page=1" \
              --jq '.[0].number // empty' 2> err.txt)"; then
            gap > digest/flake.json
          elif [ -z "$flake_issue" ]; then
            echo '{}' > digest/flake.json
          else
            gh api "repos/$R/issues/$flake_issue/comments?per_page=100" --paginate \
                --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("Week ending"))) | {tally: .body}' \
                2> err.txt | jq -s 'last // {}' > digest/flake.json \
              || gap > digest/flake.json
          fi

          gh pr list --repo "$R" --state open --author "app/dependabot" --limit 50 \
              --json number,title,url > digest/dependabot.json 2> err.txt \
            || gap > digest/dependabot.json

          # The weekly checks on main. Each files its own issue when red; the
          # digest reports the newest run, so a check that stopped running is
          # seen too. Visual regression also runs on every UI pull request, so
          # only its scheduled runs count.
          gh run list --repo "$R" --workflow swift-currency.yml --branch main --limit 1 \
              --json conclusion,status,createdAt,url > digest/swift-currency-run.json 2> err.txt \
            || gap > digest/swift-currency-run.json
          gh run list --repo "$R" --workflow macos-build.yml --branch main --limit 1 \
              --json conclusion,status,createdAt,url > digest/macos-run.json 2> err.txt \
            || gap > digest/macos-run.json
          gh run list --repo "$R" --workflow visual-regression.yml --branch main --event schedule --limit 1 \
              --json conclusion,status,createdAt,url > digest/visual-run.json 2> err.txt \
            || gap > digest/visual-run.json

      - name: Write and file the digest
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          set -uo pipefail
          if ! needs="$(scripts/weekly-digest-render.sh digest raw.md)"; then
            echo "::error::The digest could not be written, so none was filed this week."
            exit 1
          fi
          if ! scripts/ci-post-sanitize.sh --max-chars 30000 raw.md body.md; then
            echo "::error::The digest was refused by the sanitizer. It was not filed."
            exit 1
          fi
          previous="$(gh issue list --repo "$R" --label weekly-digest --state open --limit 20 \
            --json number --jq '.[].number')" || {
            echo "::error::Could not list the previous digests."; exit 1; }
          gh label create weekly-digest --repo "$R" --color c5def5 \
            --description "Weekly digest of the scheduled reports (weekly-digest.yml)" --force
          if ! url="$(gh issue create --repo "$R" --label weekly-digest \
            --title "Weekly digest $(date -u +%Y-%m-%d): $needs item(s) for a person" \
            --body-file body.md)"; then
            echo "::error::Could not file the weekly digest."
            exit 1
          fi
          for number in $previous; do
            gh issue close "$number" --repo "$R" --reason completed \
              --comment "Replaced by $url" || true
          done
          echo "Weekly digest: $url" >> "$GITHUB_STEP_SUMMARY"
