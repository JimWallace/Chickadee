name: Runner arm64 image (spike)

# Builds a linux/arm64 image for a runner on Apple Silicon, for example a
# "bonus" runner under Docker Desktop on a Mac (docs/mac-runner.md). It is
# published as its own package, ghcr.io/jimwallace/chickadee-runner, and not
# under the production image's tags: production's deploy pulls
# ghcr.io/jimwallace/chickadee and must never see this build.
#
# This workflow is separate from docker-build.yml on purpose. A failure here
# blocks no deploy, and nothing in the production pipeline changes.
#
# It runs no test suite. swift-tests.yml tests the code once; this job only
# compiles it for another architecture and proves the runner starts there.
#
# It builds on release tags, so the arm64 runner tracks the version that
# production runs, and on demand. On a pull request it runs when a file that
# can break the image or the runner container changes (the list of
# docker-build.yml, which this mirrors), and it pushes nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - "Dockerfile"
      - "Package.swift"
      - "Package.resolved"
      - "docker-compose.yml"
      - "deploy/**"
      - ".dockerignore"
      - ".github/actions/swift-test-setup/**"
      - "scripts/ci-runner-cgroup-probe.sh"
      - ".github/workflows/runner-arm64-image.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/jimwallace/chickadee-runner

# Least privilege by default (#3067). A job that needs more names it in its
# own `permissions:`. `packages: read` lets the job containers and services
# pull the GHCR mirrors with GITHUB_TOKEN.
permissions:
  contents: read
  packages: read

jobs:
  # ── Compile the runner on arm64 ───────────────────────────────────────────
  # Only chickadee-runner: the image is the Dockerfile's `runner` target, which
  # carries no server. The flags match build-release in docker-build.yml.
  build-release-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    container:
      image: ghcr.io/jimwallace/chickadee/swift:6.4-resolute
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve toolchain cache key
        id: setup
        uses: ./.github/actions/swift-test-setup
        with:
          build-cache: none

      # Exact match only, as in docker-build.yml (no restore-keys). The key
      # names the architecture, so it can never restore an amd64 .build/.
      - name: Restore release build artifacts
        id: build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ runner.os }}-${{ runner.arch }}-runner-release-${{ steps.setup.outputs.toolchain-key }}-${{ hashFiles('Package.resolved', 'Package.swift', 'Sources/**') }}

      - name: Build the runner
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: swift build -c release --static-swift-stdlib --build-system native --product chickadee-runner

      - name: Save release build artifacts
        if: github.event_name != 'pull_request' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      - name: Stage the runner for the image build
        run: |
          mkdir -p artifacts
          strip --strip-all -o artifacts/chickadee-runner .build/release/chickadee-runner
          ls -lh artifacts/

      - name: Upload release binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runner-binary-arm64
          path: artifacts/
          retention-days: 1
          if-no-files-found: error

  # ── Package, smoke-test the runner, push ──────────────────────────────────
  build-and-push-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    needs: build-release-arm64
    permissions:
      contents: read
      packages: write
      # Sign the image attestations with this run's OIDC identity, and
      # store them (#3069).
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free up runner disk space
        run: |
          echo "Before cleanup:"; df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune -af || true
          echo "After cleanup:"; df -h /

      - name: Download release binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runner-binary-arm64
          path: artifacts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :latest follows release tags only, so a manual run of a branch cannot
      # move what a runner host pulls.
      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build and load the image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          target: runner
          build-args: |
            RUNNER_BINARIES=prebuilt-runner
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=runner-arm64
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=runner-arm64' || '' }}

      # The checks of the runner step of docker-build.yml, through the Compose
      # runner service, so its user, capabilities and security options are
      # the ones a host runs, plus the arm64 profile. This image runs student
      # code on someone's Mac, so the capability check matters as much here.
      # There is no server: the runner fails to poll, which is expected, and
      # the checks read its startup log and its process.
      - name: "Runner container: job cgroups, uid 999, no capability, languages"
        run: |
          set -euo pipefail
          IMAGE='${{ fromJSON(steps.meta.outputs.json).tags[0] }}'
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          # For Compose only: the runner service names the production image.
          # This tag stays on this job's Docker; nothing pushes it.
          docker tag "$IMAGE" ghcr.io/jimwallace/chickadee:latest
          export RUNNER_SHARED_SECRET=ci-placeholder-secret

          echo "----- the pre-step, with a probe as the command -----"
          docker compose run --rm --no-deps \
            -v "$PWD/scripts/ci-runner-cgroup-probe.sh:/probe.sh:ro" \
            runner "exec /bin/sh /probe.sh"

          run_uid="$(docker compose run --rm --no-deps runner "id -u" 2>/dev/null | tail -n 1)"
          echo "uid: $run_uid"
          [ "$run_uid" = "999" ] \
            || { echo "::error::A runner command runs as uid $run_uid, not 999."; exit 1; }

          docker compose up -d --no-deps runner
          sleep 15
          cid="$(docker compose ps -a -q runner)"
          state="$(docker inspect -f '{{.State.Status}} {{.RestartCount}}' "$cid")"
          runner_log="$(docker compose logs runner 2>&1)"
          printf '%s\n' "$runner_log" | sed -n 1,12p
          if [ "$state" != "running 0" ]; then
            echo "::error::The runner does not stay up (state: $state)."
            exit 1
          fi
          printf '%s\n' "$runner_log" | grep "job cgroups delegated at /sandbox/jobs" >/dev/null \
            || { echo "::error::The pre-step did not delegate the job cgroups."; exit 1; }
          printf '%s\n' "$runner_log" | grep '"job_cgroups":"enabled"' >/dev/null \
            || { echo "::error::The runner does not use job cgroups."; exit 1; }
          pid="$(docker inspect -f '{{.State.Pid}}' "$cid")"
          status="$(sudo grep -E '^(Uid|CapEff|CapBnd):' "/proc/$pid/status")"
          cgroup="$(sudo cat "/proc/$pid/cgroup")"
          echo "$status"; echo "cgroup (host view): $cgroup"
          echo "$status" | grep -qE '^Uid:[[:space:]]+999[[:space:]]+999[[:space:]]+999[[:space:]]+999' \
            || { echo "::error::The runner does not run as uid 999."; exit 1; }
          [ "$(echo "$status" | grep -c '0000000000000000$')" = "2" ] \
            || { echo "::error::The runner holds a capability."; exit 1; }
          case "$cgroup" in
            0::*/sandbox/runner) ;;
            *) echo "::error::The runner is in $cgroup, not /sandbox/runner."; exit 1 ;;
          esac
          profile="$(printf '%s\n' "$runner_log" | grep runner_profile_detected)" \
            || { echo "::error::The runner logged no capability profile."; exit 1; }
          echo "$profile" | grep '"architecture":"arm64"' >/dev/null \
            || { echo "::error::The runner does not report arm64."; exit 1; }
          for lang in cpp java lua octave python r racket; do
            echo "$profile" | grep -E "\"${lang}=" >/dev/null \
              || { echo "::error::The runner does not detect ${lang}."; exit 1; }
          done
          echo "all seven languages detected on arm64"
          docker compose down

      # The same gate as docker-build.yml (#3077): CRITICAL or HIGH with a
      # fix fails the build before the push. This image runs student code on
      # other people's machines. Installed as in docker-build.yml, from the
      # GitHub release with a pinned SHA-256; change both values to upgrade.
      - name: Install Trivy
        env:
          TRIVY_VERSION: "0.70.0"
          TRIVY_SHA256: "2f6bb988b553a1bbac6bdd1ce890f5e412439564e17522b88a4541b4f364fc8d"
        run: |
          set -euo pipefail
          tarball="trivy_${TRIVY_VERSION}_Linux-ARM64.tar.gz"
          dir="$RUNNER_TEMP/trivy"
          mkdir -p "$dir"
          curl -fsSL --retry 4 --retry-all-errors -o "$dir/$tarball" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${tarball}"
          echo "${TRIVY_SHA256}  $dir/$tarball" | sha256sum -c -
          tar -xzf "$dir/$tarball" -C "$dir" trivy
          echo "$dir" >> "$GITHUB_PATH"
          "$dir/trivy" --version

      - name: Scan image for vulnerabilities
        env:
          IMAGE_REF: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          trivy image --exit-code 1 --ignore-unfixed --severity CRITICAL,HIGH \
            --ignorefile .trivyignore.yaml --format table "$IMAGE_REF"

      - name: Push the tested image
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker push "$tag"
          done <<< "$TAGS"

      # Sign what was pushed (#3069). The digest is the registry's own name for
      # the bytes; a tag can be moved, a digest cannot. The attestation is a
      # Sigstore-signed statement: this digest was built by THIS workflow, at
      # THIS ref and commit, in this repository. The signing identity is the
      # run's OIDC token, so no key is stored anywhere. push-to-registry puts
      # the signed bundle beside the image in GHCR, where a verifier reads it
      # with no GitHub API token. To check an image by hand:
      #   gh attestation verify oci://ghcr.io/jimwallace/chickadee-runner:<tag> --repo JimWallace/Chickadee --bundle-from-oci
      - name: Read the pushed digest
        id: digest
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        # Ask the registry, not the local image store, and ask by the
        # :sha-<commit> tag: that is the tag the deployer pulls. :latest can
        # be moved by a later build before this step runs.
        run: |
          set -euo pipefail
          ref="$(grep -m1 ':sha-' <<< "$TAGS")"
          [ -n "$ref" ] || { echo "::error::No :sha- tag in the pushed tags."; exit 1; }
          digest="$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')"
          case "$digest" in
            sha256:????????????????????????????????????????????????????????????????) ;;
            *) echo "::error::No registry digest for $ref: '$digest'."; exit 1 ;;
          esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Pushed $ref = $IMAGE@$digest"

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
