name: Dependabot auto-merge

# Lands every Dependabot pull request that passes CI, with no person involved.
#
# THE POLICY. Dependencies update by default. A Dependabot PR gets auto-merge,
# and the required checks on `main` decide: green merges, red waits. A red
# Dependabot PR is reported by dependency-failure.yml as an issue labelled
# `dependency-update-failed`, which is the point where a person, or an agent
# sent by one, takes over. Nothing here relaxes a check, and nothing merges
# without the checks that every other PR needs.
#
# REGENERATED BYTES FIRST. Three dependency surfaces feed committed output, so
# a bump on its own changes nothing that ships:
#
#   Tools/vendor/package*.json            -> Public/vendor/ (scripts/setup-vendor.sh)
#   Tools/jupyterlite/chickadee-extension -> its labextension and the bundle copy
#                                            (jlpm build, then
#                                            scripts/vendor-chickadee-extension.sh)
#   Tools/jupyterlite/requirements.txt    -> Public/jupyterlite/ (revendor-kernels.yml)
#
# When Dependabot pushes one of those, this job rebuilds the output and pushes
# it onto the Dependabot branch, or, for the kernels, dispatches
# revendor-kernels.yml from `main` with `branch:` set to the Dependabot branch,
# which does the same in its own run (and enables auto-merge itself if its
# rebuild reproduces the committed bytes).
# It does NOT enable auto-merge in that run. The regenerated commit starts this
# workflow again, with a sender other than Dependabot, and that run enables
# auto-merge on the head that carries the regenerated bytes. Enabling it
# earlier could merge the bump before the bytes landed.
#
# TERMINATION. Regeneration runs only when Dependabot itself pushed
# (`github.event.sender.login`). The regenerated commit is pushed by the merge
# token's owner, so the run it starts never regenerates again, even though a
# rebuild is not byte-reproducible (revendor-kernels.yml explains the 16 bytes).
#
# NO BARE BUMP MERGES. A run whose sender is not Dependabot enables auto-merge
# on an update that feeds committed output only when the head commit is a
# regeneration commit. So a person who reopens such a PR, or pushes to its
# branch, gets no auto-merge, and the weekly sweep reports the PR as stalled.
# On an update that feeds no committed output, any push enables auto-merge,
# a person's or an agent's included: the required checks decide, and no
# person reviews that push. The brief in a `dependency-update-failed` issue
# says so.
#
# THE TOKEN STAYS OUT OF THE BUILD. The rebuild runs the install and build
# scripts of the packages just bumped. Nothing later in the same job is safe
# from them, even with no secret in its environment: a build step can add a
# fake `git` through $GITHUB_PATH, set LD_PRELOAD through $GITHUB_ENV, write a
# git hook, or redirect the push with `url.<base>.insteadOf`. So the build is
# its own job, `rebuild`, with a read-only GITHUB_TOKEN and no secret. It
# hands its result to `land` as a patch artifact (scripts/regenerated-patch.sh),
# and `land`, on a new runner where no third-party code has run, refuses the
# patch unless every file in it is regenerated output, then pushes it.
#
# WHOSE TOKEN. A merge made with GITHUB_TOKEN starts no workflow, so
# auto-release.yml would never tag it and nothing would deploy; a push made with
# it is refused by the branch ruleset (GH013). Both use a personal access token
# instead. A run that Dependabot starts can read only Dependabot secrets, where
# the token is DEPENDABOT_MERGE_TOKEN. The run started by the regenerated
# commit is not Dependabot's and reads Actions secrets, where it is
# RELEASE_TOKEN. The token needs Contents, Pull requests and Workflows (read and
# write) on this repository. The first step checks it, and a missing or broken
# token fails the run, which dependency-failure.yml turns into an issue.

on:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: dependabot-auto-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read


jobs:
  # Decides what this update needs. Runs no code from the PR.
  plan:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    env:
      PR: ${{ github.event.pull_request.number }}
      SENDER: ${{ github.event.sender.login }}
      R: ${{ github.repository }}
    outputs:
      vendor: ${{ steps.plan.outputs.vendor }}
      extension: ${{ steps.plan.outputs.extension }}
      kernels: ${{ steps.plan.outputs.kernels }}
      merge: ${{ steps.plan.outputs.merge }}
    steps:
      - name: Check the merge token
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_MERGE_TOKEN || secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Neither DEPENDABOT_MERGE_TOKEN (a Dependabot secret) nor RELEASE_TOKEN (an Actions secret) is set, so this PR cannot be landed. See docs/dependency-updates.md."
            exit 1
          fi
          if ! headers="$(gh api -i "repos/$R/pulls/$PR" 2>&1 | tr -d '\r')"; then
            echo "::error::The merge token cannot read this pull request. It is expired, revoked, or lacks Pull requests access to $R."
            exit 1
          fi
          expiry="$(sed -n 's/^github-authentication-token-expiration: //Ip' <<<"$headers" | head -1)"
          echo "Merge token works. Expires: ${expiry:-never}" >> "$GITHUB_STEP_SUMMARY"

      - name: Decide what this update needs
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files="$(gh pr diff "$PR" --repo "$R" --name-only)"
          has() { grep -Eq "$1" <<<"$files"; }
          vendor=false extension=false kernels=false
          if has '^Tools/vendor/package(-lock)?\.json$'; then vendor=true; fi
          if has '^Tools/jupyterlite/chickadee-extension/(package\.json|yarn\.lock)$'; then extension=true; fi
          if has '^Tools/jupyterlite/requirements\.txt$'; then kernels=true; fi
          feeds_output=false
          if [ "$vendor$extension$kernels" != "falsefalsefalse" ]; then feeds_output=true; fi
          merge=true
          if [ "$SENDER" = "dependabot[bot]" ]; then
            # Dependabot's own push: regenerate, and let the regenerated
            # commit's run enable auto-merge.
            if [ "$feeds_output" = true ]; then merge=false; fi
          else
            # Not Dependabot: never regenerate. See NO BARE BUMP MERGES.
            vendor=false extension=false kernels=false
            if [ "$feeds_output" = true ]; then
              last="$(gh pr view "$PR" --repo "$R" --json commits \
                --jq '.commits[-1].messageHeadline')"
              case "$last" in
                "chore(deps): regenerate the committed bytes"*|"chore(jupyterlite): re-vendor the xeus kernels"*) ;;
                *)
                  merge=false
                  echo "::warning::The head commit is not a regeneration commit, so auto-merge stays off: \"$last\"."
                  ;;
              esac
            fi
          fi
          {
            echo "vendor=$vendor"
            echo "extension=$extension"
            echo "kernels=$kernels"
            echo "merge=$merge"
          } >> "$GITHUB_OUTPUT"
          echo "Sender $SENDER; regenerate vendor=$vendor extension=$extension kernels=$kernels; auto-merge=$merge" >> "$GITHUB_STEP_SUMMARY"

      # A Dependabot rebase can arrive with auto-merge already on from an
      # earlier head. Turn it off until the regenerated bytes are pushed, so
      # the bare bump cannot merge first.
      - name: Hold auto-merge until the bytes are regenerated
        if: steps.plan.outputs.merge != 'true'
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_MERGE_TOKEN || secrets.RELEASE_TOKEN }}
        run: |
          set -uo pipefail
          state="$(gh pr view "$PR" --repo "$R" --json autoMergeRequest --jq '.autoMergeRequest != null')"
          if [ "$state" = "true" ] && ! gh pr merge "$PR" --repo "$R" --disable-auto; then
            echo "::error::Auto-merge is on and could not be turned off, so the bump could merge before its regenerated bytes."
            exit 1
          fi

  # Runs the bumped packages' code. No secret, a read-only GITHUB_TOKEN, and
  # no step after the build that holds a credential: its only output is the
  # patch artifact, which `land` checks before it uses it.
  rebuild:
    needs: plan
    if: needs.plan.outputs.vendor == 'true' || needs.plan.outputs.extension == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The exact head that `plan` read. `land` checks out the same commit
          # and applies the patch to it.
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Rebuild Public/vendor
        if: needs.plan.outputs.vendor == 'true'
        run: scripts/setup-vendor.sh

      - uses: actions/setup-python@v7
        if: needs.plan.outputs.extension == 'true'
        with:
          python-version: "3.13"

      - name: Rebuild the Chickadee extension and vendor it into the bundle
        if: needs.plan.outputs.extension == 'true'
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          set -euo pipefail
          # `jupyter labextension build` needs JupyterLab on the path. The
          # version follows the extension's own @jupyterlab/application pin.
          lab="$(jq -r '.dependencies["@jupyterlab/application"]' \
            Tools/jupyterlite/chickadee-extension/package.json | tr -d '~^')"
          python -m pip install --quiet "jupyterlab==$lab"
          cd Tools/jupyterlite/chickadee-extension
          # jlpm is Yarn 3.5, and the lockfile is that Yarn's format.
          corepack yarn@3.5.0 install
          corepack yarn@3.5.0 build
          node --test test/*.test.mjs
          cd "$GITHUB_WORKSPACE"
          scripts/vendor-chickadee-extension.sh
          scripts/vendor-chickadee-extension.sh --check

      # Only regenerated output goes into the patch. `land` refuses any other
      # path, so keep this list and the one in `land` the same.
      - name: Write the regenerated bytes as a patch
        id: patch
        run: |
          set -euo pipefail
          scripts/regenerated-patch.sh make "$RUNNER_TEMP/regenerated.patch" \
            Public/vendor Public/jupyterlite \
            Tools/jupyterlite/chickadee-extension \
            >> "$GITHUB_OUTPUT"
          if grep -qx 'changed=false' "$GITHUB_OUTPUT"; then
            echo "The rebuild reproduced the committed bytes." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v7
        if: steps.patch.outputs.changed == 'true'
        with:
          name: regenerated-patch
          path: ${{ runner.temp }}/regenerated.patch
          retention-days: 3
          if-no-files-found: error

  # Holds the merge token. Runs no code from the bumped packages: it checks out
  # the PR head, checks and applies the patch, and calls git and GitHub.
  land:
    needs: [plan, rebuild]
    if: >-
      always()
      && needs.plan.result == 'success'
      && (needs.rebuild.result == 'success' || needs.rebuild.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      # To dispatch revendor-kernels.yml.
      actions: write
    env:
      PR: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      R: ${{ github.repository }}
      PUSH: ${{ needs.rebuild.outputs.changed == 'true' }}
    steps:
      - uses: actions/checkout@v7
        if: env.PUSH == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # The checker from main, not from the PR head: the boundary should not
      # depend on a file that a push to this branch can change.
      - uses: actions/checkout@v7
        if: env.PUSH == 'true'
        with:
          ref: main
          path: .trusted
          sparse-checkout: scripts/regenerated-patch.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/download-artifact@v8
        if: env.PUSH == 'true'
        with:
          name: regenerated-patch
          path: ${{ runner.temp }}/regenerated

      # A push from the exact head `plan` read. If Dependabot pushed again in
      # the meantime, the push is not a fast-forward and fails; the run for
      # the newer head does the work.
      - name: Push the regenerated bytes
        if: env.PUSH == 'true'
        env:
          PUSH_TOKEN: ${{ secrets.DEPENDABOT_MERGE_TOKEN || secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          .trusted/scripts/regenerated-patch.sh apply "$RUNNER_TEMP/regenerated/regenerated.patch" \
            Public/vendor Public/jupyterlite \
            Tools/jupyterlite/chickadee-extension
          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${R}.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(deps): regenerate the committed bytes for this update

          Rebuilt by .github/workflows/dependabot-auto.yml. Regenerated output only."
          git push origin "HEAD:$HEAD_REF"
          echo "Pushed the regenerated bytes; the run that push starts enables auto-merge." >> "$GITHUB_STEP_SUMMARY"

      - name: Re-vendor the kernels on this branch
        if: needs.plan.outputs.kernels == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # From main, so the dispatched run is main's copy of the workflow
          # rather than the Dependabot branch's older one.
          gh workflow run revendor-kernels.yml --repo "$R" --ref main \
            -f branch="$HEAD_REF" -f commit=true -f publish=false
          echo "Dispatched revendor-kernels.yml for $HEAD_REF; its commit starts the run that enables auto-merge." >> "$GITHUB_STEP_SUMMARY"

      # On Dependabot's own push this runs only when nothing needed
      # regenerating, or the regeneration reproduced the committed bytes.
      - name: Enable auto-merge
        if: >-
          needs.plan.outputs.kernels != 'true'
          && env.PUSH != 'true'
          && (needs.plan.outputs.merge == 'true'
              || needs.plan.outputs.vendor == 'true'
              || needs.plan.outputs.extension == 'true')
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_MERGE_TOKEN || secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh pr merge "$PR" --repo "$R" --auto --merge
          echo "Auto-merge is on. The required checks decide." >> "$GITHUB_STEP_SUMMARY"
