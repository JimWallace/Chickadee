      # Shared scaffold: exact-match build-cache restore, server build,
      # Node + Playwright install (engine download cached).
      - uses: ./.github/actions/browser-probe-setup
        with:
          browser: ${{ matrix.browser }}
          server-artifact: probe-server

      - name: Drive command-bridge probe (${{ matrix.browser }})
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.browser == 'both' || github.event.inputs.browser == matrix.browser }}
        env:
          SMOKE_BROWSER: ${{ matrix.browser }}
          SMOKE_CHECK: notebook-bridge-check.mjs
        run: Tools/editor-smoke-test/run-smoke.sh

  # ── Notebook lifecycle probe ────────────────────────────────────────────
  # DIAGNOSTIC harness — NOT a required gate. Drives the editor working-copy
  # lifecycle the required editor-smoke gate doesn't cover (it proves boot + a
  # Submit grade only): on the real student notebook page it edits a cell, saves
  # it to the Drive (Ctrl+S), reloads, and asserts the edit persisted — the
  # keep-local reseed path. Added to confirm the JupyterLite 0.8 / Pyodide 314
  # upgrade keeps the ContentsManager save / persist / reseed flow healthy (0.8
  # reworked the Drive wiring). (Student self-reset coverage is a follow-up: it
  # needs a full published-assignment seed, not the bare test setup used here.)
  #
  # Runs both engines (Chromium + WebKit). Not wired into branch protection — a
  # flaky editor-lifecycle run must not block unrelated merges; it's a confidence
  # signal for editor / bundle changes and an on-demand check.
  lifecycle:
    needs: [changes, server]
    if: ${{ needs.changes.outputs.lifecycle == 'true' }}
    runs-on: ubuntu-latest
    # This budget is from before the `server` job took the build out of this
    # job. A leg now downloads the binary. Lower it once runs show the times.
    #
    # 50, not 30: `browser-probe-setup` cold-builds chickadee-server whenever the
    # shared build cache misses, and it MISSES on every PR that touches
    # Sources/** or Tests/** — the cache key hashes both, and the job that
    # populates it (`build` in swift-tests.yml) is a different workflow, so
    # `needs:` cannot order this job after it.  Measured on PR #1264: the setup
    # step alone took 23.2 min on a run that passed and 29.0 min on one that was
    # killed, against a 30 min budget.  That is 85-97% of the ceiling spent
    # before the first test runs, so the old value only ever worked on a cache
    # hit and failed as a *timeout*, which GitHub reports as `cancelled` and the
    # gate correctly treats as a failure.
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    container:
      # swift-ci, not the plain mirror: it bakes in nodejs/npm (and the rest of
      # the test packages), so the probe harness does not apt-get them at job
      # start. Toolchain-identical to the mirror, so the shared .build cache
      # keys still match — see .github/docker/ci-image/Dockerfile.
      image: ghcr.io/jimwallace/chickadee/swift-ci:6.4-resolute
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --privileged

    steps:
      - uses: actions/checkout@v7

      # Shared scaffold: exact-match build-cache restore, server build,
      # Node + Playwright install (engine download cached).
      - uses: ./.github/actions/browser-probe-setup
        with:
          browser: ${{ matrix.browser }}
          server-artifact: probe-server

      - name: Drive notebook lifecycle (${{ matrix.browser }})
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.browser == 'both' || github.event.inputs.browser == matrix.browser }}
        env:
          SMOKE_BROWSER: ${{ matrix.browser }}
          SMOKE_CHECK: notebook-lifecycle-check.mjs
        run: Tools/editor-smoke-test/run-smoke.sh

  # ── Notebook reset probe ────────────────────────────────────────────────
  # DIAGNOSTIC harness — NOT a required gate. Confirms instructor/self "Reset
  # notebook" actually takes effect on the JupyterLite 0.8 editor — the regression
  # fixed in the same PR: 0.8 doesn't expose window.jupyterapp, so the client
  # reseed silently no-op'd and a reset left the student's stale IndexedDB copy on
  # screen. Seeds a published, open, no-suite assignment (no runner needed), has
  # the student edit+save, hits the self-reset endpoint, reloads, and asserts the
  # edit marker is GONE. Without the fix this FAILS (stale copy survives); with it,
  # the Drive entry is evicted and the editor re-fetches the reset starter.
  #
  # Runs both engines (Chromium + WebKit). Not wired into branch protection — a
  # flaky reset run must not block unrelated merges; it's a confidence signal for
  # editor / reseed changes and an on-demand check.
  reset:
    needs: [changes, server]
    if: ${{ needs.changes.outputs.reset == 'true' }}
    runs-on: ubuntu-latest
    # This budget is from before the `server` job took the build out of this
    # job. A leg now downloads the binary. Lower it once runs show the times.
    #
    # 50, not 30: `browser-probe-setup` cold-builds chickadee-server whenever the
    # shared build cache misses, and it MISSES on every PR that touches
    # Sources/** or Tests/** — the cache key hashes both, and the job that
    # populates it (`build` in swift-tests.yml) is a different workflow, so
    # `needs:` cannot order this job after it.  Measured on PR #1264: the setup
    # step alone took 23.2 min on a run that passed and 29.0 min on one that was
    # killed, against a 30 min budget.  That is 85-97% of the ceiling spent
    # before the first test runs, so the old value only ever worked on a cache
    # hit and failed as a *timeout*, which GitHub reports as `cancelled` and the
    # gate correctly treats as a failure.
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    container:
      # swift-ci, not the plain mirror: it bakes in nodejs/npm (and the rest of
      # the test packages), so the probe harness does not apt-get them at job
      # start. Toolchain-identical to the mirror, so the shared .build cache
      # keys still match — see .github/docker/ci-image/Dockerfile.
      image: ghcr.io/jimwallace/chickadee/swift-ci:6.4-resolute
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --privileged

    steps:
      - uses: actions/checkout@v7

      # Shared scaffold: exact-match build-cache restore, server build,
      # Node + Playwright install (engine download cached).
      - uses: ./.github/actions/browser-probe-setup
        with:
          browser: ${{ matrix.browser }}
          server-artifact: probe-server

      - name: Drive notebook reset probe (${{ matrix.browser }})
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.browser == 'both' || github.event.inputs.browser == matrix.browser }}
        env:
          SMOKE_BROWSER: ${{ matrix.browser }}
          SMOKE_CHECK: notebook-reset-check.mjs
        run: Tools/editor-smoke-test/run-smoke.sh

  # ── Grading-hang probe ──────────────────────────────────────────────────
  # DIAGNOSTIC harness — NOT a required gate. Reproduces and MEASURES the
  # intermittent browser-grading hang seen on JupyterLite 0.8 / Pyodide 314: the
  # real student notebook page boots the editor kernel's Pyodide AND, on Submit, a
  # SECOND Pyodide in grading-worker.js under cross-origin isolation, and the grade
  # intermittently never completes (~1 in 6 on 314; reliable on 0.7.6). The
  # required editor-smoke gate runs the grading check ONCE per engine, so a 1/6
  # flake usually slips through; this probe loops it to surface the rate and, on a
  # hang, prints the grading submit-phase breadcrumbs (grading_init_start/done,
  # python_kernel_booted, env_configured, suite_started/done) that localize WHERE it
  # wedged. A reproduced hang is the SIGNAL. Thresholds (docs/ci-flakiness.md,
  # Family 2): chromium is green only at hangs=0 everywhere; webkit tolerates
  # hangs<=1 on pull_request runs (with a loud warning — the known ambient
  # exec-hang under CI load must not fail unrelated PRs) while dispatch and
  # scheduled runs keep the hard zero, so the probe stays the regression guard
  # a real fix must turn green.
  #
  # Intentionally NOT required in branch protection: a reproduced hang must not
  # block unrelated PRs. Runs on PRs touching the grading / editor / isolation
  # surface, on demand (workflow_dispatch) with a larger iteration count, and
  # once a week on a schedule. The weekly run is the hard-zero datapoint the
  # gate policy describes: until 2026-09-20 the policy named "scheduled runs"
  # while no schedule existed, so the only hard-zero runs were dispatches nobody
  # made. It fires before the Monday flake-telemetry tally (flake-telemetry.yml),
  # which counts this workflow's red runs and warnings.
  grading-probe:
    needs: [changes, server]
    if: ${{ needs.changes.outputs.grading == 'true' }}
    runs-on: ubuntu-latest
    # This budget is from before the `server` job took the build out of this
    # job. A leg now downloads the binary. Lower it once runs show the times.
    #
    # 75, not 50: this job pays the same cold `browser-probe-setup` build as the
    # other probes (23-29 min when the shared cache misses, which it does on any
    # PR touching Sources/** or Tests/**) and THEN runs 12 grading iterations per
    # engine on top.  On PR #1264 the webkit leg ran the full 50 min and was
    # killed before finishing, while chromium — which happened to get a warm
    # cache — completed the same 12 iterations comfortably.  The old budget was
    # sized for the warm path only.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    # Same Swift image as the other editor jobs so the cached server binary runs
    # and the vendored kernels it serves are the exact build CI ships.
    container:
      # swift-ci, not the plain mirror: it bakes in nodejs/npm (and the rest of
      # the test packages), so the probe harness does not apt-get them at job
      # start. Toolchain-identical to the mirror, so the shared .build cache
      # keys still match — see .github/docker/ci-image/Dockerfile.
      image: ghcr.io/jimwallace/chickadee/swift-ci:6.4-resolute
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --privileged

    steps:
      - uses: actions/checkout@v7

      # Shared scaffold: exact-match build-cache restore, server build,
      # Node + Playwright install (engine download cached).
      - uses: ./.github/actions/browser-probe-setup
        with:
          browser: ${{ matrix.browser }}
          server-artifact: probe-server

      # Skip the non-selected engine on a single-engine workflow_dispatch; always
      # run both on a pull_request (inputs are empty there).
      - name: Probe browser grading rate (${{ matrix.browser }})
        # Force bash: the container's default `run` shell is `sh` (dash), which
        # lacks `set -o pipefail` (the loop below otherwise dies with "Illegal
        # option -o pipefail" before running a single iteration).
        shell: bash
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.browser == 'both' || github.event.inputs.browser == matrix.browser }}
        env:
          SMOKE_BROWSER: ${{ matrix.browser }}
          SMOKE_CHECK: notebook-page-check.mjs
          SMOKE_SUBMIT_MS: ${{ github.event.inputs.grading_submit_ms || '300000' }}
          ITER: ${{ github.event.inputs.grading_iterations || '12' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -uo pipefail
          runs="$ITER"
          hangs=0
          for i in $(seq 1 "$runs"); do
            echo "::group::grading iteration $i/$runs (engine=$SMOKE_BROWSER)"
            # Distinct port per iteration so a lingering socket from a killed
            # server can't block the next boot. run-smoke.sh boots a fresh server
            # (serving the 0.8 bundle), runs ONE full seed -> submit -> grade,
            # and tears down; the check prints the grading breadcrumb trail.
            if PORT=$((8100 + i)) Tools/editor-smoke-test/run-smoke.sh; then
              echo "iter $i: PASS"
            else
              rc=$?
              hangs=$((hangs + 1))
              echo "iter $i: HANG/FAIL (rc=$rc)"
            fi
            echo "::endgroup::"
          done
          echo "GRADING-HANG PROBE RESULT — hangs=${hangs}/${runs} engine=${SMOKE_BROWSER}"
          # Gate policy (docs/ci-flakiness.md, Family 2): chromium is hard-zero
          # everywhere. webkit carries a known, tracked ambient exec-hang rate
          # under CI load (docs/archive/exec-hang-investigation.md), so on PR runs a
          # SINGLE webkit hang warns loudly instead of failing an unrelated PR.
          # workflow_dispatch / scheduled runs keep the hard zero — the probe
          # remains the regression guard a real fix must turn green, and the
          # ambient rate stays visible there rather than silently tolerated.
          allowed=0
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$SMOKE_BROWSER" = "webkit" ]; then
            allowed=1
          fi
          if [ "$hangs" -gt "$allowed" ]; then
            echo "::error::grading hangs=${hangs}/${runs} on ${SMOKE_BROWSER} exceeds allowed=${allowed} for event=${EVENT_NAME}"
            exit 1
          fi
          if [ "$hangs" -gt 0 ]; then
            echo "::warning::AMBIENT FLAKE TOLERATED on PR run: hangs=${hangs}/${runs} on ${SMOKE_BROWSER} (allowed<=${allowed}). The webkit exec-hang is real and tracked — docs/ci-flakiness.md Family 2, docs/archive/exec-hang-investigation.md. Do not treat this warning as noise: if you see it often, the ambient rate is rising."
          fi
