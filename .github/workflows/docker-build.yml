name: Build and Push Docker Image

on:
  # On PRs this is the longest job in the suite, so only run it when something
  # that can actually affect the image build or the Trivy scan changes — the
  # Dockerfile, the dependency graph, the entrypoint/deploy config, or this
  # workflow itself.  Source-only PRs skip it: the debug build in
  # swift-tests.yml already proves the code compiles, and ongoing base-image
  # CVE drift is caught by the unconditional push-to-main / tag builds below.
  pull_request:
    paths:
      - "Dockerfile"
      - "Package.swift"
      - "Package.resolved"
      - "docker-compose.yml"
      - "deploy/**"
      - ".github/workflows/docker-build.yml"
  push:
    branches: [main]
    tags: ["v*"]

# Cancel a superseded in-progress run when a PR is pushed again, but never
# cancel main / tag builds — those push images and must not be interrupted
# mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/jimwallace/chickadee

jobs:
  # ── Compile the release binaries once, with caching ───────────────────────
  # The image build used to `swift build -c release` inside the Dockerfile, so
  # any source change busted the compile layer and triggered a cold ~13 min
  # rebuild every push.  Compiling here instead — with the same actions/cache +
  # git-restore-mtime incremental scheme as swift-tests.yml's `build` job — lets
  # a source-only change recompile incrementally, and the image build below
  # just packages the prebuilt binaries (seconds).  Debug-for-tests and
  # release-for-ship stay two separate caches; tests are never built in release.
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/jimwallace/chickadee/swift:6.3-noble
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # Full (blobless) history so `git restore-mtime` can read commit times.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none

      # Reset source mtimes to commit times so llbuild recompiles only files
      # touched by new commits.
      - uses: ./.github/actions/restore-git-mtimes

      - name: Resolve toolchain cache key
        id: toolchain
        run: echo "key=$(swift --version | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # Release cache is keyed on Sources + manifest only (no Tests/** — the
      # release products don't build the test targets), in its own `-release-`
      # namespace, separate from the debug `-build-` cache.
      - name: Cache release build artifacts
        id: build-cache
        uses: actions/cache@v5
        with:
          path: .build
          key: ${{ runner.os }}-release-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.resolved', 'Package.swift', 'Sources/**') }}
          restore-keys: |
            ${{ runner.os }}-release-${{ steps.toolchain.outputs.key }}-

      # Skip only on an exact cache hit (artifacts already match this tree); a
      # restore-keys partial hit recompiles incrementally over the older tree.
      - name: Build release products
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: |
          swift build -c release --static-swift-stdlib --product chickadee-server
          swift build -c release --static-swift-stdlib --product chickadee-runner

      - name: Stage binaries for the image build
        run: |
          mkdir -p artifacts
          cp .build/release/chickadee-server .build/release/chickadee-runner artifacts/
          ls -lh artifacts/

      - name: Upload release binaries
        uses: actions/upload-artifact@v7
        with:
          name: release-binaries
          path: artifacts/
          retention-days: 1
          if-no-files-found: error

  # ── Assemble, scan & push the Docker image ────────────────────────────────
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build-release
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      # The Chickadee image is large (~1.4 GB vendored Pyodide + full distro +
      # static binaries).  The build `load:true`s it into the local Docker
      # daemon and Trivy then re-exports it to a tarball under /tmp to scan —
      # two copies on the runner's root FS, on top of the BuildKit gha cache.
      # On a default ubuntu-latest (~14 GB free) that intermittently blows the
      # disk ("no space left on device") and fails the scan *before* the push
      # step runs, so the versioned image never publishes (v0.4.231).  Reclaim
      # the preinstalled toolchains we don't use (~25 GB) so the scan has room.
      - name: Free up runner disk space
        run: |
          echo "Before cleanup:"; df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune -af || true
          echo "After cleanup:"; df -h /

      # Prebuilt release binaries from the build-release job land in ./artifacts;
      # the Dockerfile's `prebuilt` stage COPYs them in (BINARIES=prebuilt).
      - name: Download release binaries
        uses: actions/download-artifact@v8
        with:
          name: release-binaries
          path: artifacts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            # :latest on pushes to main AND on version tags
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            # :sha-<short-commit> on every push (immutable, good for rollback)
            type=sha,prefix=sha-
            # :v0.4.1 etc. on version tags
            type=semver,pattern={{version}}

      - name: Build (and push on main/tags)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          # Use the prebuilt binaries instead of compiling in-image.
          build-args: |
            BINARIES=prebuilt
          # Always load locally so Trivy can scan it; push separately below.
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # BuildKit layer cache for the runtime image (apt deps, asset copies).
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # THE STEP THAT WOULD HAVE CAUGHT v0.5.65.
      #
      # Until now nothing in this pipeline ever STARTED the image: checkout →
      # build → scan → push. A build can therefore be green, publish `:latest`,
      # and produce a container that never answers `/health` — which is exactly
      # what happened on v0.5.65, where the blue-green deployer aborted four
      # consecutive swaps and the defect was only visible on the production
      # host. A green build is not evidence the image runs.
      #
      # The image is already `load: true`d above for Trivy, so this costs one
      # container start and no extra pull.
      #
      # `AUTH_MODE=local` is required, not cosmetic: the server refuses to boot
      # under any other mode without OIDC credentials, and a smoke test is not
      # the place to hold real ones. Everything else runs at its default —
      # sqlite, no worker secret (one is generated), no MCP — which is enough to
      # prove the binary starts, migrations apply, and the HTTP server serves.
      #
      # The budget MIRRORS PRODUCTION deliberately: `wait_healthy` in
      # scripts/bluegreen-deploy.sh gives a new color 90s
      # (CHICKADEE_HEALTH_TIMEOUT). Matching it means this step fails whenever
      # the deployer would abort, rather than passing on a slower-but-tolerated
      # boot and letting the difference reach the host.
      - name: Smoke-test the image (boot it and probe /health)
        run: |
          set -euo pipefail
          IMAGE='${{ fromJSON(steps.meta.outputs.json).tags[0] }}'
          echo "Booting $IMAGE ..."
          docker run -d --name chickadee-smoke \
            -e AUTH_MODE=local \
            -p 18080:8080 \
            "$IMAGE"

          # The probe records the HTTP CODE, not just success. `curl -sf` — what
          # the deployer's wait_healthy uses — fails identically on "no
          # response" and on "503", and /health answers 503 whenever its
          # database check fails. That makes a broken image and a healthy image
          # that cannot reach its database look the same to the deploy gate,
          # which is precisely the ambiguity that made v0.5.65 hard to diagnose
          # from off-host. Here we can tell them apart, so we do.
          ok=0
          last_code=000
          for i in $(seq 1 90); do
            last_code="$(curl -s -o /tmp/health.body -w '%{http_code}' \
              http://127.0.0.1:18080/health 2>/dev/null || echo 000)"
            if [ "$last_code" = "200" ]; then
              echo "Healthy after ${i}s."
              ok=1
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' chickadee-smoke 2>/dev/null)" != "true" ]; then
              echo "::error::Container exited before answering /health."
              break
            fi
            sleep 1
          done

          if [ "$ok" -ne 1 ]; then
            if [ "$last_code" = "000" ]; then
              echo "::error::No HTTP response from /health within 90s — the server never began serving."
            else
              echo "::error::/health answered ${last_code}, not 200 — the server is up but degraded (503 means its database check failed)."
              echo "----- /health body -----"
              cat /tmp/health.body 2>/dev/null || true
              echo
            fi
            echo "::error::The blue-green deployer would abort this release."
            echo "----- docker inspect -----"
            docker inspect -f 'State: {{.State.Status}}  ExitCode: {{.State.ExitCode}}  OOMKilled: {{.State.OOMKilled}}  Error: {{.State.Error}}' chickadee-smoke || true
            echo "----- container logs (tail 200) -----"
            docker logs --tail 200 chickadee-smoke 2>&1 || true
            docker rm -f chickadee-smoke >/dev/null 2>&1 || true
            exit 1
          fi

          echo "----- container logs (tail 40, for the record) -----"
          docker logs --tail 40 chickadee-smoke 2>&1 || true
          docker rm -f chickadee-smoke >/dev/null 2>&1 || true

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL

      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            BINARIES=prebuilt
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
