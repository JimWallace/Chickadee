name: Build and Push Docker Image

on:
  # On PRs this is the longest job in the suite, so only run it when something
  # that can actually affect the image build or the Trivy scan changes — the
  # Dockerfile, the dependency graph, the entrypoint/deploy config, or this
  # workflow itself.  Source-only PRs skip it: the debug build in
  # swift-tests.yml already proves the code compiles, and ongoing base-image
  # CVE drift is caught by the unconditional push-to-main / tag builds below.
  pull_request:
    paths:
      - "Dockerfile"
      - "Package.swift"
      - "Package.resolved"
      - "docker-compose.yml"
      - "deploy/**"
      - ".github/workflows/docker-build.yml"
      # It gives the toolchain key of the release cache.
      - ".github/actions/swift-test-setup/**"
      # build-release runs it before the compile.
      - ".github/actions/restore-git-mtimes/**"
      # It decides what reaches the image build context.
      - ".dockerignore"
      # The container smoke test mounts it.
      - "scripts/ci-runner-cgroup-probe.sh"
  push:
    branches: [main]
    tags: ["v*"]

# Cancel a superseded in-progress run when a PR is pushed again, but never
# cancel main / tag builds — those push images and must not be interrupted
# mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/jimwallace/chickadee

jobs:
  # ── Compile the release binaries once, with caching ───────────────────────
  # The image build used to `swift build -c release` inside the Dockerfile, so
  # any source change busted the compile layer and triggered a cold ~13 min
  # rebuild every push.  Compiling here instead — with actions/cache plus
  # `git restore-mtime`, so a cache restored by prefix builds incrementally
  # (swift-tests.yml's `build` job dropped restore-mtime because its cache
  # matches exactly) — lets a source-only change recompile incrementally, and
  # the image build below
  # just packages the prebuilt binaries (seconds).  Debug-for-tests and
  # release-for-ship stay two separate caches; tests are never built in release.
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/jimwallace/chickadee/swift:6.4-resolute
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # Full (blobless) history so `git restore-mtime` can read commit times.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      # Reset source mtimes to commit times so llbuild recompiles only files
      # touched by new commits.
      - uses: ./.github/actions/restore-git-mtimes

      # Only the toolchain key. This job does not use the shared debug
      # `-build-` cache, so `build-cache` is none.
      - name: Resolve toolchain cache key
        id: setup
        uses: ./.github/actions/swift-test-setup
        with:
          build-cache: none

      # Release cache is keyed on Sources + manifest only (no Tests/** — the
      # release products don't build the test targets), in its own `-release-`
      # namespace, separate from the debug `-build-` cache.
      - name: Cache release build artifacts
        id: build-cache
        uses: actions/cache@v6
        with:
          path: .build
          key: ${{ runner.os }}-release-${{ steps.setup.outputs.toolchain-key }}-${{ hashFiles('Package.resolved', 'Package.swift', 'Sources/**') }}
          restore-keys: |
            ${{ runner.os }}-release-${{ steps.setup.outputs.toolchain-key }}-

      # Skip only on an exact cache hit (artifacts already match this tree); a
      # restore-keys partial hit recompiles incrementally over the older tree.
      - name: Build release products
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: |
          # --build-system native: see the Dockerfile comment. SwiftPM 6.4's
          # default Swift Build engine omits lib_FoundationICU.a from the
          # product link line, so the static release link fails with ~300
          # undefined ICU symbols. Only the static release link is affected.
          swift build -c release --static-swift-stdlib --build-system native --product chickadee-server
          swift build -c release --static-swift-stdlib --build-system native --product chickadee-runner

      - name: Stage binaries for the image build
        run: |
          mkdir -p artifacts
          cp .build/release/chickadee-server .build/release/chickadee-runner artifacts/
          ls -lh artifacts/

      - name: Upload release binaries
        uses: actions/upload-artifact@v7
        with:
          name: release-binaries
          path: artifacts/
          retention-days: 1
          if-no-files-found: error

  # ── Assemble, scan & push the Docker image ────────────────────────────────
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build-release
    permissions:
      contents: read
      packages: write

    # Postgres for the smoke test below. Production runs postgres, and the
    # server's /health answers 503 whenever its database check fails — so a
    # smoke test on the sqlite default proves the binary starts and nothing
    # about the path the deploy gate actually keys on.
    services:
      postgres:
        image: ghcr.io/jimwallace/chickadee/postgres:16
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_DB: chickadee_smoke
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chickadee_smoke"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      # The Chickadee image is large (~1.4 GB vendored Pyodide + full distro +
      # static binaries).  The build `load:true`s it into the local Docker
      # daemon and Trivy then re-exports it to a tarball under /tmp to scan —
      # two copies on the runner's root FS, on top of the BuildKit gha cache.
      # On a default ubuntu-latest (~14 GB free) that intermittently blows the
      # disk ("no space left on device") and fails the scan *before* the push
      # step runs, so the versioned image never publishes (v0.4.231).  Reclaim
      # the preinstalled toolchains we don't use (~25 GB) so the scan has room.
      - name: Free up runner disk space
        run: |
          echo "Before cleanup:"; df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune -af || true
          echo "After cleanup:"; df -h /

      # Prebuilt release binaries from the build-release job land in ./artifacts;
      # the Dockerfile's `prebuilt` stage COPYs them in (BINARIES=prebuilt).
      - name: Download release binaries
        uses: actions/download-artifact@v8
        with:
          name: release-binaries
          path: artifacts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            # :latest on pushes to main AND on version tags
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            # :sha-<short-commit> on every push (immutable, good for rollback)
            type=sha,prefix=sha-
            # :v0.4.1 etc. on version tags
            type=semver,pattern={{version}}

      - name: Build (and push on main/tags)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          # Use the prebuilt binaries instead of compiling in-image.
          build-args: |
            BINARIES=prebuilt
          # Always load locally so Trivy can scan it; push separately below.
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # BuildKit layer cache for the runtime image (apt deps, asset copies).
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # THE STEP THAT WOULD HAVE CAUGHT v0.5.65.
      #
      # Until now nothing in this pipeline ever STARTED the image: checkout →
      # build → scan → push. A build can therefore be green, publish `:latest`,
      # and produce a container that never answers `/health` — which is exactly
      # what happened on v0.5.65, where the blue-green deployer aborted four
      # consecutive swaps and the defect was only visible on the production
      # host. A green build is not evidence the image runs.
      #
      # The image is already `load: true`d above for Trivy, so this costs one
      # container start and no extra pull.
      #
      # `AUTH_MODE=local` is required, not cosmetic: the server refuses to boot
      # under any other mode without OIDC credentials, and a smoke test is not
      # the place to hold real ones. Everything else runs at its default —
      # sqlite, no worker secret (one is generated), no MCP — which is enough to
      # prove the binary starts, migrations apply, and the HTTP server serves.
      #
      # `PUBLIC_BASE_URL` is what actually MOUNTS the MCP surfaces. Setting
      # `MCP_MODE` alone is not enough — without an issuer/resource the server
      # logs "MCP_MODE=read_write but no issuer/resource could be resolved;
      # /mcp not mounted" and carries on, so the first version of this proved
      # only that the server boots with the variable set. Production has a
      # PUBLIC_BASE_URL and therefore builds the MCP tool catalog at boot,
      # whose descriptions and schemas derive from AssignmentLanguage.allCases
      # — the last startup path CI was not exercising.
      #
      # `MCP_ALLOW_OPEN_GUARDS=true` clears the SECOND gate. PUBLIC_BASE_URL
      # alone only got as far as "Refusing to mount /mcp: MCP_ALLOWED_HOSTS and
      # MCP_ALLOWED_ORIGINS unset in production" — the DNS-rebinding guards.
      # Production pins Host/Origin at its reverse proxy; the smoke has no
      # proxy and makes no cross-origin request, so opening the guards here is
      # the honest equivalent. Note /health does NOT assert that /mcp mounted,
      # so this is checked by reading the boot log, not by the probe.
      #
      # `ENABLE_NON_SSO_AUTH_MODES=true` must accompany AUTH_MODE. `AUTH_MODE` alone is
      # SILENTLY IGNORED — the default mode is SSO and `AuthConfig` only honours
      # a local/dual request when this second flag is set, logging "AUTH_MODE=
      # local ignored ... using sso" and then trapping on the missing
      # OIDC_CLIENT_ID. The first version of this step set only AUTH_MODE and
      # died exactly that way, which is worth knowing: the two variables are a
      # pair, and setting one of them looks like it worked right up until boot.
      #
      # The budget MIRRORS PRODUCTION deliberately: `wait_healthy` in
      # scripts/bluegreen-deploy.sh gives a new color 90s
      # (CHICKADEE_HEALTH_TIMEOUT). Matching it means this step fails whenever
      # the deployer would abort, rather than passing on a slower-but-tolerated
      # boot and letting the difference reach the host.
      - name: Smoke-test the image (boot it and probe /health)
        run: |
          set -euo pipefail
          IMAGE='${{ fromJSON(steps.meta.outputs.json).tags[0] }}'

          # `--network host`: the container must reach the postgres SERVICE,
          # which Actions maps onto the runner's own localhost. Host networking
          # also means the server's 8080 is reachable directly, so no -p.
          run_server () {
            docker rm -f chickadee-smoke >/dev/null 2>&1 || true
            docker run -d --name chickadee-smoke --network host \
              -e AUTH_MODE=local \
              -e ENABLE_NON_SSO_AUTH_MODES=true \
              -e MCP_MODE=read_write \
              -e PUBLIC_BASE_URL=http://127.0.0.1:8080 \
              -e MCP_ALLOW_OPEN_GUARDS=true \
              -e DATABASE_BACKEND=postgres \
              -e DATABASE_HOST=127.0.0.1 \
              -e DATABASE_PORT=5432 \
              -e DATABASE_NAME=chickadee_smoke \
              -e DATABASE_USER=postgres \
              -e DATABASE_PASSWORD=postgres \
              "$IMAGE" >/dev/null
          }

          # Probes /health for $1 seconds. Records the HTTP CODE rather than
          # using `curl -sf`: the deployer's gate cannot tell "no response" from
          # "503", and /health answers 503 whenever its database check fails, so
          # a broken image and a healthy image that cannot reach its database
          # look identical from off-host. That ambiguity is most of why v0.5.65
          # was hard to diagnose remotely.
          probe () {
            local budget="$1" i last_code=000
            for i in $(seq 1 "$budget"); do
              last_code="$(curl -s -o /tmp/health.body -w '%{http_code}' \
                http://127.0.0.1:8080/health 2>/dev/null)" || true
              [ -n "$last_code" ] || last_code=000
              if [ "$last_code" = "200" ]; then
                echo "  healthy after ~${i}s (HTTP 200)"
                return 0
              fi
              if [ "$(docker inspect -f '{{.State.Running}}' chickadee-smoke 2>/dev/null)" != "true" ]; then
                echo "::error::The container EXITED before answering /health — the server process died at startup."
                return 1
              fi
              sleep 1
            done
            if [ "$last_code" = "000" ]; then
              echo "::error::No HTTP response from /health within ${budget}s — the server never began serving."
            else
              echo "::error::/health answered ${last_code}, not 200 — the server is up but degraded (503 means its database check failed)."
              echo "----- /health body -----"; cat /tmp/health.body 2>/dev/null || true; echo
            fi
            return 1
          }

          dump_and_fail () {
            echo "----- docker inspect -----"
            docker inspect -f 'State: {{.State.Status}}  ExitCode: {{.State.ExitCode}}  OOMKilled: {{.State.OOMKilled}}  Error: {{.State.Error}}' chickadee-smoke || true
            echo "----- container logs (tail 200) -----"
            docker logs --tail 200 chickadee-smoke 2>&1 || true
            docker rm -f chickadee-smoke >/dev/null 2>&1 || true
            exit 1
          }

          # PHASE 1 — cold boot against an EMPTY postgres. This applies every
          # migration, so it gets a generous budget: prod's database is already
          # migrated and never pays this cost at boot.
          # THE NUMBER THE DEPLOY HOST CARES ABOUT. Every blue-green swap
          # pulls this image while the live color still holds the previous one,
          # so the host needs room for BOTH plus the rollback target. The Java
          # arc added a JDK to the runtime layer (+387 MB by apt's own
          # accounting), and buildx never prints a final size anywhere — so it
          # has never been visible in CI at all. Printed unconditionally, on
          # every build, so the trend is greppable rather than archaeological.
          echo "----- image size -----"
          docker image inspect "$IMAGE" --format 'size: {{.Size}} bytes ({{.Size}} / 1e9 GB)' || true
          docker image inspect "$IMAGE" --format '{{.Size}}' \
            | awk '{ printf "size: %.2f GB\n", $1/1e9 }' || true

          # THE ASSERTION THAT WOULD HAVE CAUGHT v0.5.65. The application user
          # is created with `useradd --system`, which allocates the highest FREE
          # system ID counting down from 999 — so installing a package that
          # creates its own system users silently moves it. `default-jdk` moved
          # it 999 -> 997, and every deploy onto the real data volume (owned by
          # 999, with .mcp-signing-key at mode 0600) crash-looped at boot while
          # every test here stayed green, because a FRESH volume takes whatever
          # UID writes it first. Nothing downstream of the image can see this;
          # it has to be asserted on the image itself.
          echo "----- application user -----"
          image_uid="$(docker run --rm --entrypoint id "$IMAGE" -u)"
          echo "uid: $image_uid"
          if [ "$image_uid" != "999" ]; then
            echo "::error::Application user UID is $image_uid, expected 999. An existing deployment's data volume is owned by 999; a different UID cannot read its own 0600 signing key and will crash-loop at boot on every host that already has data. Pin the UID in the Dockerfile rather than relaxing this check."
            exit 1
          fi

          # The application user must not be able to write under /app. A test
          # script runs as that user, so a writable /app let a script on a
          # runner without a read-only root file system add files there or
          # replace the runner binary. The boot phases below then prove that
          # the server does not need to write there either.
          echo "----- /app ownership -----"
          writable="$(docker run --rm --entrypoint find "$IMAGE" /app ! -type l -writable -print -quit)"
          if [ -n "$writable" ]; then
            echo "::error::The application user can write $writable. Keep /app owned by root in the Dockerfile; only /data belongs to the application user."
            exit 1
          fi
          echo "no path under /app is writable by the application user"

          # A worker-graded R test can load the tidyverse core, as a
          # browser-graded one can in the xeus-r kernel. Without a package in
          # the image, such a test passes in the browser and fails on the worker.
          echo "----- R packages -----"
          docker run --rm --entrypoint Rscript "$IMAGE" -e '
            for (p in c("dplyr", "tidyr", "readr", "stringr", "tibble", "purrr", "forcats")) {
              suppressPackageStartupMessages(library(p, character.only = TRUE))
              cat(p, format(packageVersion(p)), "\n")
            }' \
            || { echo "::error::Rscript cannot load the tidyverse core in the image. Keep the r-cran-* packages in the Dockerfile."; exit 1; }

          echo "Phase 1: cold boot against empty postgres (applies migrations) ..."
          run_server
          probe 240 || dump_and_fail

          # PHASE 2 — the production mirror. Restart against the NOW-MIGRATED
          # database and hold it to the same 90s `wait_healthy` budget
          # scripts/bluegreen-deploy.sh gives a new color
          # (CHICKADEE_HEALTH_TIMEOUT). This is the shape of a real deploy: an
          # existing database, no migrations to apply, 90 seconds to answer.
          echo "Phase 2: restart against the migrated database (mirrors a production swap) ..."
          run_server
          probe 90 || dump_and_fail

          # Printed on SUCCESS too, and generously: the boot sequence of a
          # known-good image is the baseline a future failure gets diffed
          # against, and it costs nothing to keep it in the log.
          echo "----- container logs (tail 80, for the record) -----"
          docker logs --tail 80 chickadee-smoke 2>&1 || true
          docker rm -f chickadee-smoke >/dev/null 2>&1 || true
      # The runner container starts as root for one pre-step,
      # deploy/runner-entrypoint.sh, which delegates a cgroup subtree for the
      # jobs and then starts the runner as uid 999 with no capability. No
      # other job here has Docker with cgroup v2, so this is the only place
      # that proves it. It uses the Compose runner service itself, so its
      # user, capabilities and security options are the ones a host runs.
      #
      # The hosted runner's AppArmor refuses user namespaces to a user that is
      # not root, as Ubuntu 23.10 and later do by default. deploy/README.md
      # tells an operator to relax it for the sandbox; this does the same.
      - name: "Runner container: job cgroups and the drop to uid 999"
        run: |
          set -euo pipefail
          IMAGE='${{ fromJSON(steps.meta.outputs.json).tags[0] }}'
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          docker tag "$IMAGE" ghcr.io/jimwallace/chickadee:latest
          export RUNNER_SHARED_SECRET=ci-placeholder-secret

          echo "----- the pre-step, with a probe as the command -----"
          docker compose run --rm --no-deps \
            -v "$PWD/scripts/ci-runner-cgroup-probe.sh:/probe.sh:ro" \
            runner "exec /bin/sh /probe.sh"

          # Every command runs through the pre-step, so a command that an
          # override or `compose run` sets also runs as uid 999. Before the
          # pre-step became the entrypoint, an override that replaced the
          # command started the runner as root.
          echo "----- a replaced command runs as uid 999 -----"
          run_uid="$(docker compose run --rm --no-deps runner "id -u" 2>/dev/null | tail -n 1)"
          echo "uid: $run_uid"
          [ "$run_uid" = "999" ] \
            || { echo "::error::A replaced runner command runs as uid $run_uid, not 999."; exit 1; }

          echo "----- the runner itself -----"
          docker compose up -d --no-deps runner
          sleep 15
          cid="$(docker compose ps -a -q runner)"
          state="$(docker inspect -f '{{.State.Status}} {{.RestartCount}}' "$cid")"
          # Capture the log once, and filter it only with readers that read
          # all their input. Piped into `head` or `grep -q`, which close the
          # pipe early, `docker compose logs` exited 255 and pipefail ended
          # the step.
          runner_log="$(docker compose logs runner 2>&1)"
          printf '%s\n' "$runner_log" | sed -n 1,20p
          if [ "$state" != "running 0" ]; then
            echo "::error::The runner does not stay up (state: $state)."
            exit 1
          fi
          printf '%s\n' "$runner_log" | grep "job cgroups delegated at /sandbox/jobs" >/dev/null \
            || { echo "::error::The pre-step did not delegate the job cgroups."; exit 1; }
          # The runner's own startup probe runs one sandboxed command in a job
          # cgroup and requires it to run there, read its memory limit and fail
          # to change it.
          printf '%s\n' "$runner_log" | grep runner_configuration || true
          printf '%s\n' "$runner_log" | grep '"job_cgroups":"enabled"' >/dev/null \
            || { echo "::error::The runner does not use job cgroups; its warning is in the log above."; exit 1; }
          # Read the runner process from the host.
          pid="$(docker inspect -f '{{.State.Pid}}' "$cid")"
          status="$(sudo grep -E '^(Uid|CapEff|CapBnd):' "/proc/$pid/status")"
          cgroup="$(sudo cat "/proc/$pid/cgroup")"
          echo "$status"; echo "cgroup (host view): $cgroup"
          # A cgroup that gives controllers to its children cannot hold a
          # process, and the container's own cgroup now does. An operator
          # still needs `docker exec`, which Docker places in the cgroup of
          # the container's first process, /sandbox/runner.
          exec_cgroup="$(docker exec "$cid" cat /proc/self/cgroup)" \
            || { echo "::error::docker exec into the runner fails after the pre-step."; exit 1; }
          echo "docker exec runs in: $exec_cgroup"
          echo "$status" | grep -qE '^Uid:[[:space:]]+999[[:space:]]+999[[:space:]]+999[[:space:]]+999' \
            || { echo "::error::The runner does not run as uid 999."; exit 1; }
          [ "$(echo "$status" | grep -c '0000000000000000$')" = "2" ] \
            || { echo "::error::The runner holds a capability."; exit 1; }
          case "$cgroup" in
            0::*/sandbox/runner) ;;
            *) echo "::error::The runner is in $cgroup, not /sandbox/runner."; exit 1 ;;
          esac
          docker compose down

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL

      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            BINARIES=prebuilt
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
