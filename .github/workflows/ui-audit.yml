name: UI audit

# Runs the `ui-audit` agent over the WHOLE web UI once a month and files the
# report as one GitHub issue. The `ui-review` workflow reviews one pull request
# at a time; this one compares pages with each other and applies the usability
# heuristics in docs/ui-design.md ("Usability heuristics").
#
# A REPORT, NEVER A GATE. Nothing here blocks a merge. The findings are
# judgement, and a person triages them. A finding that recurs becomes a rule in
# docs/ui-design.md, and a guard when the rule is mechanical; that is the path
# from this report to enforcement.
#
# The brief is `.claude/agents/ui-audit.md`, the same file a Claude Code
# session runs as a subagent. This workflow holds no second copy of it.
#
# THREE JOBS. `capture` runs in the Swift CI container, builds the server and
# screenshots the pages in Tools/visual-regression/pages.mjs, one per page
# archetype, in light and dark, and some at 375px (run-visual.sh
# --capture-only). The agent reviews the other pages from their source.
# `audit` runs on the plain runner, because claude-code-action does not run
# inside a job container, and reads those screenshots plus the source. When
# the capture fails, the audit still runs on the source alone and says so in
# its report. `audit` is read-only, and the agent gets only that job's token
# (.github/actions/claude-agent). `file` runs no model: it cleans the report
# with scripts/ci-agent-sanitize.sh and files the issue.
#
# ONE OPEN ISSUE. Each run opens a new issue labelled `ui-audit` and closes the
# previous one with a link. The agent reads the previous report and carries
# forward every finding that is still true, so the open issue is always the
# whole current state.
#
# WHAT IT NEEDS. One repository secret, ANTHROPIC_API_KEY (or
# CLAUDE_CODE_OAUTH_TOKEN for a Claude subscription). Without either the job
# says so and passes, on the same rule ui-review.yml follows.

on:
  schedule:
    # 07:23 UTC on the first day of each month.
    - cron: "23 7 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ui-audit
  cancel-in-progress: false

jobs:
  capture:
    name: capture
    runs-on: ubuntu-latest
    # Same budget as visual-regression.yml, for the same reason: a cold server
    # build in browser-probe-setup can take most of it.
    timeout-minutes: 50
    container:
      image: ghcr.io/jimwallace/chickadee/swift-ci:6.4-resolute
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --privileged

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/browser-probe-setup
        with:
          browser: chromium
          node-project: Tools/visual-regression

      - name: Capture the pages in pages.mjs
        working-directory: Tools/visual-regression
        run: ./run-visual.sh --capture-only

      - name: Upload captures
        uses: actions/upload-artifact@v7
        with:
          name: ui-audit-captures
          path: visual-captures/
          retention-days: 30

  audit:
    name: ui-audit
    needs: capture
    # Run on the source alone when the capture failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Read only. The write scope is in the `file` job.
    permissions:
      contents: read
      issues: read
    outputs:
      outcome: ${{ steps.audit.outputs.outcome }}
      result: ${{ steps.audit.outputs.structured-output }}
      previous: ${{ steps.previous.outputs.open }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download captures
        id: captures
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ui-audit-captures
          path: visual-captures/

      # The agent gets the previous report as a file, so it needs no GitHub
      # access of its own.
      - name: Find the previous audit
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          CAPTURE_OUTCOME: ${{ steps.captures.outcome }}
        run: |
          set -euo pipefail
          # Newest first. Normally there is one; after a failed run there can
          # be more, and the `file` job closes all of them. On the first run
          # the label does not exist yet and the list is empty.
          open_issues="$(gh issue list --repo "$GITHUB_REPOSITORY" --label ui-audit --state open --limit 20 \
            --json number --jq '[.[].number] | sort | reverse | map(tostring) | join(" ")')"
          number="${open_issues%% *}"
          echo "open=$open_issues" >> "$GITHUB_OUTPUT"
          if [ -n "$number" ]; then
            gh issue view "$number" --repo "$GITHUB_REPOSITORY" --json body --jq .body > previous-audit.md
            echo "file=previous-audit.md" >> "$GITHUB_OUTPUT"
          else
            echo "file=none" >> "$GITHUB_OUTPUT"
          fi
          count="$(find visual-captures -name '*.png' 2>/dev/null | wc -l | tr -d ' ')"
          if [ "$CAPTURE_OUTCOME" = "success" ] && [ "$count" -gt 0 ]; then
            echo "captures=visual-captures/ ($count screenshots)" >> "$GITHUB_OUTPUT"
          else
            echo "captures=none: the capture job failed, so review the source only" >> "$GITHUB_OUTPUT"
          fi

      - name: Audit the UI
        id: audit
        uses: ./.github/actions/claude-agent
        with:
          name: ui-audit
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ github.token }}
          prompt: |
            REPO: ${{ github.repository }}
            SCREENSHOTS: ${{ steps.previous.outputs.captures }}
            PREVIOUS AUDIT: ${{ steps.previous.outputs.file }}

            You are the Chickadee ui-audit agent. Your brief is the file
            .claude/agents/ui-audit.md in the checked-out tree. Read it first
            and follow it exactly. The default branch is checked out in the
            working directory.

            The screenshots are already made. Do not run run-visual.sh.
            Do not post anything to GitHub and do not write files. Return
            the full report as Markdown in the `report` field of the
            structured output, and the number of findings at each severity
            in the other fields. Count those numbers from the findings in the
            report itself. A later job files the report as an issue.
          # A family alias, not a dated model ID: `opus` is always the newest
          # Opus. One run a month of site-wide judgement is worth the top tier.
          # The brief's `model:` line says the same for local sessions.
          model: opus
          max-turns: "120"
          allowed-tools: "Read,Grep,Glob,Bash(git log:*),Bash(git show:*)"
          disallowed-tools: "WebFetch,Bash(curl:*),Bash(wget:*),Bash(gh:*)"
          json-schema: '{"type":"object","properties":{"report":{"type":"string"},"high":{"type":"integer"},"medium":{"type":"integer"},"low":{"type":"integer"}},"required":["report","high","medium","low"]}'

      - name: Say so if the audit did not complete
        if: steps.audit.outputs.ran == 'true' && steps.audit.outputs.outcome != 'success'
        env:
          OUTCOME: ${{ steps.audit.outputs.outcome }}
        run: |
          echo "::warning::The UI audit did not complete (step outcome: $OUTCOME). Re-run the workflow."
          {
            echo "## ui-audit"
            echo
            echo "Did not complete (step outcome: $OUTCOME). Re-run the workflow."
          } >> "$GITHUB_STEP_SUMMARY"

  file:
    name: ui-audit (file the issue)
    needs: audit
    if: needs.audit.outputs.outcome == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # No model runs in this job. The checkout is `main`, for the sanitize
    # script.
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: File the report
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.audit.outputs.result }}
          PREVIOUS: ${{ needs.audit.outputs.previous }}
        run: |
          set -uo pipefail
          jq -r '.report // ""' <<< "${RESULT:-null}" > report.md
          if [ ! -s report.md ]; then
            echo "::warning::The UI audit returned no report. Re-run the workflow."
            exit 0
          fi
          # An issue body holds at most 65,536 characters. The sanitize
          # script cuts on a line and says so; the full report is an artifact.
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if ! scripts/ci-agent-sanitize.sh --max-chars 60000 \
              --cut-note "_The report is cut here. The full report is the \`ui-audit-report\` artifact of run ${run_url}._" \
              report.md body.md; then
            echo "::error::The report was refused. It was not filed."
            exit 1
          fi
          cp report.md ui-audit-report.md
          counts="$(jq -r '[.high, .medium, .low] | map(if type == "number" then floor else "?" end)
            | "\(.[0]) high, \(.[1]) medium, \(.[2]) low"' <<< "$RESULT")"
          gh label create ui-audit --repo "$GITHUB_REPOSITORY" --color 5319e7 \
            --description "Monthly site-wide UI audit (ui-audit.yml)" --force
          if ! url="$(gh issue create --repo "$GITHUB_REPOSITORY" --label ui-audit \
            --title "UI audit $(date -u +%Y-%m-%d): $counts" \
            --body-file body.md)"; then
            echo "::error::Could not file the UI audit issue. The report is in the ui-audit-report artifact."
            exit 1
          fi
          for previous in $PREVIOUS; do
            gh issue close "$previous" --repo "$GITHUB_REPOSITORY" --reason completed \
              --comment "Replaced by $url" || true
          done
          {
            echo "## ui-audit"
            echo
            echo "**Findings:** $counts"
            echo
            echo "Report: $url"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ui-audit-report
          path: ui-audit-report.md
          if-no-files-found: ignore
          retention-days: 90
