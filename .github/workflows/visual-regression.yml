name: Visual regression

# Screenshots the key pages (login, student dashboard, submit, pending
# results, instructor list, admin) in BOTH colour schemes against committed
# baselines (Tools/visual-regression/baselines/), failing on visual drift the
# static token guards can't see — the "looks right" gap in docs/ui-design.md.
# Issue #1136.  The same job then runs the axe-core accessibility scan over
# the same pages (#1137): critical/serious violations are zero-tolerance,
# moderate/minor ratchet down against a11y-baseline.json.
#
# NOT a required check (unlike editor-smoke-gate), so it is path-filtered at
# the trigger: a skipped run can't block merges.  Chromium only — one
# deterministic engine is enough to catch palette/layout regressions; engine-
# specific rendering bugs are the smoke tests' job.
#
# Intentional UI change?  Regenerate baselines (Tools/visual-regression/
# run-visual.sh --update) and commit them in the same PR — the baseline diff
# becomes part of review.  If no baselines are committed yet the job captures
# and uploads them as the `visual-baselines-bootstrap` artifact instead of
# failing (bootstrap mode).

on:
  pull_request:
    paths:
      - "Public/**"
      - "!Public/jupyterlite/**"
      - "Resources/Views/**"
      - "Tools/visual-regression/**"
      - ".github/workflows/visual-regression.yml"
  workflow_dispatch:

concurrency:
  group: visual-regression-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  visual:
    runs-on: ubuntu-latest
    # 50, not 30: `browser-probe-setup` cold-builds chickadee-server whenever the
    # shared build cache misses, and it MISSES on every PR that touches
    # Sources/** or Tests/** — the cache key hashes both, and the job that
    # populates it (`build` in swift-tests.yml) is a different workflow, so
    # `needs:` cannot order this job after it.  Measured on PR #1264: the setup
    # step alone took 23.2 min on a run that passed and 29.0 min on one that was
    # killed, against a 30 min budget.  That is 85-97% of the ceiling spent
    # before the first test runs, so the old value only ever worked on a cache
    # hit and failed as a *timeout*, which GitHub reports as `cancelled` and the
    # gate correctly treats as a failure.
    timeout-minutes: 50
    # Same swift image as the other browser jobs so the cached server binary
    # links against the right runtime, and so font rendering is stable across
    # runs (the captures pin DejaVu, shipped in this image).
    container:
      # swift-ci, not the plain mirror: it bakes in nodejs/npm (and the rest of
      # the test packages), so the probe harness does not apt-get them at job
      # start. Toolchain-identical to the mirror, so the shared .build cache
      # keys still match — see .github/docker/ci-image/Dockerfile.
      image: ghcr.io/jimwallace/chickadee/swift-ci:6.3-noble
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --privileged

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none

      # Shared scaffold: mtime normalisation, build-cache restore, server
      # build, Node + Playwright install (engine download cached).
      - uses: ./.github/actions/browser-probe-setup
        with:
          browser: chromium
          node-project: Tools/visual-regression

      - name: Capture and compare
        working-directory: Tools/visual-regression
        run: ./run-visual.sh

      - name: Accessibility scan (axe-core)
        working-directory: Tools/visual-regression
        run: ./run-a11y.sh

      # The capture above screenshots ~300ms after load, so it never observes a
      # background table repaint — the seam where the shared filter, sort, poll
      # and icon-sprite components meet. Each failure there is silent (icons
      # become empty boxes, the sort reverts, the filter forgets), so it needs
      # its own assertions rather than a picture. Reuses this job's server and
      # browser; adds a few seconds.
      - name: Table repaint probe
        working-directory: Tools/visual-regression
        run: ./run-repaint-probe.sh

      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diffs
          path: visual-diffs/
          if-no-files-found: ignore

      - name: Upload bootstrap baselines
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines-bootstrap
          path: visual-bootstrap/
          if-no-files-found: ignore
