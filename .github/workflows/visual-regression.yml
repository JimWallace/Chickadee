name: Visual regression

# Screenshots the key pages (login, student dashboard, submit, pending
# results, instructor list, admin) in BOTH colour schemes against committed
# baselines (Tools/visual-regression/baselines/), failing on visual drift the
# static token guards can't see — the "looks right" gap in docs/ui-design.md.
# Issue #1136.  The same job then runs the axe-core accessibility scan over
# the same pages (#1137): critical/serious violations are zero-tolerance,
# moderate/minor ratchet down against a11y-baseline.json.
#
# NOT a required check (unlike editor-smoke-gate), so it is path-filtered at
# the trigger: a skipped run can't block merges.  Chromium only — one
# deterministic engine is enough to catch palette/layout regressions; engine-
# specific rendering bugs are the smoke tests' job.
#
# Intentional UI change?  Regenerate baselines (Tools/visual-regression/
# run-visual.sh --update) and commit them in the same PR — the baseline diff
# becomes part of review.  If no baselines are committed yet the job captures
# and uploads them as the `visual-baselines-bootstrap` artifact instead of
# failing (bootstrap mode).
#
# WEEKLY ON MAIN. The pull request trigger is path-filtered, so a change
# outside those paths (a Core model, a route helper, a stylesheet token read
# through the server) can change a page without this job running. The weekly
# schedule runs the same job on `main`. Nothing about the comparison changes:
# the baselines are committed files, not the PR base's screenshots, so `main`
# is compared with the baselines that `main` itself carries. A red scheduled
# run means `main` renders differently from its own baselines, or fails the
# axe scan or the repaint probe. The `report` job then files one issue
# labelled `scheduled-check-failed`, keyed `visual-main`
# (scripts/dependency-issue.sh); the next green run on `main` closes it. A
# dispatch on `main` reports the same way; a dispatch on a branch reports
# nothing.

on:
  pull_request:
    paths:
      - "Public/**"
      - "!Public/jupyterlite/**"
      # Every page is an Elementary view; the icon and avatar sprites are
      # files under Resources/Sprites/.
      - "Sources/APIServer/Views/**"
      - "Resources/Sprites/**"
      # The route code builds each page's view model, so a change there can
      # change what a page renders with no view edit (#2409).
      - "Sources/APIServer/Routes/Web/**"
      - "Tools/visual-regression/**"
      - ".github/workflows/visual-regression.yml"
  schedule:
    # Thursdays at 04:52 UTC: away from the Monday cluster of weekly reports,
    # and after the Wednesday macOS build.
    - cron: "52 4 * * 4"
  workflow_dispatch:

concurrency:
  group: visual-regression-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  visual:
    runs-on: ubuntu-latest
    # 50, not 30: `browser-probe-setup` cold-builds chickadee-server whenever the
    # shared build cache misses, and it MISSES on every PR that touches
    # Sources/** or Tests/** — the cache key hashes both, and the job that
    # populates it (`build` in swift-tests.yml) is a different workflow, so
    # `needs:` cannot order this job after it.  Measured on PR #1264: the setup
    # step alone took 23.2 min on a run that passed and 29.0 min on one that was
    # killed, against a 30 min budget.  That is 85-97% of the ceiling spent
    # before the first test runs, so the old value only ever worked on a cache
    # hit and failed as a *timeout*, which GitHub reports as `cancelled` and the
    # gate correctly treats as a failure.
    timeout-minutes: 50
    # Same swift image as the other browser jobs so the cached server binary
    # links against the right runtime, and so font rendering is stable across
    # runs (the captures pin DejaVu, shipped in this image).
    container:
      # swift-ci, not the plain mirror: it bakes in nodejs/npm (and the rest of
      # the test packages), so the probe harness does not apt-get them at job
      # start. Toolchain-identical to the mirror, so the shared .build cache
      # keys still match — see .github/docker/ci-image/Dockerfile.
      image: ghcr.io/jimwallace/chickadee/swift-ci:6.4-resolute
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --privileged
    # Postgres for the server this job boots. scripts/lib/scratch-database.sh
    # creates a database per boot in it, through psql in the swift-ci image.
    services:
      postgres:
        image: ghcr.io/jimwallace/chickadee/postgres:16
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_HOST: postgres
      TEST_DATABASE_PORT: "5432"
      TEST_DATABASE_USER: postgres
      TEST_DATABASE_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v7

      # Shared scaffold: exact-match build-cache restore, server build,
      # Node + Playwright install (engine download cached).
      - uses: ./.github/actions/browser-probe-setup
        with:
          browser: chromium
          node-project: Tools/visual-regression

      - name: Capture and compare
        working-directory: Tools/visual-regression
        run: ./run-visual.sh

      # Ungated for the same reason as the probe below: axe asserts properties
      # a screenshot diff knows nothing about, and critical/serious violations
      # here are zero-tolerance. Gated on the capture, a stale baseline turned
      # that zero-tolerance gate off silently — which is how #1503's admin
      # changes reached main having never been scanned at all.
      - name: Accessibility scan (axe-core)
        if: ${{ !cancelled() }}
        working-directory: Tools/visual-regression
        run: ./run-a11y.sh

      # The capture above screenshots ~300ms after load, so it never observes a
      # background table repaint — the seam where the shared filter, sort, poll
      # and icon-sprite components meet. Each failure there is silent (icons
      # become empty boxes, the sort reverts, the filter forgets), so it needs
      # its own assertions rather than a picture. Reuses this job's server and
      # browser; adds a few seconds.
      #
      # Runs even when the capture step failed. These assert different
      # properties: the capture compares pictures, this compares behaviour, and
      # one stale baseline is a look change that says nothing about whether the
      # widgets still work. Gated on the capture, a single intentional UI change
      # silently disabled every behavioural check here for as long as the
      # baselines were pending — which is how a guard stops guarding without
      # anyone being told.
      - name: Table repaint probe
        if: ${{ !cancelled() }}
        working-directory: Tools/visual-regression
        run: ./run-repaint-probe.sh

      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diffs
          path: visual-diffs/
          if-no-files-found: ignore

      - name: Upload bootstrap baselines
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines-bootstrap
          path: visual-bootstrap/
          if-no-files-found: ignore

  # Files, updates or closes the `visual-main` issue. Never on a pull request:
  # there the red check on the PR is the report.
  report:
    needs: visual
    if: >-
      always()
      && github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
      && (needs.visual.result == 'success' || needs.visual.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      R: ${{ github.repository }}
      RESULT: ${{ needs.visual.result }}
      RUN_ID: ${{ github.run_id }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ISSUE_LABEL: scheduled-check-failed
      ISSUE_LABEL_DESCRIPTION: "A scheduled check on main failed; see scripts/dependency-issue.sh"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: File, update or close the issue
        run: |
          set -euo pipefail
          if [ "$RESULT" = "success" ]; then
            scripts/dependency-issue.sh close visual-main "Visual regression passes on main again: $RUN_URL"
            exit 0
          fi
          steps="$(gh run view "$RUN_ID" --repo "$R" --json jobs \
            --jq '.jobs[] | select(.name == "visual") | .steps[] | select(.conclusion == "failure") | "- \(.name)"' || true)"
          log="$(gh run view "$RUN_ID" --repo "$R" --log-failed 2>/dev/null \
            | cut -f3- | sed 's/^[0-9T:.-]*Z //' | tail -n 80 || true)"
          {
            echo "Visual regression (\`.github/workflows/visual-regression.yml\`) failed on \`main\` at \`${GITHUB_SHA:0:7}\`."
            echo ""
            echo "Run: $RUN_URL (the \`visual-diffs\` artifact holds each \`*.diff.png\` and \`*.actual.png\`)"
            echo ""
            echo "### Failed steps"
            echo ""
            echo "${steps:-(none reported; see the run)}"
            echo ""
            echo "### End of the failed log"
            echo ""
            echo '```'
            echo "${log:-(no log available)}"
            echo '```'
            echo ""
            echo "### Brief for an agent"
            echo ""
            echo "Make \`main\` pass visual regression again. The pull request run is path-filtered, so the change that caused this may have touched no file in its filter. Find it with \`git log\` since the last green run of this workflow on \`main\`."
            echo ""
            echo "- **Capture and compare** failed: download \`visual-diffs\` and decide for each page whether the change is intended. An intended change needs new baselines (\`Tools/visual-regression/run-visual.sh --update\`) in a PR. A regression needs a fix in a PR, and the baselines stay."
            echo "- **Accessibility scan** failed: critical and serious axe violations are zero-tolerance. Fix the markup or the style; do not add to \`a11y-baseline.json\`."
            echo "- **Table repaint probe** failed: a shared table component stopped working after a repaint. Fix the component."
            echo "- Do not skip, disable or quarantine a check, and do not loosen a threshold, to get green. Run \`ui-review\` on any UI fix, as \`Sources/APIServer/Views/CLAUDE.md\` says."
            echo "- This issue closes when the workflow next passes on \`main\`. Dispatch it on \`main\` after the fix merges."
          } > body.md
          scripts/dependency-issue.sh open visual-main "Visual regression failing on main" body.md
