name: tmp-mpl-measure

# TEMPORARY: measures matplotlib's font-cache cost in the runner image's base.
# Removed before this pull request merges.
on:
  pull_request:

permissions:
  contents: read

jobs:
  measure:
    if: github.head_ref == 'perf/rc-profiling'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build runtime-base
        run: docker build --target runtime-base -t rb .
      - name: Measure
        run: |
          docker run --rm rb bash -c '
            set -e
            echo "fonts (fc-list): $(fc-list | wc -l)"
            T="import time;t=time.time();import matplotlib;matplotlib.use(\"Agg\");import matplotlib.pyplot;print(round((time.time()-t)*1000))"
            for i in 1 2 3 4 5; do H=$(mktemp -d); echo "cold pyplot ms: $(HOME=$H python3 -c "$T" 2>/dev/null)"; done
            for i in 1 2 3 4 5; do H=$(mktemp -d); mkdir -p $H/.cache/matplotlib; cp /usr/local/share/chickadee/matplotlib/fontlist-*.json $H/.cache/matplotlib/; echo "seeded pyplot ms: $(HOME=$H python3 -c "$T" 2>/dev/null)"; done
            for i in 1 2 3; do echo "pandas ms: $(python3 -c "import time;t=time.time();import pandas;print(round((time.time()-t)*1000))")"; done
            for i in 1 2 3; do echo "bare python ms: $(python3 -c "import time,sys;print(0)")"; done
            H=$(mktemp -d); HOME=$H python3 -c "import matplotlib.pyplot" 2>&1 | head -3
          '
