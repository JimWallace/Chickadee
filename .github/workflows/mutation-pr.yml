name: Mutation testing (changed files)

# A REPORT, NEVER A GATE — same rule as the weekly sweep, and it matters more
# here because this one runs on pull requests. Nothing it says blocks a merge. A
# surviving mutant is a question: the suite could not tell the difference when
# that expression changed. Some survivors are unkillable by construction. See
# docs/mutation-testing-pilot.md before acting on anything it reports.
#
# WHY A PER-PR RUN AT ALL, given the weekly sweep exists. The sweep answers "how
# strong is the suite over this target"; this answers "did the tests arriving
# with THIS change actually pin the behaviour it adds". The second question is
# cheaper to ask and far cheaper to act on, because the author still has the code
# in their head. It is also the shape that survives the arithmetic: one mutant per
# 6 lines means a 60-line diff is ~10 mutants and a couple of minutes, where the
# whole tree is ~10,000 and never affordable.
#
# SCOPE is deliberately the same set the weekly sweep mutates
# (Tools/mutation/config.json `include`). A PR touching nothing in that set is
# skipped entirely rather than run empty, and the job says which files it took.
#
# It opts out of the drive-to-green reflex on purpose: `continue-on-error` means a
# broken Muter, a red baseline or a slow shard cannot fail somebody's pull
# request. Two runs of the weekly sweep died on infrastructure before producing a
# single mutant; none of that belongs in a contributor's way.

on:
  pull_request:
    paths:
      - "Sources/RunnerCore/**"

permissions:
  contents: read

concurrency:
  # Per PR, and cancel superseded runs: only the latest push is worth mutating.
  group: mutation-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changed:
    name: Mutate what this PR changed
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    defaults:
      run:
        # bash, explicitly. Inside a `container:` job the resolved default shell
        # is `sh`, and two steps here are bash: `mapfile` + process substitution
        # when reading the include globs, and array building (`args+=(...)`) when
        # assembling the --file list. Under dash the first of those dies at parse
        # time with "Syntax error: redirection unexpected", which is what
        # happened the first time this workflow ever ran (PR #1464 — the first
        # to touch Sources/RunnerCore since it was added).
        shell: bash
    container:
      # swift-CI, not plain swift: the -ci image carries python3, lua5.4, octave
      # and r-base. The plain one is the toolchain alone, and the failure is
      # quiet — spawnSync simply cannot find the interpreter.
      image: ghcr.io/jimwallace/chickadee/swift-ci:6.3-noble
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6
        with:
          # Need the base commit to diff against; a shallow clone cannot.
          fetch-depth: 0

      - name: Cache the patched Muter build
        uses: actions/cache@v4
        with:
          path: /tmp/muter-src
          key: muter-${{ runner.os }}-7f1f258-${{ hashFiles('Tools/mutation/0001-restore-parse-tree-cache.patch') }}

      - name: Work out which mutable files this PR touches
        id: files
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          mapfile -t includes < <(python3 -c "
          import json
          for p in json.load(open('Tools/mutation/config.json'))['include']: print(p)")

          # git's failure must NOT read as "no files changed". It did: the
          # pipeline below ended in `|| true` so that grep finding nothing is
          # not an error, and that swallowed a failing `git diff` too — which
          # then fell into the empty-result branch and reported a clean run over
          # a diff it had never looked at. Same silent-coverage-gap this file's
          # own 6-file cap comment warns about, one step earlier.
          if ! worktree_check=$(git rev-parse --is-inside-work-tree 2>&1); then
            # Print git's OWN message, and enough context to tell the two
            # candidate causes apart: a missing .git (the checkout did not land
            # where this step runs) versus a refusal to use one that is there
            # (dubious ownership — the container user differs from the owner,
            # and checkout's `safe.directory` entry went to a HOST HOME this
            # step does not share). The first version of this guard threw the
            # message away with `2>&1 >/dev/null`, which named the symptom and
            # hid the evidence.
            echo "::error::Not inside a git work tree at $(pwd); nothing was mutation-tested. git said: ${worktree_check}"
            echo "--- diagnosis ---"
            echo "whoami: $(id -un 2>/dev/null) ($(id -u 2>/dev/null))"
            echo "git: $(git --version)"
            ls -ld . .git 2>&1 || true
            git config --get-all safe.directory 2>&1 || echo "(no safe.directory entries)"
            exit 1
          fi

          if ! changed_paths=$(git diff --name-only --diff-filter=d "$base"...HEAD -- "${includes[@]}"); then
            echo "::error::git diff against base $base failed; cannot tell which files this PR changed, so nothing was mutation-tested."
            exit 1
          fi

          # Only grep's "no match" is a legitimate empty result.
          changed=$(printf '%s\n' "$changed_paths" | grep -E '\.swift$' || true)

          if [ -z "$changed" ]; then
            echo "No mutable files changed; nothing to do."
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A cap, and it is ANNOUNCED rather than silent: a report that quietly
          # covered half a diff reads as a clean bill of health for all of it.
          total=$(echo "$changed" | wc -l)
          kept=$(echo "$changed" | head -6)
          echo "$kept" > /tmp/mutate-files.txt
          echo "count=$(echo "$kept" | wc -l)" >> "$GITHUB_OUTPUT"
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "Changed mutable files ($total):"; echo "$changed"
          if [ "$total" -gt 6 ]; then
            echo "::warning::Mutating only the first 6 of $total changed files; the rest were NOT covered by this run."
          fi

      - name: Mutate them
        if: steps.files.outputs.count != '0'
        run: |
          args=()
          while read -r f; do [ -n "$f" ] && args+=(--file "$f"); done < /tmp/mutate-files.txt
          scripts/mutation-run.sh --muter-src /tmp/muter-src --out mutation-report "${args[@]}"

      - name: Report
        if: always() && steps.files.outputs.count != '0'
        run: |
          if [ -f mutation-report/report.md ]; then
            cat mutation-report/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Mutation run produced no report"
              echo ""
              echo "The run did not get far enough to measure anything, so this PR has"
              echo "**not** been mutation-tested. That is a tooling failure, not a clean"
              echo "result — see the step log."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the report
        if: always() && steps.files.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-pr
          path: mutation-report/
          if-no-files-found: warn
