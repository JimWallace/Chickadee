name: R grading smoke test

# Boots the vendored xeus-r kernel in a headless browser and grades real R test
# scripts through Public/r-grading-worker.js — the browser-graded-R path added
# in #1271.
#
# Why this needs a browser. The rest of the R grading coverage proves code
# *resolves*: Tests/BrowserRunnerJSTests runs the wrapper builder and the reply
# parser against a fake worker, and swift test never leaves the server. Neither
# boots a kernel, so the failures that would actually reach a student are
# invisible to them — a re-vendored /vendor/xeus-bootstrap.js that no longer
# matches the kernel's empack metadata, a rebuilt chickadee-r env missing a
# shared library the kernel dlopen()s, or the wrapper's quit() masking silently
# ceasing to be what test_runtime.R resolves (which would turn every R test into
# a pass). All three pass every other check in CI.
#
# REQUIRED-GATE DESIGN, matching editor-smoke.yml: the trigger is deliberately
# NOT path-filtered, because a path-filtered workflow is *skipped* on unrelated
# PRs and a required status check that is skipped blocks those merges forever.
# Instead this runs on every PR, a `changes` job decides whether the R grading
# surface was touched (fail-safe: any uncertainty runs the smoke), the expensive
# job runs only when it was, and an always-running `r-grading-smoke-gate` job
# reports the single status to require in branch protection.

on:
  schedule:
    # ~04:10 America/Toronto (08:10 UTC) — after the editor smoke slot.
    - cron: "10 8 * * *"
  pull_request:
  workflow_dispatch:

concurrency:
  group: r-grading-smoke-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run_smoke: ${{ steps.decide.outputs.run_smoke }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether the R grading surface was touched
        id: decide
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run_smoke=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if ! changed=$(git diff --name-only "$base" "$head" 2>/dev/null); then
            echo "could not diff — running the smoke to be safe"
            echo "run_smoke=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$changed" | grep -Eq '^(Public/r-grading-|Public/browser-runner\.js|Public/grading-shared\.js|Public/vendor/xeus-|Public/jupyterlite/xeus/|Tools/r-grading-smoke/|Tools/vendor/|Tools/runner-support/test_runtime\.R|scripts/setup-vendor\.sh|\.github/workflows/r-grading-smoke\.yml)'; then
            echo "run_smoke=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_smoke=false" >> "$GITHUB_OUTPUT"
          fi

  smoke:
    needs: changes
    if: needs.changes.outputs.run_smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright and its Chromium
        working-directory: Tools/r-grading-smoke
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Grade R scripts through the real xeus-r kernel
        run: node Tools/r-grading-smoke/smoke.mjs --browser chromium

  r-grading-smoke-gate:
    # Always runs, so it can be a required status check: green when the smoke
    # passed OR was not needed, red only when it actually failed.
    needs: [changes, smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: |
          if [ "${{ needs.smoke.result }}" = "failure" ] || [ "${{ needs.smoke.result }}" = "cancelled" ]; then
            echo "R grading smoke failed"
            exit 1
          fi
          echo "R grading smoke: ${{ needs.smoke.result }}"
