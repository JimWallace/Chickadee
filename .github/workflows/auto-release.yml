name: Auto Release

# Assigns the version at MERGE time so PRs never touch VERSION /
# ChickadeeVersion / CHANGELOG — those three files were the #1 source of
# merge-conflict thrash between concurrent PRs. PRs only add a changelog.d/
# fragment (see changelog.d/README.md); this workflow folds the fragments into
# a new CHANGELOG section, bumps the version, commits "chore(release)", and
# pushes a tag.
#
# Downstream triggering — important GitHub quirk: a tag pushed with the default
# GITHUB_TOKEN does NOT trigger other workflows (release.yml, docker-build),
# GitHub's loop-prevention rule. So:
#   - If a RELEASE_TOKEN secret (a fine-grained PAT, contents:write) is set, we
#     push with it and the tag triggers release.yml + docker-build naturally.
#   - Otherwise we fall back to GITHUB_TOKEN and explicitly dispatch release.yml
#     (workflow_dispatch DOES fire under GITHUB_TOKEN). The docker-build *tag*
#     build still won't fire in this mode — set RELEASE_TOKEN for full
#     automation (see docs/release-process.md).
#
# NOTE: pushes a commit + tag directly to main, which works while main is
# unprotected. If branch protection is enabled later, the pushing identity must
# be a bypass actor.

on:
  push:
    branches: [main]

# Serialise releases so two quick successive merges can't race on the bump.
concurrency:
  group: auto-release
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  # The release gate opens or updates the `minor-needed` issue.
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The `release` environment admits only `main` and `v*` tags (#3071). A
    # secret stored in it, not in the repository, cannot be read by a job on
    # any other branch. RELEASE_TOKEN belongs there.
    environment: release
    env:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
    # Never re-trigger on our own release commit, and never let the weekly
    # mutation sweep's data commit cut one. With no fragments pending that
    # commit is already a no-op, but "already a no-op" depends on timing, and a
    # release whose triggering commit is a report data file is confusing at
    # best. Both prefixes are machine-written, so neither can be typed by
    # accident.
    if: >-
      ${{ !startsWith(github.event.head_commit.message, 'chore(release):')
       && !startsWith(github.event.head_commit.message, 'chore(mutation):') }}
    steps:
      # Egress allowlist (#3075). This job holds RELEASE_TOKEN, which can push
      # to main. A step that reaches any other host fails, so a compromised
      # dependency cannot send a token out. A new host that a change really
      # needs goes on this list, in the same change.
      - name: Restrict network egress
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >
            github.com:443
            api.github.com:443

      # This checkout keeps its credentials (no persist-credentials: false):
      # a later step in this job pushes with git through them (#3068).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1  # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0
          # Prefer a PAT so the tag triggers release.yml + docker-build; fall
          # back to GITHUB_TOKEN (tag won't auto-trigger — handled below).
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      # The release gate (docs/release-gate.md). A contract change ships only
      # in a minor, which is cut by hand. So when any commit since the last
      # release tag touched a path in scripts/contract-paths.txt, this cuts
      # no release, neither a patch nor a minor: it says why in the job
      # summary and opens or updates one issue labelled `minor-needed` that
      # names the pull requests. Fragments keep accumulating in changelog.d/,
      # and the hand-cut minor folds them all. After the minor's tag, the
      # commits since the last tag are clean again and auto-release resumes.
      - name: Refuse past a contract change
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! last="$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null)"; then
            echo "No release tag is reachable from HEAD, so the gate has nothing to compare." >> "$GITHUB_STEP_SUMMARY"
            echo "blocked=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git log --format= --name-only "$last..HEAD" | sed '/^$/d' | sort -u \
            | scripts/contract-changes.sh > contract.txt
          if [ ! -s contract.txt ]; then
            echo "blocked=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "blocked=true" >> "$GITHUB_OUTPUT"
          # The commits that touched a contract path, and the pull requests
          # that brought them. GitHub knows the pull request of a squash merge
          # and of each commit inside a merge commit (a Dependabot merge); a
          # commit pushed straight to main has none.
          : > commits.txt
          : > prs.txt
          for commit in $(git rev-list "$last..HEAD"); do
            if [ -n "$(git show --format= --name-only "$commit" | scripts/contract-changes.sh)" ]; then
              git log -1 --format='%h %s' "$commit" >> commits.txt
              gh api "repos/$R/commits/$commit/pulls" --jq '.[] | "#\(.number)"' >> prs.txt 2>/dev/null || true
            fi
          done
          prs="$(sort -u prs.txt | paste -sd' ' - || true)"
          {
            echo "## No release: a contract change is waiting for a minor"
            echo ""
            echo "Since \`$last\`, these commits changed the student contract (scripts/contract-paths.txt):"
            echo ""
            echo '```'
            cat commits.txt
            echo '```'
            echo ""
            echo "A contract change ships only in a minor, which is cut by hand (docs/release-process.md, \"Cutting a minor (or major) release\"). Until then no release is cut, and the changelog fragments stay in changelog.d/."
          } > body.md
          cat body.md >> "$GITHUB_STEP_SUMMARY"
          gh label create minor-needed --repo "$R" --color B60205 \
            --description "A contract change is on main; auto-release waits for a minor cut by hand" \
            >/dev/null 2>&1 || true
          {
            echo "Auto-release cut no release after \`$(git rev-parse --short HEAD)\`, because commits since \`$last\` changed the student contract (docs/release-gate.md)."
            echo ""
            echo "Pull requests: ${prs:-none named in the commit subjects}"
            echo ""
            echo "Commits:"
            echo ""
            echo '```'
            cat commits.txt
            echo '```'
            echo ""
            echo "Contract paths changed:"
            echo ""
            echo '```'
            head -40 contract.txt
            echo '```'
            echo ""
            echo "To release: cut the minor by hand (docs/release-process.md, \"Cutting a minor (or major) release\"). The deployer then holds it until an admin approves it on the admin page. Close this issue after the minor's tag is pushed."
          } > issue.md
          existing="$(gh issue list --repo "$R" --state open --label minor-needed --limit 1 \
            --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "$R" --body-file issue.md >/dev/null
            echo "Updated issue #$existing." >> "$GITHUB_STEP_SUMMARY"
          else
            gh issue create --repo "$R" --label minor-needed \
              --title "A contract change is waiting for a minor release" --body-file issue.md
          fi

      - name: Assemble release from changelog fragments
        id: assemble
        if: steps.gate.outputs.blocked != 'true'
        run: |
          set +e
          version="$(scripts/assemble-release.sh)"
          code=$?
          set -e
          if [ "$code" -eq 3 ]; then
            echo "No changelog fragments — nothing to release."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$code" -ne 0 ]; then
            echo "assemble-release.sh failed (exit $code)" >&2
            exit "$code"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "released=true" >> "$GITHUB_OUTPUT"

      - name: Commit, tag, and push
        if: steps.assemble.outputs.released == 'true'
        run: |
          version="${{ steps.assemble.outputs.version }}"
          git config user.name "chickadee-release[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): v${version}"
          git tag -a "v${version}" -m "Chickadee v${version}"
          git push origin HEAD:main
          git push origin "v${version}"

      - name: Dispatch GitHub Release (only when no RELEASE_TOKEN)
        # With a PAT the tag already triggered release.yml; only dispatch in the
        # GITHUB_TOKEN fallback to avoid a duplicate release.
        if: ${{ steps.assemble.outputs.released == 'true' && env.RELEASE_TOKEN == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release.yml -f tag="v${{ steps.assemble.outputs.version }}"
