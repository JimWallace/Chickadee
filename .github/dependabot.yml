version: 2
updates:
  # Swift package graph (Package.swift + Package.resolved).
  #
  # Grouped so a quiet period does not produce one PR per transitive pin. The
  # SwiftLint plugin is deliberately NOT in that group: scripts/swiftlint.sh
  # runs `--strict`, so a new rule in a patch release fails format-lint, and
  # that needs to land as its own reviewable PR rather than inside a batch.
  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      swift-server-ecosystem:
        patterns:
          - "*"
        exclude-patterns:
          - "github.com/simplydanny/swiftlintplugins"

  # The WebAssembly package graph (wasm/Package.swift + wasm/Package.resolved),
  # which the entry above does NOT cover: `directory` is not recursive, so a
  # root-only Swift entry sees /Package.swift and nothing else.
  #
  # That gap has already cost us. JavaScriptKit 0.59.0 was needed to fix a
  # `PackageToJS` bug that inferred the target triple from the build artifact's
  # directory path — under Swift Build it inferred the literal string
  # `Products`, so `IS_WASI` went false and the loader shipped without the WASI
  # shim. It landed by hand in #1522. Dependabot never saw it and, pointed only
  # at the root, never could.
  #
  # Deliberately NOT grouped, for the reason the SwiftLint plugin is excluded
  # from the group above: JavaScriptKit sits under the browser grading runner,
  # a bump there has broken the shipped artifact once already, and it needs to
  # land as its own reviewable PR rather than inside a batch. A green build is
  # not sufficient evidence here — verify the artifact still instantiates
  # (`node --test Tests/BrowserRunnerJSTests/*.mjs`).
  - package-ecosystem: "swift"
    directory: "/wasm"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3

  # Both Dockerfiles. `/` is the production image; `/.github/docker/ci-image`
  # is the CI image, and it needs naming explicitly for the same reason the
  # wasm graph does — `directory` does not recurse.
  #
  # Temper your expectations of the CI image entry, on two counts. Its base is
  # `ghcr.io/jimwallace/chickadee/swift:<tag>`, our own mirror, so Dependabot
  # can only ever offer a tag `mirror-images.yml` has already pushed — quiet by
  # construction, and it cannot race the deliberate Swift-version migration
  # driven from issue #1520. And the base arrives through an `ARG BASE_IMAGE`
  # default rather than a literal `FROM`, which Dependabot reads less reliably
  # than a plain tag. So this may well produce nothing. It is here because the
  # file should be watched rather than silently outside the config, and because
  # a later change to a literal tag or a digest pin is then covered already.
  #
  # NOT added: `docker-compose.yml`. Dependabot has a `docker-compose`
  # ecosystem, but both services there run `ghcr.io/jimwallace/chickadee:latest`
  # — our own image at a moving tag — so there is no version for it to bump.
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/.github/docker/ci-image"
    schedule:
      interval: "weekly"
      day: "monday"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions:
        patterns:
          - "*"

  # First-party frontend tooling and the browser-probe harnesses. None of this
  # ships to a user: eslint lints Public/*.js, the three Tools/ harnesses drive
  # Playwright in CI, and Tools/vendor builds the bytes under Public/vendor/.
  #
  # Tools/vendor is the one to read carefully rather than merge on green. Its
  # output is COMMITTED (Public/vendor/codemirror.js, jszip.min.js,
  # xeus-bootstrap.js), so a bump there changes nothing until
  # scripts/setup-vendor.sh reruns and the regenerated bytes are committed in
  # the same PR.
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/Tools/editor-smoke-test"
      - "/Tools/browser-grading-smoke"
      - "/Tools/visual-regression"
      - "/Tools/vendor"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      frontend-tooling:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # JupyterLite build pins. A bump here is NOT mergeable on its own: the
  # committed kernels under Public/jupyterlite/ are built from these pins by
  # .github/workflows/revendor-kernels.yml, and check-env-vendored-sync.sh
  # fails when the declared intent and the shipped bytes disagree. Treat a PR
  # from this ecosystem as a notification that a re-vendor is available, and
  # run that workflow on the branch before merging.
  - package-ecosystem: "pip"
    directory: "/Tools/jupyterlite"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2

  # NOT HERE: the xeus kernel environments, and this is deliberate.
  #
  # Dependabot HAS a `conda` ecosystem, so the obvious move is to point it at
  # Tools/jupyterlite/environment-*.yml and call the kernels covered. It does
  # not work, for four independent reasons — any one of them fatal, and two of
  # them would fail silently rather than loudly:
  #
  #   1. Its file fetcher matches `environment.yml` / `environment.yaml` and
  #      nothing else. Ours are environment-python.yml, environment-r.yml,
  #      environment-lua.yml and environment-octave.yml. They cannot be
  #      collapsed into one file: a kernel fetches its whole environment at
  #      boot, so a shared env makes every Python boot pull r-base and every R
  #      boot pull numpy/pandas/matplotlib. That reason is written at the top
  #      of each of the four files.
  #   2. It resolves against `https://anaconda.org/<channel>/<package>`. Our
  #      channel is https://repo.prefix.dev/emscripten-forge-4x, which is not
  #      on anaconda.org. xeus-lua and xeus-octave do not exist there at all.
  #   3. For a name conda-forge does carry, the versions published are for
  #      linux-64 and friends, never emscripten-wasm32. A bump derived from
  #      them would not merely be useless, it would be wrong.
  #   4. Its update checker returns no candidate when every requirement is nil
  #      or "*". Ours are deliberately bare names, so there would be nothing
  #      for it to bump even if 1-3 were solved.
  #
  # The gap is real — the kernels move with no file in this repository
  # changing — so it is closed elsewhere, by asking the solver that actually
  # ships them: scripts/check-kernel-currency.py, run weekly by
  # .github/workflows/kernel-currency.yml.
