# The comment above each entry says where the package is used here and what
# its update needs. Keep them true and specific.
#
# UPDATES LAND ON THEIR OWN. .github/workflows/dependabot-auto.yml regenerates
# any committed output a bump feeds and enables auto-merge on every Dependabot
# PR, so the required checks on `main` decide: green merges, red waits. A red
# PR, a PR that stalls, and a security alert Dependabot cannot fix each become
# an issue labelled `dependency-update-failed` (dependency-failure.yml and
# dependency-health.yml), which is what a person or an agent picks up. To hold
# a package back, add an `ignore` entry with a comment that says why.
#
# WAIT BEFORE TAKING A RELEASE. A merged update reaches production in about
# 15 minutes with no person involved, so every entry has a `cooldown`: a new
# version is offered only once it is 3 days old, and a new major version only
# once it is 14 days old. Most compromised releases of a package are found and
# withdrawn within that time. Cooldown delays version updates only; a security
# update is offered at once. Docker and GitHub Actions take `default-days` only,
# because Dependabot does not read their tags as SemVer.
#
# GROUP WHAT MOVES TOGETHER. Packages that pin each other exactly, such as a
# metapackage and its core, must be one group, or each PR is unresolvable on
# its own (#2863).
#
# The `Default` branch ruleset requires `editor-smoke-gate` on every branch,
# and Dependabot is not a bypass actor, so `refs/heads/dependabot/**/*` must be
# in its excluded refs or no PR opens; the update jobs still log "created".
# The `/*` is necessary: at the end of a ruleset pattern, `**` matches one
# path level only, so `dependabot/**` excludes `dependabot/x` but not a real
# branch such as `dependabot/npm_and_yarn/eslint-10.14.0`. To check a branch
# name: gh api repos/JimWallace/Chickadee/rules/branches/BRANCH (an empty
# list means no rule applies).
version: 2
updates:
  # Swift package graph (Package.swift + Package.resolved).
  #
  # Dependabot's Swift toolchain (6.3.1 as of November 2026) refuses our
  # swift-tools-version 6.4 manifests, so both Swift entries fail before they
  # compare anything. .github/workflows/swift-currency.yml asks the CI
  # toolchain instead, every Monday. Keep these entries: they work again once
  # Dependabot catches up.
  #
  # Grouped so a quiet period does not produce one PR per transitive pin. The
  # SwiftLint plugin is deliberately NOT in that group: scripts/swiftlint.sh
  # runs `--strict`, so a new rule in a patch release fails format-lint, and
  # that needs to land as its own reviewable PR rather than inside a batch.
  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3
      semver-major-days: 14
    open-pull-requests-limit: 5
    groups:
      swift-server-ecosystem:
        patterns:
          - "*"
        exclude-patterns:
          - "github.com/simplydanny/swiftlintplugins"

  # The WebAssembly package graph (wasm/Package.swift + wasm/Package.resolved),
  # which the entry above does NOT cover: `directory` is not recursive, so a
  # root-only Swift entry sees /Package.swift and nothing else.
  #
  # That gap has already cost us. JavaScriptKit 0.59.0 was needed to fix a
  # `PackageToJS` bug that inferred the target triple from the build artifact's
  # directory path — under Swift Build it inferred the literal string
  # `Products`, so `IS_WASI` went false and the loader shipped without the WASI
  # shim. It landed by hand in #1522. Dependabot never saw it and, pointed only
  # at the root, never could.
  #
  # Deliberately NOT grouped, for the reason the SwiftLint plugin is excluded
  # from the group above: JavaScriptKit sits under the browser grading runner,
  # a bump there has broken the shipped artifact once already, and it needs to
  # land as its own reviewable PR rather than inside a batch. A green build is
  # not sufficient evidence here — verify the artifact still instantiates
  # (`node --test Tests/BrowserRunnerJSTests/*.mjs`).
  - package-ecosystem: "swift"
    directory: "/wasm"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3
      semver-major-days: 14
    open-pull-requests-limit: 3

  # Both Dockerfiles. `/` is the production image; `/.github/docker/ci-image`
  # is the CI image, and it needs naming explicitly for the same reason the
  # wasm graph does — `directory` does not recurse.
  #
  # Temper your expectations of the CI image entry, on two counts. Its base is
  # `ghcr.io/jimwallace/chickadee/swift:<tag>`, our own mirror, so Dependabot
  # can only ever offer a tag `mirror-images.yml` has already pushed — quiet by
  # construction, and it cannot race the deliberate Swift-version migration
  # driven from issue #1520. And the base arrives through an `ARG BASE_IMAGE`
  # default rather than a literal `FROM`, which Dependabot reads less reliably
  # than a plain tag. So this may well produce nothing. It is here because the
  # file should be watched rather than silently outside the config, and because
  # a later change to a literal tag or a digest pin is then covered already.
  #
  # NOT added: `docker-compose.yml`. Dependabot has a `docker-compose`
  # ecosystem, but both services there run `ghcr.io/jimwallace/chickadee:latest`
  # — our own image at a moving tag — so there is no version for it to bump.
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/.github/docker/ci-image"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns:
          - "*"

  # First-party frontend tooling and the browser-probe harnesses. None of this
  # ships to a user: eslint lints Public/*.js, the three Tools/ harnesses drive
  # Playwright in CI, and Tools/vendor builds the bytes under Public/vendor/.
  #
  # Tools/vendor's output is COMMITTED (Public/vendor/codemirror.js,
  # jszip.min.js, xeus-bootstrap.js), so a bump there changes nothing until
  # scripts/setup-vendor.sh reruns. dependabot-auto.yml reruns it and commits
  # the bytes on the Dependabot branch before it enables auto-merge.
  #
  # The root package.json forces minimatch past eslint's range with npm
  # `overrides`: eslint 10 pins a minimatch with a denial-of-service advisory,
  # Dependabot cannot lift it, and eslint is lint tooling that ships nothing.
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/Tools/editor-smoke-test"
      - "/Tools/browser-grading-smoke"
      - "/Tools/visual-regression"
      - "/Tools/vendor"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3
      semver-major-days: 14
    open-pull-requests-limit: 5
    # untarjs 5.4.0 was published without lib/unpack.js, so the esbuild step
    # in scripts/setup-vendor.sh fails (PR #2918). Version 5.4.1 has the file,
    # but the cooldown above holds it back until 2026-11-12. Remove this entry
    # after that date.
    ignore:
      - dependency-name: "@emscripten-forge/untarjs"
        versions: ["5.4.0"]
    groups:
      frontend-tooling:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # JupyterLite build pins. The committed kernels under Public/jupyterlite/
  # are built from these pins by .github/workflows/revendor-kernels.yml, so a
  # bump changes nothing until that rebuild lands. dependabot-auto.yml
  # dispatches it on the Dependabot branch, and enables auto-merge once its
  # commit is pushed.
  #
  # jupyterlite is a metapackage that requires the jupyterlite-core of its own
  # version, and requirements.txt pins both exactly. Bumped one at a time, each
  # PR is unresolvable by pip (run 41916509055, PR #2863), so they are grouped
  # and always move together.
  - package-ecosystem: "pip"
    directory: "/Tools/jupyterlite"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3
      semver-major-days: 14
    open-pull-requests-limit: 2
    groups:
      jupyterlite:
        patterns:
          - "jupyterlite"
          - "jupyterlite-core"

  # Chickadee's own JupyterLite extension. Its built labextension is
  # COMMITTED, in the extension and again in Public/jupyterlite, so a bump
  # changes nothing until it is rebuilt; dependabot-auto.yml rebuilds and
  # commits it before it enables auto-merge. Everything here is build-time
  # only: @jupyterlab/* and @lumino/* are shared singletons that JupyterLite
  # supplies at runtime, and none of their dependencies is in the bundle.
  #
  # @jupyterlab/* and @lumino/* are one release train and pin each other, so
  # they are one group. The extension must also load in the JupyterLab that
  # the jupyterlite-core pin ships; editor-smoke-gate is what proves that.
  #
  # package.json forces katex and sanitize-html past their parents' ranges
  # with yarn `resolutions`. @jupyterlab/notebook 4.6 pins katex ^0.16 through
  # mermaid and @jupyterlab/apputils 4.7 pins sanitize-html ~2.12, both with
  # advisories, so Dependabot's security update fails with
  # security_update_not_possible. Neither package is bundled, and a rebuild
  # with and without the resolutions produced identical bytes. Drop an entry
  # once the parent's range admits the fix.
  - package-ecosystem: "npm"
    directory: "/Tools/jupyterlite/chickadee-extension"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3
      semver-major-days: 14
    open-pull-requests-limit: 3
    groups:
      jupyterlab:
        patterns:
          - "@jupyterlab/*"
          - "@lumino/*"
      extension-tooling:
        patterns:
          - "*"

  # NOT HERE: the xeus kernel environments, and this is deliberate.
  #
  # Dependabot HAS a `conda` ecosystem, so the obvious move is to point it at
  # Tools/jupyterlite/environment-*.yml and call the kernels covered. It does
  # not work, for four independent reasons — any one of them fatal, and two of
  # them would fail silently rather than loudly:
  #
  #   1. Its file fetcher matches `environment.yml` / `environment.yaml` and
  #      nothing else. Ours are environment-python.yml, environment-r.yml,
  #      environment-lua.yml and environment-octave.yml. They cannot be
  #      collapsed into one file: a kernel fetches its whole environment at
  #      boot, so a shared env makes every Python boot pull r-base and every R
  #      boot pull numpy/pandas/matplotlib. That reason is written at the top
  #      of each of the four files.
  #   2. It resolves against `https://anaconda.org/<channel>/<package>`. Our
  #      channel is https://repo.prefix.dev/emscripten-forge-4x, which is not
  #      on anaconda.org. xeus-lua and xeus-octave do not exist there at all.
  #   3. For a name conda-forge does carry, the versions published are for
  #      linux-64 and friends, never emscripten-wasm32. A bump derived from
  #      them would not merely be useless, it would be wrong.
  #   4. Its update checker returns no candidate when every requirement is nil
  #      or "*". Ours are deliberately bare names, so there would be nothing
  #      for it to bump even if 1-3 were solved.
  #
  # The gap is real — the kernels move with no file in this repository
  # changing — so it is closed elsewhere, by asking the solver that actually
  # ships them: scripts/check-kernel-currency.py, run weekly by
  # .github/workflows/kernel-currency.yml.
