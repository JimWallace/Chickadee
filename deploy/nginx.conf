# Example nginx virtual host for Chickadee.
# Copy to /etc/nginx/sites-available/chickadee and symlink to sites-enabled/.
# Replace your-vm.example.com with your actual domain.
#
# For HTTPS, use certbot or add ssl_certificate / ssl_certificate_key directives.

server {
    listen 80;
    server_name your-vm.example.com;

    # Increase body size limit to allow test-setup zip uploads (default 1m is too small).
    client_max_body_size 50m;

    # Chickadee-themed page shown when the server is unreachable (e.g. during a
    # restart or update) instead of the default nginx 502. nginx generates
    # 502/504 itself when it can't reach the upstream, so this works even though
    # the Vapor app — which renders the in-app error page — is down.
    error_page 502 503 504 /chickadee-maintenance.html;
    location = /chickadee-maintenance.html {
        # Ships with the repo at deploy/error-pages/maintenance.html.
        alias    /opt/chickadee/deploy/error-pages/maintenance.html;
        internal;
    }

    # Compress text assets, INCLUDING application/wasm — nginx's default
    # gzip_types omits it, which left Pyodide's ~8.6 MB core wasm uncompressed
    # on every cold/incognito kernel boot. (Chickadee also serves pre-compressed
    # .br/.gz for the largest assets; nginx passes those through untouched, so
    # this covers everything else — JS/JSON/CSS and any un-pre-compressed wasm.)
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/wasm application/javascript text/javascript
               application/json text/css image/svg+xml text/plain;

    # MCP Streamable HTTP transport. The POST response may be an SSE stream
    # (Content-Type: text/event-stream), so buffering must be off or nginx holds
    # events until the connection closes. A longer read timeout accommodates a
    # stream that stays open while a tool call runs.
    location /mcp {
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        # Serve the themed maintenance page if the app returns 502/503/504
        # (in addition to the case where nginx can't reach it at all).
        proxy_intercept_errors on;

        # Required for JupyterLite / WebAssembly (SharedArrayBuffer).
        # Chickadee sets these headers itself; nginx just passes them through.
        proxy_hide_header  Cross-Origin-Opener-Policy;
        proxy_hide_header  Cross-Origin-Embedder-Policy;
        add_header         Cross-Origin-Opener-Policy  "same-origin" always;
        add_header         Cross-Origin-Embedder-Policy "require-corp" always;
    }

    location /health {
        proxy_pass       http://127.0.0.1:8080/health;
        access_log       off;
    }
}
