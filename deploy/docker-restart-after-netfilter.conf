# systemd drop-in: /etc/systemd/system/docker.service.d/restart-after-netfilter.conf
#
# Docker programs its port-publishing and NAT rules into iptables chains it
# creates when the daemon starts, and it never rebuilds them if something
# removes them afterwards. `iptables-restore` REPLACES whole tables, so any
# service that runs it after dockerd started takes Docker's chains with it —
# netfilter-persistent does exactly this on restart, which an unattended kernel
# upgrade triggers, and which a configuration-management run (the IST SaltStack
# build that writes /etc/iptables/rules.v4) triggers every day.
#
# Install it on EVERY Docker host, runner hosts included. On a runner host the
# container keeps showing "Up" but cannot reach the server, so it grades
# nothing; in Sept 2026 that stopped the runner on sparrow for several days.
#
# The failure is silent and does not look like a firewall problem. Containers
# already running keep serving on their established connections, so the site
# stays up; but no new container can publish a port, and no container can open a
# new outbound connection. In Sept 2026 that cost two days: SSO and the LMS
# integration both died at the instant of the flush, every deploy failed with an
# error naming iptables, and all seven server health rules stayed green.
#
# `PartOf` is the operative line: restarting netfilter-persistent now restarts
# Docker with it, so the chains are rebuilt. The cost is a container bounce
# whenever the firewall reloads.
#
# Install:
#   sudo mkdir -p /etc/systemd/system/docker.service.d
#   sudo cp deploy/docker-restart-after-netfilter.conf \
#           /etc/systemd/system/docker.service.d/restart-after-netfilter.conf
#   sudo systemctl daemon-reload
#
# Verify the chains exist at any time:
#   sudo iptables -t filter -L DOCKER -n
#   sudo iptables -t nat -L POSTROUTING -n

[Unit]
After=netfilter-persistent.service
PartOf=netfilter-persistent.service
