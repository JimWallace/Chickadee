# nginx configuration for Chickadee running in Docker Compose.
#
# The upstream name "server" matches the service name in docker-compose.yml.
# Mount this file into the nginx container:
#   - ./deploy/nginx-docker.conf:/etc/nginx/conf.d/chickadee.conf:ro
#
# HTTP-only (default). To add HTTPS with Let's Encrypt:
#   1. Run certbot to obtain a certificate (see deploy/README.md)
#   2. Uncomment the HTTPS server block below
#   3. Uncomment "return 301 https://$host$request_uri;" in the HTTP block
#   4. Update your domain name in both server blocks
#   5. docker compose exec nginx nginx -s reload

server {
    listen 80;
    server_name _;   # replace _ with your domain name in production

    client_max_body_size 50m;

    # Uncomment to redirect all HTTP → HTTPS once certbot is set up:
    # return 301 https://$host$request_uri;

    # Chickadee-themed page shown when the upstream server is unreachable
    # (e.g. during a restart or update) instead of the default nginx 502.
    # nginx generates 502/504 itself when it can't reach the upstream, so this
    # works even though the Vapor app (which renders the in-app error page) is
    # down. proxy_intercept_errors also catches a 503 returned by the app.
    error_page 502 503 504 /chickadee-maintenance.html;
    location = /chickadee-maintenance.html {
        # Mounted via docker-compose:
        #   - ./deploy/error-pages/maintenance.html:/usr/share/nginx/html/maintenance.html:ro
        alias    /usr/share/nginx/html/maintenance.html;
        internal;
    }

    # Let's Encrypt ACME HTTP-01 challenge (needed for certbot renewal).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # MCP Streamable HTTP transport. The POST response may be an SSE stream
    # (Content-Type: text/event-stream), so buffering must be off or nginx holds
    # events until the connection closes. A longer read timeout accommodates a
    # stream that stays open while a tool call runs.
    location /mcp {
        proxy_pass         http://server:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass         http://server:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        # Serve the themed maintenance page if the app returns 502/503/504
        # (in addition to the case where nginx can't reach it at all).
        proxy_intercept_errors on;

        # Required for JupyterLite / WebAssembly (SharedArrayBuffer).
        # Chickadee sets these headers; nginx re-applies them so they
        # survive the proxy hop correctly.
        proxy_hide_header  Cross-Origin-Opener-Policy;
        proxy_hide_header  Cross-Origin-Embedder-Policy;
        add_header         Cross-Origin-Opener-Policy  "same-origin"   always;
        add_header         Cross-Origin-Embedder-Policy "require-corp" always;
    }

    location /health {
        proxy_pass  http://server:8080/health;
        access_log  off;
    }
}

